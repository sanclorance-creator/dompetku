<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <script>
    (() => {
      const clean = () => {
        const u = new URL(location.href);
        [...u.searchParams.keys()].forEach(k => {
          if (/^utm_/i.test(k) || (k.toLowerCase() === 'source' && /chatgpt/i.test(u.searchParams.get(k) || ''))) u.searchParams.delete(k);
        });
        history.replaceState(history.state, '', u.pathname + (u.search ? '?' + u.searchParams : '') + u.hash);
      };
      clean();
      addEventListener('pageshow', clean);
      let n = 0, timer = setInterval(() => { clean(); if (++n >= 20) clearInterval(timer); }, 250);
    })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B0E14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DompetKu" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>DompetKu Pro — Smart Personal Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0A0D14;
      --bg-elevated: #121621;
      --card-bg: linear-gradient(160deg, rgba(25, 30, 44, 0.92) 0%, rgba(16, 20, 30, 0.96) 100%);
      --card-solid: #151A26;
      --card-hover: rgba(32, 39, 56, 0.95);
      --glass-border: rgba(255, 255, 255, 0.075);
      --glass-highlight: rgba(255, 255, 255, 0.14);
      --text-main: #F8FAFC;
      --text-sub: #94A3B8;
      --text-muted: #64748B;
      --blue: #1D6FF2;
      --blue-light: #3B82F6;
      --blue-glow: rgba(29, 111, 242, 0.38);
      --emerald: #00E58F;
      --emerald-soft: rgba(0, 229, 143, 0.14);
      --danger: #FF4D6A;
      --danger-soft: rgba(255, 77, 106, 0.14);
      --warning: #F59E0B;
      --input-bg: rgba(11, 14, 21, 0.75);
      --shadow-card: 0 18px 40px -12px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.07);
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html[data-theme="light"] {
      --bg-main: #F1F5F9;
      --bg-elevated: #FFFFFF;
      --card-bg: linear-gradient(160deg, #FFFFFF 0%, #F8FAFC 100%);
      --card-solid: #FFFFFF;
      --card-hover: #F1F5F9;
      --glass-border: rgba(15, 23, 42, 0.08);
      --glass-highlight: rgba(15, 23, 42, 0.15);
      --text-main: #0F172A;
      --text-sub: #475569;
      --text-muted: #64748B;
      --blue: #1D6FF2;
      --blue-light: #2563EB;
      --blue-glow: rgba(29, 111, 242, 0.25);
      --emerald: #059669;
      --emerald-soft: rgba(16, 185, 129, 0.12);
      --danger: #E11D48;
      --danger-soft: rgba(225, 29, 72, 0.1);
      --input-bg: #F8FAFC;
      --shadow-card: 0 12px 28px -8px rgba(15, 23, 42, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      background-image:
        radial-gradient(circle at 15% 0%, rgba(29, 111, 242, 0.13), transparent 42%),
        radial-gradient(circle at 85% 15%, rgba(0, 229, 143, 0.07), transparent 38%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
      transition: background-color 0.35s var(--ease-spring), color 0.35s var(--ease-spring);
    }

    svg {
      display: block;
      flex-shrink: 0;
    }

    /* Smooth Keyframes */
    @keyframes fadeUpSpring {
      0% { opacity: 0; transform: translateY(14px) scale(0.985); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes drawLine {
      0% { stroke-dashoffset: 900; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.65; }
    }

    .anim-in {
      animation: fadeUpSpring 0.48s var(--ease-spring) both;
    }
    .d-1 { animation-delay: 0.04s; }
    .d-2 { animation-delay: 0.08s; }
    .d-3 { animation-delay: 0.12s; }
    .d-4 { animation-delay: 0.16s; }

    /* Toast */
    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px) scale(0.9);
      background: rgba(20, 25, 38, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 11px 20px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 700;
      z-index: 999;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.45);
      transition: transform 0.38s var(--ease-spring), opacity 0.3s ease;
      opacity: 0;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0) scale(1);
      opacity: 1;
    }

    /* ==================== SIDEBAR / NAVIGATION ==================== */
    .sidebar {
      width: 240px;
      background: rgba(14, 18, 28, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid var(--glass-border);
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      padding: 24px 14px;
      transition: background 0.3s ease;
    }
    html[data-theme="light"] .sidebar {
      background: rgba(255, 255, 255, 0.9);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 4px 12px 28px;
    }
    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: linear-gradient(135deg, rgba(29, 111, 242, 0.2), rgba(29, 111, 242, 0.05));
      border: 1px solid rgba(29, 111, 242, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(29, 111, 242, 0.25);
    }
    .brand-text {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text-main);
    }
    .brand-pro {
      font-size: 10px;
      font-weight: 800;
      color: var(--blue-light);
      background: rgba(29, 111, 242, 0.14);
      padding: 2px 6px;
      border-radius: 6px;
      margin-left: 4px;
      vertical-align: middle;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .nav-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 13px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.24s var(--ease-spring);
    }
    .nav-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.04);
    }
    .nav-btn:active {
      transform: scale(0.96);
    }
    .nav-btn.active {
      background: linear-gradient(135deg, rgba(29, 111, 242, 0.22) 0%, rgba(29, 111, 242, 0.06) 100%);
      border-color: rgba(29, 111, 242, 0.35);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 6px 20px -4px rgba(29, 111, 242, 0.28);
    }
    html[data-theme="light"] .nav-btn.active {
      background: var(--blue);
      color: #fff;
    }
    .nav-btn.active svg {
      color: var(--blue-light);
    }
    html[data-theme="light"] .nav-btn.active svg {
      color: #fff;
    }

    /* ==================== MAIN & TOPBAR ==================== */
    .main {
      margin-left: 240px;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 68px;
      background: rgba(14, 18, 28, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--glass-border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    html[data-theme="light"] .topbar {
      background: rgba(255, 255, 255, 0.82);
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      padding: 5px 10px 5px 5px;
      border-radius: 99px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.03);
      text-align: left;
      transition: all 0.22s var(--ease-spring);
    }
    .user-chip:hover {
      border-color: var(--glass-highlight);
      transform: translateY(-1px);
    }
    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1D6FF2, #00E58F);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 4px 10px rgba(29, 111, 242, 0.35);
    }
    .user-greeting {
      font-size: 10.5px;
      color: var(--text-sub);
      font-weight: 600;
    }
    .user-name {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* FinPro Theme Switcher Pill */
    .theme-pill {
      display: inline-flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 99px;
      padding: 3px;
      gap: 2px;
    }
    .theme-pill-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.22s var(--ease-spring);
    }
    .theme-pill-btn.active {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 2px 8px var(--blue-glow);
    }

    .top-btn {
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      height: 36px;
      padding: 0 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.22s var(--ease-spring);
    }
    .top-btn:hover {
      border-color: var(--glass-highlight);
      transform: translateY(-1px);
    }
    .top-btn:active {
      transform: scale(0.95);
    }
    .top-btn.danger {
      border-color: rgba(255, 77, 106, 0.28);
      background: var(--danger-soft);
      color: var(--danger);
    }

    .container {
      padding: 22px 24px 104px;
      max-width: 1240px;
      width: 100%;
      margin: 0 auto;
    }

    /* ==================== FINPRO CARDS & DASHBOARD GRID ==================== */
    .finpro-top-grid {
      display: grid;
      grid-template-columns: 1.35fr 1.15fr 0.85fr;
      gap: 16px;
      margin-bottom: 18px;
    }

    .f-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 20px;
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
      transition: transform 0.28s var(--ease-spring), border-color 0.28s ease;
    }
    .f-card:hover {
      border-color: var(--glass-highlight);
    }

    /* Card 1: Total Balance (FinPro Top-Center Widget Style) */
    .balance-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        radial-gradient(circle at 90% 10%, rgba(29, 111, 242, 0.22), transparent 55%),
        var(--card-bg);
    }
    .bal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .bal-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 0.2px;
    }
    .bank-filter-select {
      margin-top: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
    }
    .bank-filter-select option {
      background: #151A26;
      color: #fff;
    }
    .pill-edit-btn {
      background: rgba(29, 111, 242, 0.14);
      border: 1px solid rgba(29, 111, 242, 0.35);
      color: #60A5FA;
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.22s var(--ease-spring);
    }
    html[data-theme="light"] .pill-edit-btn {
      color: var(--blue);
    }
    .pill-edit-btn:hover {
      background: var(--blue);
      color: #fff;
      transform: translateY(-1px);
    }

    .bal-amount-wrap {
      margin: 16px 0 18px;
      cursor: pointer;
    }
    .bal-currency {
      color: var(--blue-light);
      font-weight: 800;
      font-size: 28px;
      margin-right: 4px;
    }
    .bal-digits {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;
      color: var(--text-main);
    }

    .bal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-finpro-primary {
      border: none;
      background: linear-gradient(135deg, #2575FC 0%, #1D6FF2 100%);
      color: #fff;
      padding: 12px 14px;
      border-radius: 13px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 8px 22px -4px var(--blue-glow);
      transition: all 0.24s var(--ease-spring);
    }
    .btn-finpro-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px -4px var(--blue-glow);
    }
    .btn-finpro-primary:active {
      transform: scale(0.96);
    }

    .btn-finpro-secondary {
      border: 1px solid rgba(29, 111, 242, 0.32);
      background: rgba(29, 111, 242, 0.08);
      color: #60A5FA;
      padding: 12px 14px;
      border-radius: 13px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.24s var(--ease-spring);
    }
    html[data-theme="light"] .btn-finpro-secondary {
      color: var(--blue);
    }
    .btn-finpro-secondary:hover {
      background: rgba(29, 111, 242, 0.16);
      transform: translateY(-2px);
    }
    .btn-finpro-secondary:active {
      transform: scale(0.96);
    }

    /* Card 2: Cashflow & Smooth Spline Chart */
    .card-head-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .card-subtitle {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-sub);
    }
    .card-main-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
    }
    .period-pills {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 99px;
      padding: 2px;
      gap: 2px;
    }
    .period-pill {
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 10.5px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.2s var(--ease-spring);
    }
    .period-pill.active {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 2px 8px var(--blue-glow);
    }

    .cashflow-mini-stats {
      display: flex;
      gap: 14px;
      margin: 8px 0 10px;
      flex-wrap: wrap;
    }
    .cf-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
    }
    .cf-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .spline-svg {
      width: 100%;
      height: 92px;
      overflow: visible;
    }
    .spline-path {
      stroke-dasharray: 900;
      stroke-dashoffset: 0;
      animation: drawLine 1.1s var(--ease-spring) forwards;
    }

    /* Card 3: Radial Score / Target Tabungan Gauge */
    .gauge-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }
    .gauge-wrap {
      position: relative;
      width: 160px;
      height: 105px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin: 4px 0;
    }
    .gauge-score-text {
      position: absolute;
      bottom: 4px;
      left: 0;
      right: 0;
      text-align: center;
    }
    .gauge-num {
      font-size: 30px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1;
    }
    .gauge-caption {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--blue-light);
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ==================== LOWER TWO-COLUMN LAYOUT ==================== */
    .two-col {
      display: grid;
      grid-template-columns: 1.05fr 1.35fr;
      gap: 16px;
      align-items: start;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-title {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .link-action {
      background: rgba(29, 111, 242, 0.12);
      border: 1px solid rgba(29, 111, 242, 0.28);
      color: #60A5FA;
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.22s var(--ease-spring);
    }
    html[data-theme="light"] .link-action {
      color: var(--blue);
    }
    .link-action:hover {
      background: var(--blue);
      color: #fff;
      transform: translateY(-1px);
    }

    /* Item Rows (Wallets & Transactions) */
    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 10px;
      border-bottom: 1px solid var(--glass-border);
      gap: 12px;
      cursor: pointer;
      border-radius: 14px;
      transition: all 0.22s var(--ease-spring);
    }
    .item-row:hover {
      background: rgba(255, 255, 255, 0.035);
      transform: translateX(3px);
    }
    html[data-theme="light"] .item-row:hover {
      background: rgba(15, 23, 42, 0.035);
    }
    .item-row:active {
      transform: scale(0.985);
    }
    .item-row:last-child {
      border-bottom: none;
    }
    .item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }
    .icon-squircle {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 800;
      font-size: 11.5px;
      letter-spacing: -0.3px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .item-info {
      min-width: 0;
      flex: 1;
    }
    .item-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-meta {
      font-size: 11.5px;
      color: var(--text-sub);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-right {
      text-align: right;
      flex-shrink: 0;
    }
    .item-amt {
      font-size: 13.5px;
      font-weight: 800;
    }
    .edit-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10.5px;
      font-weight: 700;
      color: #60A5FA;
      background: rgba(29, 111, 242, 0.12);
      padding: 2px 8px;
      border-radius: 6px;
      margin-top: 3px;
    }
    html[data-theme="light"] .edit-pill {
      color: var(--blue);
    }

    /* FinPro Transaction Table Header */
    .tx-table-head {
      display: grid;
      grid-template-columns: 1.6fr 1fr 0.8fr 0.9fr;
      padding: 6px 10px 10px;
      border-bottom: 1px solid var(--glass-border);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .tx-grid-row {
      display: grid;
      grid-template-columns: 1.6fr 1fr 0.8fr 0.9fr;
      align-items: center;
      padding: 12px 10px;
      border-bottom: 1px solid var(--glass-border);
      border-radius: 13px;
      cursor: pointer;
      gap: 8px;
      transition: all 0.22s var(--ease-spring);
    }
    .tx-grid-row:hover {
      background: rgba(255, 255, 255, 0.04);
      transform: translateX(3px);
    }
    .tx-grid-row:last-child {
      border-bottom: none;
    }

    /* Progress Track (FinPro Glowing Bar) */
    .progress-track {
      height: 7px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 99px;
      overflow: hidden;
      margin: 8px 0;
    }
    html[data-theme="light"] .progress-track {
      background: #E2E8F0;
    }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #1D6FF2 0%, #00E58F 100%);
      box-shadow: 0 0 12px rgba(0, 229, 143, 0.45);
      transition: width 0.6s var(--ease-spring);
    }

    /* ==================== SMOOTH SPRING MODAL ==================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(6, 9, 15, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s var(--ease-spring);
    }
    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      background: var(--card-solid);
      border: 1px solid var(--glass-highlight);
      width: 100%;
      max-width: 470px;
      border-radius: 24px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
      transform: translateY(24px) scale(0.96);
      transition: transform 0.34s var(--ease-spring);
    }
    .modal-backdrop.open .modal-box {
      transform: translateY(0) scale(1);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--glass-border);
    }
    .modal-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .close-btn:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      margin: 12px 0 6px;
    }
    .form-control {
      width: 100%;
      border: 1.5px solid var(--glass-border);
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      background: var(--input-bg);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .form-control:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(29, 111, 242, 0.2);
    }
    .form-control option {
      background: var(--card-solid);
      color: var(--text-main);
    }

    .chip-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .chip-btn {
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      padding: 7px 11px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s var(--ease-spring);
    }
    .chip-btn:hover {
      border-color: var(--blue-light);
    }
    .chip-btn:active {
      transform: scale(0.95);
    }
    .chip-btn.active {
      background: rgba(29, 111, 242, 0.2);
      border-color: var(--blue);
      color: #60A5FA;
    }
    html[data-theme="light"] .chip-btn.active {
      color: var(--blue);
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      max-height: 225px;
      overflow-y: auto;
      padding: 2px;
    }
    .cat-btn {
      border: 1.5px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.025);
      border-radius: 12px;
      padding: 9px 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-sub);
      text-align: center;
      min-height: 66px;
      transition: all 0.2s var(--ease-spring);
    }
    .cat-btn:active {
      transform: scale(0.95);
    }
    .cat-btn.selected {
      border-color: var(--blue);
      background: rgba(29, 111, 242, 0.16);
      color: var(--text-main);
      box-shadow: 0 4px 14px rgba(29, 111, 242, 0.22);
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      max-height: 170px;
      overflow-y: auto;
      padding: 2px;
    }
    .preset-btn {
      border: 1.5px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.03);
      border-radius: 11px;
      padding: 8px 8px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      text-align: left;
      transition: all 0.2s var(--ease-spring);
    }
    .preset-btn:active {
      transform: scale(0.95);
    }
    .preset-btn.selected {
      border-color: var(--blue);
      background: rgba(29, 111, 242, 0.18);
      box-shadow: 0 4px 12px rgba(29, 111, 242, 0.2);
    }

    .btn-submit {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 13.5px;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #2575FC 0%, #1D6FF2 100%);
      box-shadow: 0 8px 24px -4px var(--blue-glow);
      cursor: pointer;
      margin-top: 16px;
      transition: all 0.24s var(--ease-spring);
    }
    .btn-submit:hover {
      transform: translateY(-1px);
    }
    .btn-submit:active {
      transform: scale(0.97);
    }
    .btn-danger {
      width: 100%;
      border: 1px solid rgba(255, 77, 106, 0.35);
      border-radius: 14px;
      padding: 12px;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--danger);
      background: var(--danger-soft);
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.22s var(--ease-spring);
    }
    .btn-danger:active {
      transform: scale(0.97);
    }

    /* ==================== NEW WIDGETS: SEKILAS HARI INI, MENU UTAMA, PROGRES & KALENDER, BUDGET, GOALS ==================== */
    .glance-card {
      background: linear-gradient(155deg, rgba(16, 185, 129, 0.14) 0%, rgba(19, 25, 38, 0.92) 55%, rgba(29, 111, 242, 0.12) 100%);
      border-color: rgba(0, 229, 143, 0.25);
    }
    html[data-theme="light"] .glance-card {
      background: linear-gradient(155deg, rgba(16, 185, 129, 0.10) 0%, #FFFFFF 60%, rgba(29, 111, 242, 0.08) 100%);
      border-color: rgba(16, 185, 129, 0.28);
    }
    .glance-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--warning);
      margin-bottom: 10px;
    }
    .glance-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      flex-wrap: wrap;
    }
    .glance-big-num {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.7px;
      line-height: 1.15;
      color: var(--text-main);
    }
    .glance-sub {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 3px;
      font-weight: 500;
    }
    .glance-io-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: right;
      min-width: 145px;
    }
    .glance-io-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 11.5px;
      font-weight: 700;
    }
    .glance-status {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* Menu Utama Circular Icon Grid */
    .menu-utama-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px 8px;
      margin-top: 8px;
    }
    @media (min-width: 640px) {
      .menu-utama-grid {
        grid-template-columns: repeat(8, 1fr);
      }
    }
    .menu-utama-btn {
      background: none;
      border: none;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      padding: 6px 2px;
      border-radius: 14px;
      transition: transform 0.22s var(--ease-spring), background 0.2s ease;
    }
    .menu-utama-btn:hover {
      background: rgba(255, 255, 255, 0.04);
      transform: translateY(-2px);
    }
    .menu-utama-btn:active {
      transform: scale(0.93);
    }
    .menu-utama-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--glass-highlight);
      box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.35);
      transition: all 0.25s var(--ease-spring);
    }
    .menu-utama-label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-sub);
      text-align: center;
      line-height: 1.2;
    }

    /* Progres Pengeluaran (Hari X dari 30 + Kebutuhan/Keinginan/Tabungan) */
    .spend-prog-layout {
      display: grid;
      grid-template-columns: 118px 1fr;
      gap: 18px;
      align-items: center;
      margin-top: 8px;
    }
    @media (max-width: 420px) {
      .spend-prog-layout {
        grid-template-columns: 102px 1fr;
        gap: 12px;
      }
    }
    .day-ring-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .day-ring-svg-wrap {
      position: relative;
      width: 94px;
      height: 94px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .day-ring-label {
      position: absolute;
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.3px;
      color: var(--text-main);
    }
    .day-ring-sub {
      font-size: 11.5px;
      color: var(--text-sub);
      font-weight: 600;
      margin-top: 6px;
    }
    .prog-cat-row {
      margin-bottom: 11px;
    }
    .prog-cat-row:last-child {
      margin-bottom: 0;
    }
    .prog-cat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }
    .prog-cat-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 99px;
      margin-left: 6px;
      text-transform: none;
      letter-spacing: 0;
    }

    /* Aktivitas Bulan Ini — Monthly Calendar Grid */
    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-sub);
      padding: 8px 0 6px;
      border-bottom: 1px solid var(--glass-border);
      margin-bottom: 6px;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .cal-cell {
      min-height: 56px;
      border-radius: 11px;
      padding: 5px 3px 4px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      cursor: pointer;
      transition: all 0.18s var(--ease-spring);
      overflow: hidden;
    }
    html[data-theme="light"] .cal-cell {
      background: rgba(15, 23, 42, 0.025);
    }
    .cal-cell:hover {
      border-color: var(--blue-light);
      background: rgba(29, 111, 242, 0.10);
      transform: translateY(-1px);
    }
    .cal-cell.other-month {
      opacity: 0.28;
      pointer-events: none;
    }
    .cal-cell.is-today {
      border-color: var(--emerald);
      background: rgba(0, 229, 143, 0.10);
      box-shadow: 0 0 12px rgba(0, 229, 143, 0.18);
    }
    .cal-day-num {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.2;
      margin-bottom: 3px;
    }
    .cal-cell.is-sunday .cal-day-num {
      color: var(--danger);
    }
    .cal-cell.is-today .cal-day-num {
      color: var(--emerald);
    }
    .cal-tag {
      font-size: 9.5px;
      font-weight: 800;
      line-height: 1.15;
      padding: 1px 4px;
      border-radius: 4px;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }
    .cal-tag.inc {
      color: var(--emerald);
      background: rgba(0, 229, 143, 0.13);
    }
    .cal-tag.exp {
      color: #FF6B81;
      background: rgba(255, 77, 106, 0.14);
    }

    /* Budget Page Rows (Screenshot 2 Style) */
    .budget-row {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      padding: 15px 4px;
      border-bottom: 1px solid var(--glass-border);
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .budget-row:last-child {
      border-bottom: none;
    }
    .budget-row:hover {
      background: rgba(255, 255, 255, 0.025);
      border-radius: 14px;
      padding-left: 8px;
      padding-right: 8px;
    }
    .budget-row-body {
      flex: 1;
      min-width: 0;
    }
    .budget-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .budget-row-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-sub);
    }
    .budget-del-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .budget-del-btn:hover {
      color: var(--danger);
      background: var(--danger-soft);
      border-color: rgba(255, 77, 106, 0.3);
    }

    /* Goals Card (Screenshot 1 Style) */
    .goals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 16px;
    }
    .goal-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 18px;
      cursor: pointer;
      transition: all 0.24s var(--ease-spring);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }
    .goal-card:hover {
      border-color: rgba(29, 111, 242, 0.45);
      transform: translateY(-2px);
      box-shadow: var(--shadow-card);
    }
    .goal-card-mid {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 4px 0;
    }
    .goal-ring-wrap {
      position: relative;
      width: 60px;
      height: 60px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .goal-ring-pct {
      position: absolute;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--text-main);
    }
    .goal-card-footer {
      border-top: 1px solid var(--glass-border);
      padding-top: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-sub);
      font-weight: 600;
    }

    /* Floating Center + Button in Bottom Nav (Mobile) */
    .nav-fab-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 3px solid var(--bg-base);
      background: linear-gradient(135deg, #00E58F 0%, #10B981 45%, #1D6FF2 100%);
      color: #06130E;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 24px -4px rgba(0, 229, 143, 0.55);
      transform: translateY(-14px);
      transition: transform 0.24s var(--ease-spring), box-shadow 0.24s ease;
      flex-shrink: 0;
    }
    .nav-fab-btn:active {
      transform: translateY(-12px) scale(0.93);
    }

    /* ==================== NEW WIDGETS PART 2: ASET & KEKAYAAN BERSIH, PORTOFOLIO DONUT, SKOR FINANSIAL, DOMPET & KREDIT ==================== */
    .networth-hero-card {
      background: radial-gradient(120% 120% at 85% 15%, rgba(132, 204, 22, 0.16) 0%, rgba(16, 22, 32, 0.96) 52%, #0B0F17 100%);
      border: 1px solid rgba(163, 230, 53, 0.28);
      border-radius: 26px;
      padding: 22px 20px;
      color: #F8FAFC;
      box-shadow: 0 22px 48px -12px rgba(0, 0, 0, 0.65);
      position: relative;
      overflow: hidden;
    }
    .nw-tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #A3E635;
    }
    .nw-big-val {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      margin: 6px 0 16px;
      color: #FFFFFF;
      line-height: 1.15;
    }
    @media (max-width: 480px) {
      .nw-big-val { font-size: 26px; }
    }
    .nw-runway-box {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      padding: 12px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 18px;
      max-width: 100%;
    }
    .nw-rocket-ico {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: #A3E635;
      color: #0B1305;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 8px 20px -4px rgba(163, 230, 53, 0.5);
    }
    .nw-level-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .nw-trophy-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(163, 230, 53, 0.12);
      border: 1px solid rgba(163, 230, 53, 0.3);
      color: #A3E635;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .nw-subcards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }
    .nw-subcard {
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nw-subcard:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(163, 230, 53, 0.35);
    }
    .nw-subcard.full-span {
      grid-column: 1 / -1;
    }
    .nw-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Portfolio Donut & Segmented Switch */
    .portfolio-seg-wrap {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      padding: 3px;
      border-radius: 99px;
      gap: 4px;
      margin-bottom: 14px;
    }
    html[data-theme="light"] .portfolio-seg-wrap {
      background: #F1F5F9;

    const APP_SCOPE_PATH = new URL('./', location.href).pathname; // contoh: /dompetku/
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => {
        try {
          if (new URL(r.scope).pathname.startsWith(APP_SCOPE_PATH)) r.unregister();
        } catch (e) {}
      })).catch(() => {});
    }
    if ('caches' in window) {
      caches.keys().then(keys => keys.forEach(k => {
        if (k.toLowerCase().startsWith('dompetku')) caches.delete(k);

    // Tanggal lokal perangkat (bukan UTC) -> aman untuk WIB jam 00.00 - 07.00
    function localDateStr(d = new Date()) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
    function parseLocalDate(str) {
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(str || ''));
      if (!m) return new Date(str);
      return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));

          { id: 't7', type: 'income', amount: 1200000, categoryId: 'freelance', walletId: 'w_mandiri', note: 'Proyek Desain UI', date: d0 },
        ],
        savings: [
          { id: 's1', name: 'Dana Darurat', icon: 'vault', current: 10000000, target: 10000000, targetDate: '2027-12-31' },
          { id: 's2', name: 'Beli Rumah', icon: 'house', current: 29000000, target: 350000000, targetDate: '2035-12-31' },
          { id: 's3', name: 'Dana Pensiun', icon: 'briefcase', current: 66000000, target: 600000000, targetDate: '2045-12-31' },
        ],
        budgets: DEFAULT_BUDGETS.map(b => ({ ...b })),
        portfolio: DEFAULT_PORTFOLIO.map(p => ({ ...p })),
        liabilities: DEFAULT_LIABILITIES.map(l => ({ ...l })),
      };
    }

    let state = loadState();

    function isValidState(s) {
      if (!s || typeof s !== 'object' || Array.isArray(s)) return false;
      const isRecord = value => !!value && typeof value === 'object' && !Array.isArray(value);
      const isRecordArray = key => Array.isArray(s[key]) && s[key].every(isRecord);
      if (!isRecordArray('wallets') || s.wallets.length === 0
          || !isRecordArray('transactions') || !isRecordArray('savings')) return false;
      // Optional collections may be absent in older backups, but malformed values must be rejected.
      for (const key of ['customCategories', 'budgets', 'portfolio', 'liabilities']) {
        if (s[key] !== undefined && !isRecordArray(key)) return false;
      }
      return true;
    }

    function normalizeState(s) {
      const out = {
        userName: typeof s.userName === 'string' && s.userName.trim() ? s.userName : 'Alfian Dimas',
        customCategories: Array.isArray(s.customCategories) ? s.customCategories : [],
        wallets: s.wallets.map(w => ({
          id: String(w.id || uid()),
          name: String(w.name || 'Akun'),
          type: ['bank', 'ewallet', 'cash'].includes(w.type) ? w.type : 'bank',
          initialBalance: Number(w.initialBalance) || 0,
        })),
        transactions: s.transactions.map(t => ({
          id: String(t.id || uid()),
          type: t.type === 'income' ? 'income' : 'expense',
          amount: Math.max(0, Number(t.amount) || 0),
          categoryId: String(t.categoryId || (t.type === 'income' ? 'other_inc' : 'other_exp')),
          walletId: String(t.walletId || ''),
          note: String(t.note || ''),
          date: /^\d{4}-\d{2}-\d{2}$/.test(String(t.date)) ? t.date : localDateStr(),
          transfer: !!t.transfer || /^(Nabung ke|Alokasi ke|Tarik dari|Pencairan) /.test(String(t.note || '')),
          savingId: t.savingId ? String(t.savingId) : undefined,
        })),
        savings: s.savings.map(sv => ({
          id: String(sv.id || uid()),
          name: String(sv.name || 'Target'),
          icon: SVG_PATHS[sv.icon] ? sv.icon : 'vault',
          current: Math.max(0, Number(sv.current) || 0),
          target: Math.max(0, Number(sv.target) || 0),
          targetDate: typeof sv.targetDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(sv.targetDate) ? sv.targetDate : '2027-12-31',
        })),
        // Preserve an intentionally empty budget list during save/reload/backup restore.
        // Only use defaults for older backup formats that did not contain the budgets key.
        budgets: Array.isArray(s.budgets)
          ? s.budgets.map(b => ({
              id: String(b.id || uid()),
              categoryId: String(b.categoryId || 'makan'),
              limit: Math.max(0, Number(b.limit) || 0),
            }))
          : DEFAULT_BUDGETS.map(b => ({ ...b })),
        portfolio: Array.isArray(s.portfolio)
          ? s.portfolio.map(p => ({
              id: String(p.id || uid()),
              name: String(p.name || 'Instrumen'),
              ticker: String(p.ticker || String(p.name || 'AST').slice(0, 4).toUpperCase()),
              instrument: PORTFOLIO_INSTRUMENTS.some(i => i.id === p.instrument) ? p.instrument : 'Saham',
              currency: PORTFOLIO_CURRENCIES.some(c => c.id === p.currency) ? p.currency : 'IDR',
              value: Math.max(0, Number(p.value) || 0),
              changePct: Number.isFinite(Number(p.changePct)) ? Number(p.changePct) : 0,
              goalId: p.goalId && s.savings.some(sv => String(sv.id) === String(p.goalId)) ? String(p.goalId) : '',
            }))
          : [],
        liabilities: Array.isArray(s.liabilities)
          ? s.liabilities.map(l => ({
              id: String(l.id || uid()),
              name: String(l.name || 'Kartu Kredit / Cicilan'),
              provider: String(l.provider || 'BCA'),
              type: String(l.type || 'Kartu Kredit'),
              usedAmount: Math.max(0, Number(l.usedAmount) || 0),
              limitAmount: Math.max(0, Number(l.limitAmount) || 0),
            }))
          : [],
      };
      return out;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (isValidState(parsed)) {
            const normalized = normalizeState(parsed);
            // One-time cleanup for the app's original fake starter holdings/debt,
            // but only when the user has no activity and all starter values are untouched.
            const noRecordedActivity = normalized.transactions.length === 0
              && normalized.wallets.every(w => (Number(w.initialBalance) || 0) === 0)
              && normalized.savings.every(g => (Number(g.current) || 0) === 0);
            const onlyDefaultPortfolio = normalized.portfolio.every(p => {
              const d = DEFAULT_PORTFOLIO.find(x => x.id === p.id);
              return !!d && p.name === d.name && p.value === d.value
                && p.changePct === d.changePct && p.instrument === d.instrument
                && p.currency === d.currency;
            });
            const onlyDefaultLiabilities = normalized.liabilities.every(l => {
              const d = DEFAULT_LIABILITIES.find(x => x.id === l.id);
              return !!d && l.name === d.name && l.usedAmount === d.usedAmount
                && l.limitAmount === d.limitAmount && l.provider === d.provider
                && l.type === d.type;
            });
            if (noRecordedActivity && onlyDefaultPortfolio && onlyDefaultLiabilities
                && (normalized.portfolio.length > 0 || normalized.liabilities.length > 0)) {
              normalized.portfolio = [];
              normalized.liabilities = [];
              try { localStorage.setItem(STORAGE_KEY, JSON.stringify(normalized)); } catch (e) {}
            }
            return normalized;
          }
        }
      } catch (e) {}
      const clean = getCleanZeroData();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(clean)); } catch (e) {}
      return clean;
    }

    function getInitials(name) {
      const parts = String(name || 'AD').trim().split(/\s+/);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return String(parts[0] || 'AD').slice(0, 2).toUpperCase();
    }

    function saveState() {
      let storageFailed = false;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        storageFailed = true;
      }
      const uName = state.userName || 'Alfian Dimas';
      document.getElementById('userNameText').textContent = uName;
      document.getElementById('userAvatar').textContent = getInitials(uName);
      document.getElementById('eyeIcon').innerHTML = hideBalance ? SVG_PATHS.eyeOff : SVG_PATHS.eye;
      renderPage();
      if (storageFailed) {
        showToast('Penyimpanan browser penuh/tidak tersedia. Ekspor backup JSON sebelum menutup halaman.');
      }
    }

    /* ==================== BACKUP / SNAPSHOT ==================== */
    const BACKUP_KEY = 'dompetku_backup_snapshot';

    function saveSnapshot(reason) {
      try {
        localStorage.setItem(BACKUP_KEY, JSON.stringify({
          savedAt: new Date().toISOString(),
          reason,
          data: state,
        }));
      } catch (e) {}
    }

    function getSnapshot() {
      try {
        const raw = localStorage.getItem(BACKUP_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }

    function restoreSnapshot() {
      const snap = getSnapshot();
      if (!snap || !isValidState(snap.data)) {
        showToast('Tidak ada cadangan yang bisa dipulihkan');
        return;
      }
      state = normalizeState(snap.data);
      try { localStorage.removeItem(BACKUP_KEY); } catch (e) {}
      closeModal();
      saveState();
      showToast('Data sebelum reset berhasil dipulihkan');
    }

    // Reset kini WAJIB konfirmasi (modal in-app, bukan window.confirm yang diblokir di HP)

        confirmLabel: 'Ya, Nolkan Rp 0',
        onConfirm: doResetAllToZero,
      });

    function doResetAllToZero() {

      state.transactions = [];
      state.wallets.forEach(w => { w.initialBalance = 0; });

      if (Array.isArray(state.portfolio)) {
        state.portfolio.forEach(p => { p.value = 0; });

      if (Array.isArray(state.liabilities)) {

    let pendingConfirm = null;
    function confirmAction({ title, message, confirmLabel, onConfirm }) {

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function formatNumberOnly(n, masked = false) {
      if (masked && hideBalance) return '•••••••';
      const num = Number(n) || 0;
      const formatted = Math.round(Math.abs(num)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return `${num < 0 ? '-' : ''}${formatted}`;
    }

    function formatRupiah(n, masked = false) {
      if (masked && hideBalance) return 'Rp •••••••';
      const num = Number(n) || 0;
      const formatted = Math.round(Math.abs(num)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return `${num < 0 ? '-' : ''}Rp ${formatted}`;
    }

    function formatThousands(val) {
      const digits = String(val || '').replace(/\D/g, '');
      if (!digits) return '';
      return digits.replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function formatDateIndo(dateStr) {
      const d = parseLocalDate(dateStr);
      if (isNaN(d)) return dateStr;
      return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`;
    }

    function getExpenseCategories() {
      const custom = (state.customCategories || []).filter(c => c.type === 'expense');
      return [...DEFAULT_EXPENSE_CATEGORIES, ...custom];
    }

    function getIncomeCategories() {
      const custom = (state.customCategories || []).filter(c => c.type === 'income');
      return [...DEFAULT_INCOME_CATEGORIES, ...custom];
    }

    function getCategory(id) {
      const found = [...getExpenseCategories(), ...getIncomeCategories()].find(c => c.id === id);
      if (found) {
        return {
          ...found,
          svg: getSvg(found.icon),
        };
      }
      return { id, name: 'Transaksi', icon: 'layers', svg: SVG_PATHS.layers, color: '#3B82F6' };

    // Tidak lagi "menempelkan" transaksi yatim ke akun pertama secara diam-diam
    function getWallet(id) {
      return state.wallets.find(w => w.id === id) || { id: '', name: '(Akun terhapus)', type: 'bank', missing: true };
    }

    function getWalletBadge(wallet) {
      const preset = BANK_PRESETS.find(p => p.name.toLowerCase() === String(wallet.name || '').toLowerCase());
      const color = preset ? preset.color : (wallet.type === 'ewallet' ? '#0EA5E9' : wallet.type === 'cash' ? '#10B981' : '#1D6FF2');
      const code = preset ? preset.code : String(wallet.name || 'BNK').slice(0, 3).toUpperCase();
      return { color, code };
    }

    function getWalletType(typeId) {
      return WALLET_TYPES.find(t => t.id === typeId) || WALLET_TYPES[0];
    }

    function computeTotals() {
      const walletBalances = {};
      const walletTxNet = {};
      state.wallets.forEach(w => {
        walletBalances[w.id] = Number(w.initialBalance) || 0;
        walletTxNet[w.id] = 0;
      });

      let totalIncome = 0;
      let totalExpense = 0;

      state.transactions.forEach(t => {
        const amt = Number(t.amount) || 0;
        const sign = t.type === 'income' ? 1 : -1;
        // Setor/tarik target dana = perpindahan uang, BUKAN pemasukan/pengeluaran
        if (!t.transfer) {
          if (t.type === 'income') totalIncome += amt;
          else totalExpense += amt;
        }
        if (walletBalances[t.walletId] !== undefined) {
          walletBalances[t.walletId] += sign * amt;
          walletTxNet[t.walletId] += sign * amt;
        }
      });

      const totalWalletBalance = Object.values(walletBalances).reduce((a, b) => a + b, 0);
      const totalSavings = (state.savings || []).reduce((s, item) => s + (Number(item.current) || 0), 0);
      const totalSavingsTarget = (state.savings || []).reduce((s, item) => s + (Number(item.target) || 0), 0);

      let totalPortfolioLiquid = 0;
      let totalFixedAssets = 0;
      (state.portfolio || []).forEach(p => {
        const val = Math.max(0, Number(p.value) || 0);
        if (p.instrument === 'Aset Tetap') totalFixedAssets += val;
        else totalPortfolioLiquid += val;
      });
      const totalPortfolioAll = totalPortfolioLiquid + totalFixedAssets;

      const totalLiabilities = (state.liabilities || []).reduce((s, l) => s + (Math.max(0, Number(l.usedAmount) || 0)), 0);
      const totalLiabilityLimit = (state.liabilities || []).reduce((s, l) => s + (Math.max(0, Number(l.limitAmount) || 0)), 0);

      // Total Kekayaan Bersih = (Saldo Dompet + Tabungan Goals + Aset Likuid + Aset Tetap) - Utang Kartu Kredit/Cicilan
      const dompetDanAkun = totalWalletBalance + totalSavings;
      const grossAssets = dompetDanAkun + totalPortfolioLiquid + totalFixedAssets;
      const netWorth = grossAssets - totalLiabilities;

      return {
        walletBalances,
        walletTxNet,
        totalWalletBalance,
        totalIncome,
        totalExpense,
        totalSavings,
        totalSavingsTarget,
        totalPortfolioLiquid,
        totalFixedAssets,
        totalPortfolioAll,
        totalLiabilities,
        totalLiabilityLimit,
        dompetDanAkun,
        grossAssets,
        netWorth,
      };
    }

    /* ==================== STATISTIK PER PERIODE (DATA ASLI) ==================== */
    // week  = 7 hari terakhir (termasuk hari ini)
    // month = tanggal 1 bulan ini s/d hari ini
    // all   = seluruh transaksi
    function getPeriodRange(period) {
      const today = parseLocalDate(localDateStr());
      if (period === 'week') {
        const start = new Date(today);
        start.setDate(start.getDate() - 6);
        return { start, end: today };
      }
      if (period === 'month') {
        return { start: new Date(today.getFullYear(), today.getMonth(), 1), end: today };
      }
      return null;
    }

    function computePeriodStats(period) {
      const range = getPeriodRange(period);
      const txs = state.transactions.filter(t => !t.transfer);
      let start, end;
      if (range) {
        start = range.start; end = range.end;
      } else {
        const dates = txs.map(t => parseLocalDate(t.date)).filter(d => !isNaN(d));
        end = parseLocalDate(localDateStr());
        start = dates.length ? new Date(Math.min(...dates.map(d => d.getTime()))) : new Date(end);
        if (start > end) start = new Date(end);
      }

      const dayMs = 86400000;
      let days = Math.round((end - start) / dayMs) + 1;
      // Untuk "Semua", gabungkan per bulan kalau rentang panjang
      const byMonth = !range && days > 62;

      const labels = [];
      const keyIndex = {};
      if (byMonth) {
        const cur = new Date(start.getFullYear(), start.getMonth(), 1);
        while (cur <= end) {
          const key = `${cur.getFullYear()}-${cur.getMonth()}`;
          keyIndex[key] = labels.length;
          labels.push(MONTHS_SHORT[cur.getMonth()]);
          cur.setMonth(cur.getMonth() + 1);
        }
      } else {
        for (let i = 0; i < days; i++) {
          const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
          keyIndex[localDateStr(d)] = labels.length;
          labels.push(String(d.getDate()));
        }
      }

      const incomeSeries = new Array(labels.length).fill(0);
      const expenseSeries = new Array(labels.length).fill(0);
      let income = 0, expense = 0;

      txs.forEach(t => {
        const d = parseLocalDate(t.date);
        if (isNaN(d) || d < start || d > end) return;
        const key = byMonth ? `${d.getFullYear()}-${d.getMonth()}` : localDateStr(d);
        const idx = keyIndex[key];
        if (idx === undefined) return;
        const amt = Number(t.amount) || 0;
        if (t.type === 'income') { income += amt; incomeSeries[idx] += amt; }
        else { expense += amt; expenseSeries[idx] += amt; }
      });

      return { income, expense, net: income - expense, labels, incomeSeries, expenseSeries };
    }

    // Kurva halus (Catmull-Rom -> Bezier) dari data asli
    function buildSplinePaths(series, maxVal, w, h, padTop, padBottom) {
      const n = series.length;
      const usableH = h - padTop - padBottom;
      const pts = series.map((v, i) => {
        const x = n === 1 ? w / 2 : 4 + (i * (w - 8)) / (n - 1);
        const y = padTop + usableH - (maxVal > 0 ? (v / maxVal) * usableH : 0);
        return [x, y];
      });
      if (pts.length === 1) pts.unshift([4, pts[0][1]]);
      let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i - 1] || pts[i];
        const p1 = pts[i];
        const p2 = pts[i + 1];
        const p3 = pts[i + 2] || p2;
        const c1x = p1[0] + (p2[0] - p0[0]) / 6;
        const c1y = Math.min(h - padBottom, p1[1] + (p2[1] - p0[1]) / 6);
        const c2x = p2[0] - (p3[0] - p1[0]) / 6;
        const c2y = Math.min(h - padBottom, p2[1] - (p3[1] - p1[1]) / 6);
        d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
      }
      const last = pts[pts.length - 1];
      const area = `${d} L ${last[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z`;
      return { line: d, area, last };
    }

    function renderCashflowChart(stats) {
      const W = 320, H = 92;
      const maxVal = Math.max(1, ...stats.incomeSeries, ...stats.expenseSeries);
      const inc = buildSplinePaths(stats.incomeSeries, maxVal, W, H, 8, 4);
      const exp = buildSplinePaths(stats.expenseSeries, maxVal, W, H, 8, 4);
      const empty = stats.income === 0 && stats.expense === 0;
      const first = stats.labels[0] || '';
      const mid = stats.labels[Math.floor(stats.labels.length / 2)] || '';
      const lastLbl = stats.labels[stats.labels.length - 1] || '';
      return `
        <svg class="spline-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
          <defs>
            <linearGradient id="emeraldGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#00E58F" stop-opacity="0.28"/>
              <stop offset="100%" stop-color="#00E58F" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#1D6FF2" stop-opacity="0.26"/>
              <stop offset="100%" stop-color="#1D6FF2" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="${exp.area}" fill="url(#blueGrad)" />
          <path class="spline-path" d="${exp.line}" fill="none" stroke="#1D6FF2" stroke-width="2.4" stroke-linecap="round" />
          <path d="${inc.area}" fill="url(#emeraldGrad)" />
          <path class="spline-path" d="${inc.line}" fill="none" stroke="#00E58F" stroke-width="2.4" stroke-linecap="round" />
          ${empty ? '' : `
            <circle cx="${inc.last[0]}" cy="${inc.last[1]}" r="4" fill="#00E58F" stroke="#0A0D14" stroke-width="1.6" />
            <circle cx="${exp.last[0]}" cy="${exp.last[1]}" r="4" fill="#1D6FF2" stroke="#fff" stroke-width="1.6" />
          `}
        </svg>
        <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-muted);font-weight:600;margin-top:4px;">
          <span>${first}</span><span>${mid}</span><span>${lastLbl}</span>
        </div>
        ${empty ? `<div style="font-size:11px;color:var(--text-muted);text-align:center;margin-top:2px;">Belum ada transaksi di periode ini</div>` : ''}
      `;
    }

    function navigate(page) {
      currentPage = page;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.page === page);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });

    function renderTxTableRow(tx) {
      const cat = tx.transfer
        ? { name: 'Transfer Target Dana', svg: SVG_PATHS.vault, color: '#8B5CF6' }
        : getCategory(tx.categoryId);
      const w = getWallet(tx.walletId);
      const isInc = tx.type === 'income';

    function formatCompactIdr(n, signPrefix = '') {
      if (hideBalance) return '•••';
      const val = Math.abs(Number(n) || 0);
      if (val === 0) return '0';
      if (val >= 1000000000) {
        const m = (val / 1000000000).toFixed(val % 1000000000 === 0 ? 0 : 1).replace('.', ',');
        return `${signPrefix}${m}M`;
      }
      if (val >= 1000000) {
        const jt = (val / 1000000).toFixed(val % 1000000 === 0 ? 0 : 1).replace('.', ',');
        return `${signPrefix}${jt}JT`;
      }
      if (val >= 1000) {
        const rb = Math.round(val / 1000);
        return `${signPrefix}${rb}RB`;
      }
      return `${signPrefix}${val}`;
    }

    function formatFullDateIndo(dateStr) {
      if (!dateStr) return 'Tanpa batas waktu';
      const d = parseLocalDate(dateStr);
      if (isNaN(d)) return dateStr;
      return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]} ${d.getFullYear()}`;
    }

    function computeMonthlyBudgetStats(year, month) {
      const now = new Date();
      const y = year !== undefined ? year : now.getFullYear();
      const m = month !== undefined ? month : now.getMonth();
      const todayStr = localDateStr(now);
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const currentDay = (y === now.getFullYear() && m === now.getMonth()) ? now.getDate() : daysInMonth;
      const remainingDays = Math.max(1, daysInMonth - currentDay + 1);

      const spentByCat = {};
      let monthIncome = 0;
      let monthExpense = 0;
      let todayIncome = 0;
      let todayExpense = 0;
      let needSpent = 0;
      let wantSpent = 0;
      let monthSavedDeposit = 0;

      const needGroupIds = new Set(
        DEFAULT_EXPENSE_CATEGORIES.filter(c => c.group === 'need').map(c => c.id)
      );

      state.transactions.forEach(t => {
        const d = parseLocalDate(t.date);
        if (isNaN(d)) return;
        const amt = Number(t.amount) || 0;

        if (t.date === todayStr && !t.transfer) {
          if (t.type === 'income') todayIncome += amt;
          else todayExpense += amt;
        }

        if (d.getFullYear() === y && d.getMonth() === m) {
          if (t.transfer) {
            if (t.type === 'expense') monthSavedDeposit += amt;
            return;
          }
          if (t.type === 'income') {
            monthIncome += amt;
          } else {
            monthExpense += amt;
            spentByCat[t.categoryId] = (spentByCat[t.categoryId] || 0) + amt;
            if (needGroupIds.has(t.categoryId)) needSpent += amt;
            else wantSpent += amt;
          }
        }
      });

      const budgets = state.budgets || [];
      let totalBudgetLimit = 0;
      let needBudgetLimit = 0;
      let wantBudgetLimit = 0;

      budgets.forEach(b => {
        const lim = Number(b.limit) || 0;
        totalBudgetLimit += lim;
        if (needGroupIds.has(b.categoryId)) needBudgetLimit += lim;
        else wantBudgetLimit += lim;
      });

      // Fallback cerdas jika belum ada budget untuk Keinginan
      if (needBudgetLimit === 0) needBudgetLimit = Math.round((totalBudgetLimit || 3000000) * 0.7);
      if (wantBudgetLimit === 0) wantBudgetLimit = Math.round((totalBudgetLimit || 3000000) * 0.3);

      // Hitung sisa budget bulanan di luar hari ini, lalu bagi sisa hari di bulan ini
      const spentBeforeToday = Math.max(0, monthExpense - todayExpense);
      const remainingPoolStartOfToday = Math.max(0, totalBudgetLimit - spentBeforeToday);
      const dailyBudgetAllowance = totalBudgetLimit > 0
        ? Math.round(remainingPoolStartOfToday / remainingDays)
        : 115000;
      const remainingDailyBudget = Math.max(0, dailyBudgetAllowance - todayExpense);

      return {
        y,
        m,
        daysInMonth,
        currentDay,
        remainingDays,
        spentByCat,
        monthIncome,
        monthExpense,
        todayIncome,
        todayExpense,
        totalBudgetLimit,
        dailyBudgetAllowance,
        remainingDailyBudget,
        needSpent,
        wantSpent,
        needBudgetLimit,
        wantBudgetLimit,
        monthSavedDeposit,
      };
    }

    function renderMonthlyCalendarCard() {
      const now = new Date();
      const targetDate = new Date(now.getFullYear(), now.getMonth() + calendarMonthOffset, 1);
      const y = targetDate.getFullYear();
      const m = targetDate.getMonth();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const prevMonthDays = new Date(y, m, 0).getDate();

      // Senin = 0 ... Minggu = 6 (sesuai SN SL RB KM JM SB MG di Screenshot 4)
      const firstDayJs = new Date(y, m, 1).getDay(); // 0=Minggu, 1=Senin...
      const startOffset = (firstDayJs + 6) % 7;

      const dailyMap = {};
      state.transactions.forEach(t => {
        if (t.transfer) return;
        const d = parseLocalDate(t.date);
        if (isNaN(d) || d.getFullYear() !== y || d.getMonth() !== m) return;
        const day = d.getDate();
        if (!dailyMap[day]) dailyMap[day] = { inc: 0, exp: 0 };
        const amt = Number(t.amount) || 0;
        if (t.type === 'income') dailyMap[day].inc += amt;
        else dailyMap[day].exp += amt;
      });

      const todayStr = localDateStr(now);
      const cells = [];

      // Sel hari bulan sebelumnya
      for (let i = startOffset - 1; i >= 0; i--) {
        const dayNum = prevMonthDays - i;
        cells.push(`<div class="cal-cell other-month"><span class="cal-day-num">${dayNum}</span></div>`);
      }

      // Sel hari bulan aktif
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const isToday = dateStr === todayStr;
        const colIdx = (startOffset + d - 1) % 7;
        const isSunday = colIdx === 6;
        const stat = dailyMap[d];

        cells.push(`
          <div class="cal-cell ${isToday ? 'is-today' : ''} ${isSunday ? 'is-sunday' : ''}" onclick="openDateDetailModal('${dateStr}')" title="Ketuk untuk lihat/catat transaksi ${d} ${MONTHS_SHORT[m]}">
            <span class="cal-day-num">${d}</span>
            ${stat && stat.inc > 0 ? `<span class="cal-tag inc">+${formatCompactIdr(stat.inc)}</span>` : ''}
            ${stat && stat.exp > 0 ? `<span class="cal-tag exp">-${formatCompactIdr(stat.exp)}</span>` : ''}
          </div>
        `);
      }

      // Genapkan baris terakhir
      const totalCells = cells.length;
      const trailing = (7 - (totalCells % 7)) % 7;
      for (let i = 1; i <= trailing; i++) {
        cells.push(`<div class="cal-cell other-month"><span class="cal-day-num">${i}</span></div>`);
      }

      return `

            <div class="section-title">
              <span style="color:var(--blue-light);">${SVG_PATHS.calendar}</span>

            </div>

            <span>SN</span><span>SL</span><span>RB</span><span>KM</span><span>JM</span><span>SB</span><span style="color:var(--danger);">MG</span>

          <div class="cal-grid">
