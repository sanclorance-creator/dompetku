    /* ==================== BATCH 2: PAGE ASET (KEKAYAAN BERSIH + ALOKASI PORTOFOLIO + SKOR KESEHATAN FINANSIAL) ==================== */
    function getInstrumentMeta(instId) {
      return PORTFOLIO_INSTRUMENTS.find(i => i.id === instId) || PORTFOLIO_INSTRUMENTS[0];
    }

    function getCurrencyMeta(curId) {
      return PORTFOLIO_CURRENCIES.find(c => c.id === curId) || PORTFOLIO_CURRENCIES[0];
    }

    function getWealthLevelInfo(netWorth) {
      const nw = Math.max(0, Number(netWorth) || 0);
      if (nw < 10000000) {
        return { level: 'Pemula', prev: 0, next: 10000000, pct: Math.min(100, Math.round((nw / 10000000) * 100)) };
      }
      if (nw < 100000000) {
        return { level: 'Aman', prev: 10000000, next: 100000000, pct: Math.min(100, Math.round((nw / 100000000) * 100)) };
      }
      if (nw < 500000000) {
        return { level: 'Mapan', prev: 100000000, next: 500000000, pct: Math.min(100, Math.round((nw / 500000000) * 100)) };
      }
      if (nw < 1000000000) {
        return { level: 'Sultan', prev: 500000000, next: 1000000000, pct: Math.min(100, Math.round((nw / 1000000000) * 100)) };
      }
      return { level: 'Merdeka Finansial', prev: 1000000000, next: 5000000000, pct: Math.min(100, Math.round((nw / 5000000000) * 100)) };
    }

    function renderHoldingSparkline(changePct) {
      const up = Number(changePct) >= 0;
      const stroke = up ? '#00E58F' : '#FF4D6A';
      const path = up
        ? 'M 2 22 C 14 21, 20 14, 32 16 C 44 18, 50 7, 66 4'
        : 'M 2 5 C 14 6, 22 14, 34 12 C 46 10, 52 20, 66 23';
      return `
        <svg class="holding-spark" viewBox="0 0 68 28">
          <path d="${path}" fill="none" stroke="${stroke}" stroke-width="2.2" stroke-linecap="round" />
        </svg>
      `;
    }

    function renderPortfolioDonutSection(t) {
      const portfolio = state.portfolio || [];
      const byCurrency = portfolioAllocTab === 'currency';
      const metaList = byCurrency ? PORTFOLIO_CURRENCIES : PORTFOLIO_INSTRUMENTS.filter(i => i.id !== 'Aset Tetap');
      const groupTotals = {};
      let totalChartVal = 0;

      portfolio.forEach(p => {
        const val = Math.max(0, Number(p.value) || 0);
        const key = byCurrency ? (p.currency || 'IDR') : (p.instrument || 'Saham');
        groupTotals[key] = (groupTotals[key] || 0) + val;
        totalChartVal += val;
      });

      const segments = [];
      Object.keys(groupTotals).forEach(k => {
        const val = groupTotals[k];
        if (val <= 0) return;
        const found = (byCurrency ? PORTFOLIO_CURRENCIES : PORTFOLIO_INSTRUMENTS).find(m => m.id === k);
        segments.push({
          id: k,
          label: found ? found.label : k,
          color: found ? found.color : '#10B981',
          value: val,
          pct: totalChartVal > 0 ? Math.max(1, Math.round((val / totalChartVal) * 100)) : 0,
        });
      });
      segments.sort((a, b) => b.value - a.value);

      const r = 76;
      const circ = 2 * Math.PI * r;
      let accumLen = 0;

      const svgCircles = segments.length === 0
        ? `<circle cx="105" cy="105" r="${r}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="24" />`
        : segments.map(seg => {
            const frac = totalChartVal > 0 ? seg.value / totalChartVal : 0;
            const segLen = Math.max(2, frac * circ - (segments.length > 1 ? 3 : 0));
            const dashArray = `${segLen.toFixed(2)} ${(circ - segLen).toFixed(2)}`;
            const dashOffset = (-accumLen).toFixed(2);
            accumLen += frac * circ;
            return `<circle cx="105" cy="105" r="${r}" fill="none" stroke="${seg.color}" stroke-width="24" stroke-dasharray="${dashArray}" stroke-dashoffset="${dashOffset}" />`;
          }).join('');

      const displayLegend = segments.length > 0
        ? segments
        : metaList.slice(0, 8).map(m => ({ id: m.id, label: m.label, color: m.color, value: 0, pct: 0 }));

      return `
        <div class="f-card anim-in d-2" style="margin-bottom:16px;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
            <span class="section-title" style="font-size:17px;">Alokasi Portofolio</span>
            <div class="alloc-seg-wrap">
              <button type="button" class="alloc-seg-btn ${portfolioAllocTab === 'instrument' ? 'active' : ''}" onclick="portfolioAllocTab='instrument';renderPage();">
                ${SVG_PATHS.briefcase}
                <span>Instrumen</span>
              </button>
              <button type="button" class="alloc-seg-btn ${portfolioAllocTab === 'currency' ? 'active' : ''}" onclick="portfolioAllocTab='currency';renderPage();">
                ${SVG_PATHS.globe}
                <span>Mata Uang</span>
              </button>
            </div>
          </div>

          <div class="alloc-donut-wrap">
            <svg width="210" height="210" viewBox="0 0 210 210" style="transform:rotate(-90deg);">
              <circle cx="105" cy="105" r="${r}" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="24" />
              ${svgCircles}
            </svg>
            <div class="alloc-donut-center">
              <div class="alloc-donut-lbl">TOTAL</div>
              <div class="alloc-donut-val">${hideBalance ? 'Rp •••' : 'Rp' + formatCompactIdr(totalChartVal)}</div>
              <div class="alloc-donut-sub">${portfolio.length} instrumen</div>
            </div>
          </div>

          <div class="alloc-legend-grid">
            ${displayLegend.map(seg => `
              <div class="alloc-legend-row">
                <div class="alloc-legend-left">
                  <span class="alloc-dot" style="background:${seg.color};"></span>
                  <span>${escapeHtml(seg.label)}</span>
                </div>
                <span class="alloc-legend-pct">${seg.pct}%</span>
              </div>
            `).join('')}
          </div>

          <!-- Holdings List (BBCA, Bittensor, SBN, Antam, dst. sesuai Screenshot 1) -->
          <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--glass-border);">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
              <span style="font-size:13.5px;font-weight:800;color:var(--text-sub);letter-spacing:0.3px;">DAFTAR INSTRUMEN & ASET (${portfolio.length})</span>
              <button type="button" class="link-action" onclick="openPortfolioModal()">
                ${SVG_PATHS.plus}
                <span>Tambah Instrumen</span>
              </button>
            </div>

            ${portfolio.length === 0
              ? `<p style="font-size:12.5px;color:var(--text-sub);text-align:center;padding:18px 0;">Belum ada instrumen investasi tercatat. Klik <strong>+ Tambah Instrumen</strong> untuk mencatat Saham, Kripto, Obligasi, Emas, atau Deposito.</p>`
              : portfolio.map(p => {
                  const instMeta = getInstrumentMeta(p.instrument);
                  const up = Number(p.changePct) >= 0;
                  const pctStr = `${up ? '+' : ''}${Number(p.changePct || 0)}%`;
                  return `
                    <div class="holding-card" onclick="openPortfolioModal('${p.id}')">
                      <div style="display:flex;align-items:center;gap:12px;min-width:0;">
                        <div class="icon-squircle" style="width:42px;height:42px;background:${instMeta.color}20;color:${instMeta.color};font-size:11px;font-weight:900;">
                          ${escapeHtml(String(p.ticker || p.name).slice(0, 4).toUpperCase())}
                        </div>
                        <div style="min-width:0;">
                          <div style="font-size:14.5px;font-weight:800;color:var(--text-main);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                            ${escapeHtml(p.name)}
                          </div>
                          <div style="font-size:11.5px;color:var(--text-sub);margin-top:2px;">
                            ${escapeHtml(p.instrument)} • ${escapeHtml(p.currency || 'IDR')}
                          </div>
                        </div>
                      </div>

                      ${renderHoldingSparkline(p.changePct)}

                      <div style="text-align:right;">
                        <div style="font-size:12px;font-weight:800;color:${up ? 'var(--emerald)' : 'var(--danger)'};display:inline-flex;align-items:center;gap:3px;">
                          <span>${up ? '↗' : '↘'} ${pctStr}</span>
                        </div>
                        <div style="font-size:14.5px;font-weight:800;color:var(--text-main);margin-top:2px;">
                          ${formatRupiah(p.value, true)}
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
          </div>
        </div>
      `;
    }

    function renderFinancialHealthScoreCard(t, bs, runwayMonths) {
      // 1. Rasio Tabungan (%)
      let savRatio = 0;
      if (bs.monthIncome > 0) {
        savRatio = Math.max(0, Math.min(100, Math.round(((bs.monthIncome - bs.monthExpense) / bs.monthIncome) * 100)));
      } else if (t.grossAssets > 0) {
        savRatio = Math.max(0, Math.min(100, Math.round(((t.totalSavings + t.totalPortfolioLiquid) / t.grossAssets) * 100)));
      }
      const savScore = savRatio >= 20 ? 100 : Math.round((savRatio / 20) * 100);

      // 2. Disiplin Anggaran (%)
      let budgetDisc = 100;
      if (bs.totalBudgetLimit > 0 && bs.monthExpense > 0) {
        if (bs.monthExpense <= bs.totalBudgetLimit) {
          budgetDisc = 100;
        } else {
          const overRatio = (bs.monthExpense - bs.totalBudgetLimit) / bs.totalBudgetLimit;
          budgetDisc = Math.max(0, Math.round((1 - overRatio) * 100));
        }
      }

      // 3. Dana Darurat (% terhadap ideal 6 bulan pengeluaran)
      const emergencyPct = t.grossAssets === 0 && t.totalWalletBalance === 0
        ? 0
        : Math.min(100, Math.round((runwayMonths / 6) * 100));

      // 4. Kesehatan Utang (%)
      let debtHealth = 100;
      if (t.totalLiabilities > 0) {
        if (t.grossAssets > 0) {
          const dti = t.totalLiabilities / t.grossAssets;
          debtHealth = dti <= 0.15 ? 100 : Math.max(0, Math.round((1 - dti) * 100));
        } else {
          debtHealth = 35;
        }
      }

      const overallScore = (t.grossAssets === 0 && t.totalIncome === 0 && t.totalExpense === 0)
        ? 0
        : Math.round((savScore * 0.25) + (budgetDisc * 0.25) + (emergencyPct * 0.25) + (debtHealth * 0.25));

      let badgeText = 'SANGAT BAGUS';
      let badgeColor = '#A3E635';
      let badgeBg = 'rgba(163, 230, 53, 0.14)';
      if (overallScore < 50) {
        badgeText = 'PERLU PERHATIAN';
        badgeColor = '#F59E0B';
        badgeBg = 'rgba(245, 158, 11, 0.15)';
      } else if (overallScore < 80) {
        badgeText = 'SEHAT';
        badgeColor = '#00E58F';
        badgeBg = 'rgba(0, 229, 143, 0.14)';
      }

      const r = 48;
      const circ = 2 * Math.PI * r;
      const offset = circ - (circ * overallScore) / 100;

      return `
        <div class="f-card health-card anim-in d-3" id="financialHealthCard">
          <div class="health-ring-wrap">
            <svg width="118" height="118" viewBox="0 0 118 118" style="transform:rotate(-90deg);">

              <circle cx="59" cy="59" r="${r}" fill="none" stroke="#84CC16" stroke-width="10" stroke-linecap="round"
                stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
                style="transition:stroke-dashoffset 0.8s var(--ease-spring);filter:drop-shadow(0 0 8px rgba(132,204,22,0.45));" />
            </svg>
            <div class="health-ring-center">
              <div class="health-ring-score">${overallScore}</div>
              <div class="health-ring-max">/ 100</div>
            </div>
          </div>

          <div style="text-align:center;">
            <div style="display:inline-flex;align-items:center;gap:7px;font-size:17px;font-weight:800;color:var(--text-main);">
              <span style="color:#84CC16;display:inline-flex;">${SVG_PATHS.pulse}</span>
              <span>Skor Kesehatan Finansial</span>
            </div>
            <p style="font-size:12px;color:var(--text-sub);max-width:340px;margin:6px auto 0;line-height:1.5;">
              Skor hitungan berdasarkan tabungan, disiplin budget, dana darurat, dan kesehatan utang.
            </p>
            <div class="health-status-pill" style="color:${badgeColor};background:${badgeBg};border-color:${badgeColor}40;">
              ${badgeText}
            </div>
          </div>

          <div class="health-metric-list">
            <div class="health-metric-box">
              <div class="health-metric-head">
                <span style="color:var(--text-main);">Rasio Tabungan</span>
                <span style="color:#84CC16;">${savRatio}%</span>
              </div>
              <div class="progress-track" style="height:6px;margin:0;">
                <div class="progress-fill" style="width:${savRatio}%;background:linear-gradient(90deg,#84CC16,#00E58F);box-shadow:none;"></div>
              </div>
            </div>

            <div class="health-metric-box">
              <div class="health-metric-head">

        <div class="modal-header">
          <span class="modal-title">${SVG_PATHS.bank} <span>Atur Nama Bank & Saldo</span></span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <p style="font-size:12px;color:var(--text-sub);margin-bottom:12px;">
          Ubah langsung <strong>Nama Bank/E-Wallet</strong> dan <strong>Nominal Saldo</strong> di bawah, lalu klik Simpan:
        </p>
        <div style="display:flex;flex-direction:column;gap:10px;max-height:50vh;overflow-y:auto;padding-right:2px;">
          ${state.wallets.map(w => {
            const bal = Math.max(0, totals.walletBalances[w.id] || 0);
            const badge = getWalletBadge(w);
            return `
              <div style="border:1px solid var(--glass-border);border-radius:14px;padding:11px;background:rgba(255,255,255,0.025);">
                <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
                  <div class="icon-squircle" style="width:34px;height:34px;background:${badge.color}22;color:${badge.color};">${badge.code}</div>
                  <input type="text" class="form-control bulk-w-name" data-id="${w.id}" style="font-weight:700;padding:8px 11px;" value="${escapeHtml(w.name)}" placeholder="Nama Bank / Akun" />
                  <button type="button" class="chip-btn" onclick="openWalletModal('${w.id}')">Detail</button>
                </div>
                <div style="display:flex;gap:8px;align-items:center;">
                  <span style="font-size:13px;font-weight:800;color:var(--blue-light);padding-left:6px;">Rp</span>
                  <input type="text" inputmode="numeric" class="form-control bulk-w-bal" data-id="${w.id}" style="font-size:17px;font-weight:800;padding:8px 11px;" value="${formatThousands(bal)}" placeholder="0" oninput="this.value=formatThousands(this.value)" />
                  <button type="button" class="chip-btn" style="color:var(--danger);" onclick="this.previousElementSibling.value='0'">Rp 0</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
        <div style="display:flex;gap:8px;margin-top:12px;">
          <button type="button" class="chip-btn" style="flex:1;padding:10px;color:#60A5FA;border-color:rgba(29,111,242,0.4);" onclick="openWalletModal()">+ Tambah Bank Baru</button>
          <button type="button" class="chip-btn" style="flex:1;padding:10px;color:var(--danger);border-color:rgba(255,77,106,0.35);" onclick="resetAllToZero()">Nolkan Semua Rp 0</button>
        </div>
        <button type="button" class="btn-submit" onclick="saveBulkWallets()">Simpan Semua Perubahan</button>
      `);
    }

    function saveBulkWallets() {
      const totals = computeTotals();
      const nameInputs = document.querySelectorAll('.bulk-w-name');
      const balInputs = document.querySelectorAll('.bulk-w-bal');
      const nameMap = {};
      const balMap = {};
      nameInputs.forEach(el => { nameMap[el.dataset.id] = (el.value || '').trim(); });
      balInputs.forEach(el => { balMap[el.dataset.id] = parseInt(String(el.value || '0').replace(/\D/g, ''), 10) || 0; });

      state.wallets = state.wallets.map(w => {
        const newName = nameMap[w.id] || w.name;
        const desiredBal = balMap[w.id] !== undefined ? balMap[w.id] : (totals.walletBalances[w.id] || 0);
        const txNet = totals.walletTxNet[w.id] || 0;
        return {
          ...w,
          name: newName,
          initialBalance: desiredBal - txNet,
        };
      });
      closeModal();
      saveState();
      showToast('Semua Nama Bank & Saldo berhasil diperbarui');
    }

    /* 1. MODAL BANK / AKUN INDIVIDUAL */
    function openWalletModal(walletId = null) {
      const totals = computeTotals();
      const w = walletId ? state.wallets.find(x => x.id === walletId) : null;
      const currentBal = w ? (totals.walletBalances[w.id] || 0) : 0;

      form = {
        id: w ? w.id : null,
        name: w ? w.name : '',
        type: w ? w.type : 'bank',
        targetBalance: w ? String(Math.max(0, currentBal)) : '',
      };
      renderWalletModal();
    }

    function pickBankPreset(name, type) {
      form.name = name;
      form.type = type;
      const nameInp = document.getElementById('walletNameInput');
      if (nameInp) nameInp.value = name;
      document.querySelectorAll('#bankPresetGrid .preset-btn').forEach(b => {
        b.classList.toggle('selected', b.dataset.name === name);
      });
      document.querySelectorAll('#walletTypeRow .chip-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.type === type);
      });
    }

    function selectWalletType(typeId) {
      form.type = typeId;
      document.querySelectorAll('#walletTypeRow .chip-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.type === typeId);
      });
    }

    function addWalletBalance(delta) {
      const balEl = document.getElementById('walletBalInput');
      const curRaw = balEl ? balEl.value.replace(/\D/g, '') : form.targetBalance;
      const cur = parseInt(curRaw, 10) || 0;
      form.targetBalance = String(Math.max(0, cur + delta));
      if (balEl) balEl.value = formatThousands(form.targetBalance);
    }

    function renderWalletModal() {
      const isEdit = !!form.id;
      openModal(`
        <div class="modal-header">
          <span class="modal-title">${SVG_PATHS.bank} <span>${isEdit ? 'Edit Akun Bank & Saldo' : 'Tambah Bank / E-Wallet'}</span></span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <label class="form-label" style="margin-top:0;">Pilih Cepat Bank / E-Wallet</label>
        <div class="preset-grid" id="bankPresetGrid">
          ${BANK_PRESETS.map(p => `
            <button type="button" class="preset-btn ${form.name === p.name ? 'selected' : ''}" data-name="${escapeHtml(p.name)}" onclick="pickBankPreset('${p.name}', '${p.type}')">
              <span style="width:22px;height:22px;border-radius:6px;background:${p.color}25;color:${p.color};display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex-shrink:0;">${p.code}</span>
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.name}</span>
            </button>
          `).join('')}
        </div>

        <label class="form-label">Nama Bank / E-Wallet / Akun (Bisa Diketik Bebas)</label>
        <input id="walletNameInput" type="text" class="form-control" style="font-weight:700;" placeholder="Ketik nama bank atau dompet..." value="${escapeHtml(form.name)}" oninput="form.name=this.value" />

        <label class="form-label">Jenis Akun</label>
        <div style="display:flex;gap:6px;" id="walletTypeRow">
          ${WALLET_TYPES.map(t => `
            <button type="button" class="chip-btn ${form.type === t.id ? 'active' : ''}" data-type="${t.id}" style="flex:1;padding:9px 6px;display:inline-flex;align-items:center;justify-content:center;gap:5px;" onclick="selectWalletType('${t.id}')">
              ${getSvg(t.icon)}
              <span>${t.name}</span>
            </button>
          `).join('')}
        </div>

        <label class="form-label">Saldo Saat Ini (Rp)</label>
        <input id="walletBalInput" type="text" inputmode="numeric" class="form-control" style="font-size:21px;font-weight:800;" placeholder="0" value="${formatThousands(form.targetBalance)}" oninput="form.targetBalance=this.value.replace(/\\D/g,'');this.value=formatThousands(form.targetBalance);" />
        <div class="chip-row">
          <button type="button" class="chip-btn" onclick="addWalletBalance(50000)">+50rb</button>
          <button type="button" class="chip-btn" onclick="addWalletBalance(100000)">+100rb</button>
          <button type="button" class="chip-btn" onclick="addWalletBalance(500000)">+500rb</button>
          <button type="button" class="chip-btn" onclick="addWalletBalance(1000000)">+1 Juta</button>
          <button type="button" class="chip-btn" style="color:var(--danger);" onclick="form.targetBalance='0';document.getElementById('walletBalInput').value='0';">Nolkan (Rp 0)</button>
        </div>

        <button type="button" class="btn-submit" onclick="saveWallet()">Simpan Akun & Saldo</button>
        ${isEdit && state.wallets.length > 1 ? `
          <button type="button" class="btn-danger" onclick="deleteWallet('${form.id}')">Hapus Akun Ini</button>
        ` : ''}
      `);
    }

    function saveWallet() {
      const nameEl = document.getElementById('walletNameInput');
      const balEl = document.getElementById('walletBalInput');
      const cleanName = ((nameEl ? nameEl.value : form.name) || '').trim() || 'Akun Baru';
      const rawBal = (balEl ? balEl.value : form.targetBalance) || '0';
      const desiredBalance = parseInt(String(rawBal).replace(/\D/g, ''), 10) || 0;
      const totals = computeTotals();

      if (form.id) {
        const txNet = totals.walletTxNet[form.id] || 0;
        const newInitial = desiredBalance - txNet;
        state.wallets = state.wallets.map(w =>
          w.id === form.id ? { ...w, name: cleanName, type: form.type, initialBalance: newInitial } : w
        );
      } else {
        state.wallets.push({
          id: uid(),
          name: cleanName,
          type: form.type,
          initialBalance: desiredBalance,
        });
      }
      closeModal();
      saveState();
      showToast(`${cleanName} disimpan (${formatRupiah(desiredBalance)})`);
    }

    function deleteWallet(id) {
      if (state.wallets.length <= 1) {
        showToast('Minimal harus ada 1 akun aktif');
        return;
      }
      const w = state.wallets.find(x => x.id === id);
      if (!w) return;
      const linkedTx = state.transactions.filter(t => t.walletId === id);
      const others = state.wallets.filter(x => x.id !== id);

      if (linkedTx.length === 0) {
        confirmAction({
          title: `Hapus akun ${escapeHtml(w.name)}?`,
          message: `Akun <strong>${escapeHtml(w.name)}</strong> belum memiliki riwayat transaksi dan akan dihapus.`,
          confirmLabel: 'Ya, Hapus Akun',
          onConfirm: () => {
            saveSnapshot(`Hapus akun ${w.name}`);
            state.wallets = state.wallets.filter(x => x.id !== id);
            if (selectedBankFilter === id) selectedBankFilter = 'all';
            closeModal();
            saveState();
            showToast(`Akun ${w.name} dihapus`);
          },
        });
        return;
      }

      // Jika ada transaksi terkait, wajib pilih: pindahkan ke akun lain atau hapus beserta transaksinya
      openModal(`
        <div class="modal-header">
          <span class="modal-title" style="color:var(--warning);">${SVG_PATHS.bank} <span>Pindahkan Transaksi ${escapeHtml(w.name)}</span></span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <p style="font-size:13px;color:var(--text-sub);line-height:1.6;margin-bottom:10px;">
          Akun <strong>${escapeHtml(w.name)}</strong> memiliki <strong>${linkedTx.length} transaksi</strong> tercatat. Agar tidak meninggalkan transaksi yatim, pilih akun tujuan untuk memindahkan transaksi & saldo awal:
        </p>
        <label class="form-label">Pindahkan ke Akun</label>
        <select id="migrateTargetWallet" class="form-control">
          ${others.map(o => `<option value="${o.id}">${escapeHtml(o.name)}</option>`).join('')}
        </select>
        <button type="button" class="btn-submit" onclick="confirmMigrateAndDeleteWallet('${id}')">
          Pindahkan Transaksi & Hapus ${escapeHtml(w.name)}
        </button>
        <button type="button" class="btn-danger" onclick="confirmDeleteWalletWithTx('${id}')">
          Hapus Akun Beserta ${linkedTx.length} Transaksinya
        </button>
      `);
    }

    function confirmMigrateAndDeleteWallet(sourceId) {
      const sel = document.getElementById('migrateTargetWallet');
      const targetId = sel ? sel.value : '';
      const source = state.wallets.find(w => w.id === sourceId);
      const target = state.wallets.find(w => w.id === targetId);
      if (!source || !target) return;

      saveSnapshot(`Pindahkan & hapus akun ${source.name}`);
      target.initialBalance = (Number(target.initialBalance) || 0) + (Number(source.initialBalance) || 0);
      state.transactions.forEach(t => {
        if (t.walletId === sourceId) t.walletId = targetId;
      });
      state.wallets = state.wallets.filter(w => w.id !== sourceId);
      if (selectedBankFilter === sourceId) selectedBankFilter = 'all';
      closeModal();
      saveState();
      showToast(`Transaksi dipindahkan ke ${target.name} & akun dihapus`);
    }

    function confirmDeleteWalletWithTx(sourceId) {
      const source = state.wallets.find(w => w.id === sourceId);
      if (!source) return;
      saveSnapshot(`Hapus akun ${source.name} beserta transaksi`);
      state.transactions = state.transactions.filter(t => t.walletId !== sourceId);
      state.wallets = state.wallets.filter(w => w.id !== sourceId);
      if (selectedBankFilter === sourceId) selectedBankFilter = 'all';
      closeModal();
      saveState();
      showToast(`Akun ${source.name} beserta transaksinya dihapus`);
    }

    /* 2. MODAL TRANSAKSI */
    function openTxModal(type = 'expense', txId = null) {
      const existing = txId ? state.transactions.find(t => t.id === txId) : null;
      if (existing && existing.transfer) return openTransferInfoModal(existing);
      const actualType = existing ? existing.type : type;
      const cats = actualType === 'income' ? getIncomeCategories() : getExpenseCategories();
      const walletExists = existing && state.wallets.some(w => w.id === existing.walletId);
      form = {
        id: existing ? existing.id : null,
        type: actualType,
        note: existing ? existing.note : '',
        amount: existing ? String(existing.amount) : '',
        categoryId: existing ? existing.categoryId : cats[0].id,
        walletId: walletExists ? existing.walletId : (state.wallets[0] ? state.wallets[0].id : ''),
        date: existing ? existing.date : localDateStr(),
        addingCustomCat: false,
        customCatName: '',
      };
      renderTxModal();
    }

    // Transaksi setor/tarik target dana tidak boleh diedit bebas (bisa bikin saldo target & akun tidak sinkron)
    function openTransferInfoModal(tx) {
      const sv = state.savings.find(s => s.id === tx.savingId);
      const isDeposit = tx.type === 'expense';
      openModal(`
        <div class="modal-header">
          <span class="modal-title">${SVG_PATHS.vault} <span>Transfer Target Dana</span></span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <p style="font-size:13px;color:var(--text-sub);line-height:1.6;">
          ${escapeHtml(tx.note)}<br>
          <strong style="color:var(--text-main);">${formatRupiah(tx.amount)}</strong> • ${formatDateIndo(tx.date)} • ${escapeHtml(getWallet(tx.walletId).name)}
        </p>
        <p style="font-size:12px;color:var(--text-muted);margin-top:10px;line-height:1.5;">
          Ini perpindahan uang antara akun dan target dana, jadi tidak dihitung sebagai pemasukan/pengeluaran.
          ${sv ? '' : '<br><span style="color:var(--warning);">Target dana terkait sudah tidak ada / data lama — membatalkan hanya mengembalikan saldo akun.</span>'}
        </p>
        <button type="button" class="btn-danger" onclick="cancelTransfer('${tx.id}')">
          Batalkan ${isDeposit ? 'Setoran' : 'Penarikan'} Ini
        </button>
      `);
    }

    function cancelTransfer(txId) {
      const tx = state.transactions.find(t => t.id === txId);
      if (!tx) return closeModal();
      const sv = state.savings.find(s => s.id === tx.savingId);
      const amt = Number(tx.amount) || 0;
      if (sv) {
        if (tx.type === 'expense') {
          // membatalkan setoran: dana target harus cukup untuk dikembalikan
          if ((Number(sv.current) || 0) < amt) {
            showToast(`Dana ${sv.name} tinggal ${formatRupiah(sv.current)}, tidak cukup untuk dibatalkan`);
            return;
          }
          sv.current = (Number(sv.current) || 0) - amt;
        } else {
          sv.current = (Number(sv.current) || 0) + amt;
        }
      }
      state.transactions = state.transactions.filter(t => t.id !== txId);
      closeModal();
      saveState();
      showToast('Transfer dibatalkan');
    }

    function addTxAmount(delta) {
      const inp = document.getElementById('txAmountInput');
      const curRaw = inp ? inp.value.replace(/\D/g, '') : form.amount;
      const cur = parseInt(curRaw, 10) || 0;
      form.amount = String(Math.max(0, cur + delta));
      if (inp) inp.value = formatThousands(form.amount);
    }

    function selectTxCategory(catId) {
      form.categoryId = catId;
      document.querySelectorAll('#txCatGrid .cat-btn').forEach(b => {
        b.classList.toggle('selected', b.dataset.id === catId);
      });
    }

    function renderTxModal() {
      const cats = form.type === 'income' ? getIncomeCategories() : getExpenseCategories();
      if (!cats.some(c => c.id === form.categoryId)) form.categoryId = cats[0].id;

      openModal(`
        <div class="modal-header">
          <span class="modal-title">${form.type === 'income' ? SVG_PATHS.income : SVG_PATHS.expense} <span>${form.id ? 'Edit Transaksi' : (form.type === 'income' ? 'Catat Pemasukan' : 'Catat Pengeluaran')}</span></span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
          <button type="button" class="${form.type==='income'?'btn-finpro-primary':'btn-finpro-secondary'}" onclick="form.type='income';renderTxModal();">Pemasukan</button>
          <button type="button" class="${form.type==='expense'?'btn-finpro-primary':'btn-finpro-secondary'}" onclick="form.type='expense';renderTxModal();">Pengeluaran</button>
        </div>

        <label class="form-label">Nominal (Rp)</label>
        <input id="txAmountInput" type="text" inputmode="numeric" class="form-control" style="font-size:21px;font-weight:800;" placeholder="0" value="${formatThousands(form.amount)}" oninput="form.amount=this.value.replace(/\\D/g,'');this.value=formatThousands(form.amount);" />
        <div class="chip-row">
          <button type="button" class="chip-btn" onclick="addTxAmount(10000)">+10rb</button>
          <button type="button" class="chip-btn" onclick="addTxAmount(20000)">+20rb</button>
          <button type="button" class="chip-btn" onclick="addTxAmount(50000)">+50rb</button>
          <button type="button" class="chip-btn" onclick="addTxAmount(100000)">+100rb</button>
          <button type="button" class="chip-btn" onclick="addTxAmount(500000)">+500rb</button>
          <button type="button" class="chip-btn" style="color:var(--danger);" onclick="form.amount='0';document.getElementById('txAmountInput').value='';">Nolkan</button>
        </div>

        <label class="form-label">Keterangan Transaksi</label>
        <input id="txNoteInput" type="text" class="form-control" placeholder="Cth: Makan Siang, Kopi, Bensin, Gaji..." value="${escapeHtml(form.note)}" oninput="form.note=this.value" />

        <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px;">
          <label class="form-label" style="margin:0;">Kategori (${cats.length} Pilihan)</label>
          <button type="button" style="background:none;border:none;color:#60A5FA;font-size:12px;font-weight:700;cursor:pointer;" onclick="form.addingCustomCat=!form.addingCustomCat;renderTxModal();">
            ${form.addingCustomCat ? 'Tutup' : '+ Buat Kategori Sendiri'}
          </button>
        </div>

        ${form.addingCustomCat ? `
          <div style="background:rgba(29,111,242,0.1);border:1px solid var(--blue);border-radius:12px;padding:10px;margin-bottom:8px;display:flex;gap:6px;">
            <input id="customCatInput" class="form-control" style="flex:1;" placeholder="Ketik nama kategori baru..." value="${escapeHtml(form.customCatName)}" oninput="form.customCatName=this.value" />
            <button type="button" class="btn-finpro-primary" style="padding:0 14px;" onclick="saveCustomCategory()">Tambah</button>
          </div>
        ` : ''}

        <div class="cat-grid" id="txCatGrid">
          ${cats.map(c => `
            <button type="button" class="cat-btn ${form.categoryId === c.id ? 'selected' : ''}" data-id="${c.id}" onclick="selectTxCategory('${c.id}')">
              <span style="color:${c.color};">${getSvg(c.icon)}</span>
              <span>${escapeHtml(c.name)}</span>
            </button>
          `).join('')}
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div>
            <label class="form-label">Akun Bank / Dompet</label>
            <select class="form-control" onchange="form.walletId=this.value">
              ${state.wallets.map(w => `<option value="${w.id}" ${form.walletId===w.id?'selected':''}>${escapeHtml(w.name)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="form-label">Tanggal</label>
            <input type="date" class="form-control" value="${form.date}" onchange="form.date=this.value" />
          </div>
        </div>

        <button type="button" class="btn-submit" onclick="saveTx()">Simpan Transaksi</button>
        ${form.id ? `
          <button type="button" class="btn-danger" onclick="deleteTx('${form.id}')">Hapus Transaksi Ini</button>
        ` : ''}
      `);
    }

    function saveCustomCategory() {
      const inp = document.getElementById('customCatInput');
      const name = ((inp ? inp.value : form.customCatName) || '').trim();
      if (!name) return;
      const newCat = {
        id: 'cust_' + uid(),
        type: form.type,
        name,
        icon: form.type === 'income' ? 'trending' : 'layers',
        color: '#3B82F6',
      };
      state.customCategories.push(newCat);
      form.categoryId = newCat.id;
      form.addingCustomCat = false;
      form.customCatName = '';
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        showToast('Penyimpanan browser gagal. Ekspor backup JSON sebelum menutup halaman.');
      }
      renderTxModal();
    }

    function saveTx() {
      const amtEl = document.getElementById('txAmountInput');
      const noteEl = document.getElementById('txNoteInput');
      const rawAmt = (amtEl ? amtEl.value : form.amount) || '0';
      const amt = parseInt(String(rawAmt).replace(/\D/g, ''), 10) || 0;
      if (amt <= 0) {
        if (amtEl) amtEl.focus();
        showToast('Masukkan nominal lebih dari Rp 0');
        return;
      }
      const cat = getCategory(form.categoryId);
      const noteVal = ((noteEl ? noteEl.value : form.note) || '').trim() || cat.name;
      const payload = {
        id: form.id || uid(),
        type: form.type,
        amount: amt,
        note: noteVal,
        categoryId: form.categoryId,
        walletId: form.walletId,
        date: form.date,
      };
      if (form.id) state.transactions = state.transactions.map(t => t.id === form.id ? payload : t);
      else state.transactions.unshift(payload);
      closeModal();
      saveState();
      showToast('Transaksi berhasil disimpan');
    }

    function deleteTx(id) {
      state.transactions = state.transactions.filter(t => t.id !== id);
      closeModal();
      saveState();
      showToast('Transaksi dihapus');
    }

    /* 3. MODAL SETOR / TARIK TARGET DANA */
    function openSavingDepositModal(preferredSavingId = null) {
      if (!state.savings.length) return openSavingModal();
      const validId = preferredSavingId && state.savings.some(s => s.id === preferredSavingId)
        ? preferredSavingId
        : state.savings[0].id;
      form = {
        savingId: validId,
        walletId: state.wallets[0] ? state.wallets[0].id : '',
        mode: 'deposit',
        amount: '',
      };
      renderSavingDepositModal();
    }

    function openSavingDepositFor(savingId) {
      openSavingDepositModal(savingId);
    }

    function renderSavingDepositModal() {
      const totals = computeTotals();
      const target = state.savings.find(s => s.id === form.savingId) || state.savings[0];
      const maxAvailable = form.mode === 'withdraw'
        ? Math.max(0, Number(target ? target.current : 0) || 0)
        : Math.max(0, Number(totals.walletBalances[form.walletId] || 0));

      openModal(`
        <div class="modal-header">
          <span class="modal-title">${SVG_PATHS.vault} <span>Setor / Tarik Dana Simpanan</span></span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
          <button type="button" class="${form.mode==='deposit'?'btn-finpro-primary':'btn-finpro-secondary'}" onclick="form.mode='deposit';renderSavingDepositModal();">Setor Dana</button>
          <button type="button" class="${form.mode==='withdraw'?'btn-finpro-primary':'btn-finpro-secondary'}" onclick="form.mode='withdraw';renderSavingDepositModal();">Tarik Dana</button>
        </div>
        <label class="form-label">Pilih Target Dana</label>
        <select class="form-control" onchange="form.savingId=this.value;renderSavingDepositModal();">
          ${state.savings.map(s => `<option value="${s.id}" ${form.savingId===s.id?'selected':''}>${escapeHtml(s.name)} (Tersedia: ${formatRupiah(s.current)})</option>`).join('')}
        </select>
        <label class="form-label">${form.mode === 'deposit' ? 'Sumber Akun Bank/Dompet' : 'Tujuan Akun Bank/Dompet'}</label>
        <select class="form-control" onchange="form.walletId=this.value;renderSavingDepositModal();">
          ${state.wallets.map(w => `<option value="${w.id}" ${form.walletId===w.id?'selected':''}>${escapeHtml(w.name)} (Saldo: ${formatRupiah(totals.walletBalances[w.id] || 0)})</option>`).join('')}
        </select>
        <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px;">
          <label class="form-label" style="margin:0;">Nominal (Rp)</label>
          <span style="font-size:11.5px;color:var(--text-sub);">Maks: <strong>${formatRupiah(maxAvailable)}</strong></span>
        </div>
        <input id="savDepInput" type="text" inputmode="numeric" class="form-control" style="font-size:20px;font-weight:800;" placeholder="0" value="${formatThousands(form.amount)}" oninput="form.amount=this.value.replace(/\\D/g,'');this.value=formatThousands(form.amount);" />
        <div class="chip-row">
          <button type="button" class="chip-btn" onclick="form.amount='${maxAvailable}';document.getElementById('savDepInput').value=formatThousands('${maxAvailable}');">Isi Maksimal (${formatRupiah(maxAvailable)})</button>
        </div>
        <button type="button" class="btn-submit" onclick="saveSavingDeposit()">Simpan Perubahan</button>
      `);
    }

    function saveSavingDeposit() {
      const inp = document.getElementById('savDepInput');
      const raw = (inp ? inp.value : form.amount) || '0';
      const amt = parseInt(String(raw).replace(/\D/g, ''), 10) || 0;
      if (amt <= 0) {
        showToast('Masukkan nominal lebih dari Rp 0');
        return;
      }
      const target = state.savings.find(s => s.id === form.savingId);
      if (!target) return;
      const totals = computeTotals();

      if (form.mode === 'deposit') {
        const walletBal = Number(totals.walletBalances[form.walletId]) || 0;
        if (amt > walletBal) {
          showToast(`Saldo akun tidak cukup (Tersedia: ${formatRupiah(walletBal)})`);
          return;
        }
        target.current = (Number(target.current) || 0) + amt;
        state.transactions.unshift({
          id: uid(),
          type: 'expense',
          amount: amt,
          categoryId: 'other_exp',
          walletId: form.walletId,
          note: `Alokasi ke ${target.name}`,
          date: localDateStr(),
          transfer: true,
          savingId: target.id,
        });
      } else {
        const availableSaving = Number(target.current) || 0;
        // Blokir penarikan yang melebihi saldo tabungan agar tidak menciptakan uang fiktif!
        if (amt > availableSaving) {
          showToast(`Dana simpanan tidak cukup! Maksimal tarik: ${formatRupiah(availableSaving)}`);
          return;
        }
        target.current = availableSaving - amt;
        state.transactions.unshift({
          id: uid(),
          type: 'income',
          amount: amt,
          categoryId: 'cashback',
          walletId: form.walletId,
          note: `Pencairan ${target.name}`,
          date: localDateStr(),
          transfer: true,
          savingId: target.id,
        });
      }
      closeModal();
      saveState();
      showToast('Alokasi dana simpanan diperbarui');
    }

        name: s ? s.name : '',

        target: s ? String(s.target || '') : '',

      };
      renderSavingModal();
    }

          ${SAVING_PRESETS.map(p => `
            <button type="button" class="preset-btn ${form.name === p.name ? 'selected' : ''}" data-name="${escapeHtml(p.name)}" onclick="pickSavingPreset('${p.name}', '${p.icon}')">

        </div>

        <label class="form-label">Nama Goal / Target Dana</label>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div>
            <label class="form-label">Dana Terkumpul (Rp)</label>
            <input id="savCurInput" type="text" inputmode="numeric" class="form-control" style="font-size:16px;font-weight:800;" placeholder="0" value="${formatThousands(form.current)}" oninput="form.current=this.value.replace(/\\D/g,'');this.value=formatThousands(form.current);" />
          </div>
          <div>
            <label class="form-label">Target Nominal (Rp)</label>
            <input id="savTarInput" type="text" inputmode="numeric" class="form-control" style="font-size:16px;font-weight:800;" placeholder="0" value="${formatThousands(form.target)}" oninput="form.target=this.value.replace(/\\D/g,'');this.value=formatThousands(form.target);" />
          </div>
        </div>

        <label class="form-label">Target Tanggal Tercapai</label>
        <input id="savDateInput" type="date" class="form-control" value="${form.targetDate}" onchange="form.targetDate=this.value" />

        ${isEdit ? `
          <div style="margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:12px;color:var(--text-sub);display:inline-flex;align-items:center;gap:6px;">
              ${SVG_PATHS.link} <strong>${linkedTxs.length} transaksi tertaut</strong>
            </span>
            <button type="button" class="link-action" style="font-size:12px;" onclick="openSavingDepositFor('${form.id}')">+ Setor / Tarik Dana</button>
          </div>
        ` : ''}

        <button type="button" class="btn-submit" onclick="saveSavingGoal()">Simpan Goal</button>
        ${isEdit ? `
          <button type="button" class="btn-danger" onclick="deleteSavingGoal('${form.id}')">Hapus Goal Ini</button>
        ` : ''}
      `);
    }

    function saveSavingGoal() {
      const nameEl = document.getElementById('savNameInput');
      const curEl = document.getElementById('savCurInput');
      const tarEl = document.getElementById('savTarInput');
      const dateEl = document.getElementById('savDateInput');
      const cleanName = ((nameEl ? nameEl.value : form.name) || '').trim() || 'Goal Baru';
      const curVal = parseInt(String((curEl ? curEl.value : form.current) || '0').replace(/\D/g, ''), 10) || 0;
      const tarVal = parseInt(String((tarEl ? tarEl.value : form.target) || '0').replace(/\D/g, ''), 10) || 1000000;
      const dateVal = (dateEl ? dateEl.value : form.targetDate) || '2027-12-31';

      const payload = {
        id: form.id || uid(),
        name: cleanName,
        icon: SVG_PATHS[form.icon] ? form.icon : 'vault',
        current: curVal,
        target: tarVal,
        targetDate: dateVal,
      };
      if (form.id) state.savings = state.savings.map(s => s.id === form.id ? payload : s);
      else state.savings.push(payload);
      closeModal();
      saveState();
      showToast('Goal simpanan berhasil disimpan');
    }

    function deleteSavingGoal(id) {
      state.savings = state.savings.filter(s => s.id !== id);
      closeModal();
      saveState();
      showToast('Goal simpanan dihapus');
    }

    /* 4B. MODAL BUDGET BULANAN PER KATEGORI (SCREENSHOT 2) */
    function openBudgetModal(budgetId = null) {
      const existing = budgetId ? (state.budgets || []).find(b => b.id === budgetId) : null;
      const expCats = getExpenseCategories();
      const usedCatIds = new Set((state.budgets || []).map(b => b.categoryId));
      const defaultCat = expCats.find(c => !usedCatIds.has(c.id)) || expCats[0];

      form = {
        id: existing ? existing.id : null,
        categoryId: existing ? existing.categoryId : defaultCat.id,
        limit: existing ? String(existing.limit || '') : '',
      };
      renderBudgetModal();
    }

    function selectBudgetCategory(catId) {
      form.categoryId = catId;
      document.querySelectorAll('#budgetCatGrid .cat-btn').forEach(b => {
        b.classList.toggle('selected', b.dataset.id === catId);
      });
    }

    function addBudgetAmount(delta) {
      const inp = document.getElementById('budgetLimitInput');
      const curRaw = inp ? inp.value.replace(/\D/g, '') : form.limit;
      const cur = parseInt(curRaw, 10) || 0;
      form.limit = String(Math.max(0, cur + delta));
      if (inp) inp.value = formatThousands(form.limit);
    }

    function renderBudgetModal() {
      const isEdit = !!form.id;
      const cats = getExpenseCategories();
      openModal(`
        <div class="modal-header">
          <span class="modal-title">${SVG_PATHS.pie} <span>${isEdit ? 'Ubah Budget Kategori' : 'Tambah Budget Kategori'}</span></span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <label class="form-label" style="margin-top:0;">Pilih Kategori Pengeluaran</label>
        <div class="cat-grid" id="budgetCatGrid">
          ${cats.map(c => `
            <button type="button" class="cat-btn ${form.categoryId === c.id ? 'selected' : ''}" data-id="${c.id}" onclick="selectBudgetCategory('${c.id}')">
              <span style="color:${c.color};">${getSvg(c.icon)}</span>
              <span>${escapeHtml(c.name)}</span>
            </button>
          `).join('')}
        </div>

        <label class="form-label">Batas Anggaran Bulanan (Rp)</label>
        <input id="budgetLimitInput" type="text" inputmode="numeric" class="form-control" style="font-size:21px;font-weight:800;" placeholder="0" value="${formatThousands(form.limit)}" oninput="form.limit=this.value.replace(/\\D/g,'');this.value=formatThousands(form.limit);" />
        <div class="chip-row">
          <button type="button" class="chip-btn" onclick="addBudgetAmount(100000)">+100rb</button>
          <button type="button" class="chip-btn" onclick="addBudgetAmount(250000)">+250rb</button>
          <button type="button" class="chip-btn" onclick="addBudgetAmount(500000)">+500rb</button>
          <button type="button" class="chip-btn" onclick="addBudgetAmount(1000000)">+1 Juta</button>
        </div>

        <button type="button" class="btn-submit" onclick="saveBudget()">Simpan Budget</button>
        ${isEdit ? `
          <button type="button" class="btn-danger" onclick="deleteBudget('${form.id}')">Hapus Budget Ini</button>
        ` : ''}
      `);
    }

    function saveBudget() {
      const inp = document.getElementById('budgetLimitInput');
      const raw = (inp ? inp.value : form.limit) || '0';
      const limitVal = parseInt(String(raw).replace(/\D/g, ''), 10) || 0;
      if (limitVal <= 0) {
        showToast('Masukkan batas budget lebih dari Rp 0');
        return;
      }
      if (!Array.isArray(state.budgets)) state.budgets = [];

      // Jika tambah baru tapi kategori sudah ada di daftar budget, update yang sudah ada
      const duplicate = !form.id && state.budgets.find(b => b.categoryId === form.categoryId);
      if (duplicate) {
        duplicate.limit = limitVal;
      } else if (form.id) {
        state.budgets = state.budgets.map(b =>
          b.id === form.id ? { ...b, categoryId: form.categoryId, limit: limitVal } : b
        );
      } else {
        state.budgets.push({
          id: 'b_' + uid(),
          categoryId: form.categoryId,
          limit: limitVal,
        });
      }
      closeModal();
      saveState();
      showToast('Budget kategori berhasil disimpan');
    }

    function deleteBudget(id) {
      state.budgets = (state.budgets || []).filter(b => b.id !== id);
      closeModal();
      saveState();
      showToast('Budget kategori dihapus');
    }

    /* 4C. MODAL DETAIL TANGGAL KALENDER AKTIVITAS */
    function openTxModalOnDate(type, dateStr) {

      form.date = dateStr;
      renderTxModal();
    }

    function openDateDetailModal(dateStr) {
      const dayTxs = state.transactions.filter(t => t.date === dateStr);
      let inc = 0, exp = 0;
      dayTxs.forEach(t => {
        if (t.transfer) return;
        const amt = Number(t.amount) || 0;
        if (t.type === 'income') inc += amt;
        else exp += amt;
      });

      openModal(`
        <div class="modal-header">
          <span class="modal-title">${SVG_PATHS.calendar} <span>Aktivitas ${formatFullDateIndo(dateStr)}</span></span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">

            <div style="font-size:10.5px;font-weight:700;color:var(--text-sub);">PEMASUKAN</div>
            <div style="font-size:15px;font-weight:800;color:var(--emerald);margin-top:2px;">+${formatRupiah(inc, true)}</div>
          </div>
          <div style="padding:10px 12px;border-radius:12px;background:rgba(255,77,106,0.08);border:1px solid rgba(255,77,106,0.2);">
            <div style="font-size:10.5px;font-weight:700;color:var(--text-sub);">PENGELUARAN</div>
            <div style="font-size:15px;font-weight:800;color:var(--danger);margin-top:2px;">-${formatRupiah(exp, true)}</div>
          </div>
        </div>

        <div style="max-height:42vh;overflow-y:auto;">
          ${dayTxs.length === 0
            ? `<p style="font-size:12.5px;color:var(--text-sub);text-align:center;padding:18px 0;">Belum ada transaksi pada tanggal ini.</p>`
            : dayTxs.map(tx => {
                const cat = tx.transfer
                  ? { name: 'Transfer Target Dana', svg: SVG_PATHS.vault, color: '#8B5CF6' }
                  : getCategory(tx.categoryId);
                const w = getWallet(tx.walletId);
                const isInc = tx.type === 'income';
                return `
                  <div class="item-row" onclick="openTxModal('${tx.type}', '${tx.id}')">
                    <div class="item-left">
                      <div class="icon-squircle" style="width:36px;height:36px;background:${cat.color}1F;color:${cat.color};">${cat.svg}</div>
                      <div class="item-info">
                        <div class="item-title">${escapeHtml(tx.note || cat.name)}</div>
                        <div class="item-meta">${escapeHtml(cat.name)} • ${escapeHtml(w.name)}</div>
                      </div>
                    </div>
                    <div class="item-right">
                      <div class="item-amt" style="color:${tx.transfer ? 'var(--text-sub)' : (isInc ? 'var(--emerald)' : 'var(--danger)')};">
                        ${isInc ? '+' : '-'} ${formatRupiah(tx.amount, true)}
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;">
          <button type="button" class="btn-finpro-primary" onclick="openTxModalOnDate('income', '${dateStr}')">
            ${SVG_PATHS.plus} <span>Pemasukan</span>
          </button>
          <button type="button" class="btn-finpro-secondary" onclick="openTxModalOnDate('expense', '${dateStr}')">
            ${SVG_PATHS.plus} <span>Pengeluaran</span>
          </button>
        </div>
      `);
    }

            <select class="form-control" onchange="form.currency=this.value">
              ${PORTFOLIO_CURRENCIES.map(c => `<option value="${c.id}" ${form.currency === c.id ? 'selected' : ''}>${escapeHtml(c.label)}</option>`).join('')}
            </select>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:2fr 1fr;gap:10px;">
          <div>
            <label class="form-label">Nilai Saat Ini (Rp)</label>
            <input id="portValueInput" type="text" inputmode="numeric" class="form-control" style="font-size:19px;font-weight:800;" placeholder="0" value="${formatThousands(form.value)}" oninput="form.value=this.value.replace(/\\D/g,'');this.value=formatThousands(form.value);" />
          </div>
          <div>
            <label class="form-label">Return / Profit (%)</label>
            <input id="portPctInput" type="text" class="form-control" style="font-size:16px;font-weight:800;" placeholder="8.4" value="${escapeHtml(form.changePct)}" oninput="form.changePct=this.value" />
          </div>
        </div>

        <div class="chip-row">
          <button type="button" class="chip-btn" onclick="addPortfolioAmount(500000)">+500rb</button>
          <button type="button" class="chip-btn" onclick="addPortfolioAmount(1000000)">+1 Juta</button>
          <button type="button" class="chip-btn" onclick="addPortfolioAmount(5000000)">+5 Juta</button>
          <button type="button" class="chip-btn" onclick="addPortfolioAmount(10000000)">+10 Juta</button>
        </div>

        <button type="button" class="btn-submit" onclick="savePortfolioItem()">Simpan Instrumen Aset</button>
        ${isEdit ? `
          <button type="button" class="btn-danger" onclick="deletePortfolioItem('${form.id}')">Hapus Instrumen Ini</button>
        ` : ''}
      `);
    }

    function savePortfolioItem() {
      const nameEl = document.getElementById('portNameInput');
      const tickerEl = document.getElementById('portTickerInput');
      const valEl = document.getElementById('portValueInput');
      const pctEl = document.getElementById('portPctInput');

      const cleanName = ((nameEl ? nameEl.value : form.name) || '').trim() || 'Instrumen Baru';
      const cleanTicker = (((tickerEl ? tickerEl.value : form.ticker) || '').trim() || cleanName.slice(0, 4)).toUpperCase();
      const valNum = parseInt(String((valEl ? valEl.value : form.value) || '0').replace(/\D/g, ''), 10) || 0;
      const pctNum = parseFloat(String((pctEl ? pctEl.value : form.changePct) || '0').replace(',', '.')) || 0;

      if (!Array.isArray(state.portfolio)) state.portfolio = [];
      const payload = {
        id: form.id || 'p_' + uid(),
        name: cleanName,
        ticker: cleanTicker,
        instrument: form.instrument || 'Saham',
        currency: form.currency || 'IDR',
        value: valNum,
        changePct: pctNum,
      };

      if (form.id) {
        state.portfolio = state.portfolio.map(p => p.id === form.id ? payload : p);
      } else {
        state.portfolio.push(payload);
      }
      closeModal();
      saveState();
      showToast(`${cleanName} disimpan ke portofolio`);
    }

    function deletePortfolioItem(id) {
      state.portfolio = (state.portfolio || []).filter(p => p.id !== id);
      closeModal();
      saveState();
      showToast('Instrumen dihapus dari portofolio');
    }

    /* 4E. MODAL KARTU KREDIT & CICILAN (SCREENSHOT 3) */
    const LIABILITY_PRESETS = [
      { name: 'BCA KrisFlyer', provider: 'BCA', type: 'Kartu Kredit', limit: '15000000' },
      { name: 'BCA Everyday Card', provider: 'BCA', type: 'Kartu Kredit', limit: '10000000' },
      { name: 'Mandiri Fengshui / Skyz', provider: 'MDR', type: 'Kartu Kredit', limit: '20000000' },
      { name: 'BNI JCB / Visa', provider: 'BNI', type: 'Kartu Kredit', limit: '15000000' },
      { name: 'BRI Touch', provider: 'BRI', type: 'Kartu Kredit', limit: '12000000' },
      { name: 'ShopeePayLater / Kredivo', provider: 'SPL', type: 'PayLater', limit: '8000000' },
      { name: 'Cicilan Gadget / Elektronik', provider: 'CCL', type: 'Cicilan Bulanan', limit: '15000000' },
      { name: 'Cicilan KPR / Kendaraan', provider: 'KPR', type: 'Cicilan Aset', limit: '100000000' },
    ];

    function openLiabilityModal(liabilityId = null) {
      const existing = liabilityId ? (state.liabilities || []).find(l => l.id === liabilityId) : null;
      form = {
        id: existing ? existing.id : null,
        name: existing ? existing.name : '',
        provider: existing ? existing.provider : 'BCA',
        type: existing ? existing.type : 'Kartu Kredit',
        usedAmount: existing ? String(existing.usedAmount || '') : '',
        limitAmount: existing ? String(existing.limitAmount || '15000000') : '15000000',
        payWalletId: state.wallets[0] ? state.wallets[0].id : '',
      };
      renderLiabilityModal();
    }

    function pickLiabilityPreset(idx) {
      const p = LIABILITY_PRESETS[idx];
      if (!p) return;
      form.name = p.name;
      form.provider = p.provider;
      form.type = p.type;
      form.limitAmount = p.limit;
      renderLiabilityModal();
    }

    function addLiabilityAmount(delta) {
      const inp = document.getElementById('liabUsedInput');
      const curRaw = inp ? inp.value.replace(/\D/g, '') : form.usedAmount;
      const cur = parseInt(curRaw, 10) || 0;
      form.usedAmount = String(Math.max(0, cur + delta));
      if (inp) inp.value = formatThousands(form.usedAmount);
    }

    function renderLiabilityModal() {
      const isEdit = !!form.id;
      const curUsed = parseInt(String(form.usedAmount || '0').replace(/\D/g, ''), 10) || 0;
      openModal(`
        <div class="modal-header">
          <span class="modal-title">${SVG_PATHS.card} <span>${isEdit ? 'Kelola Kartu Kredit / Cicilan' : 'Tambah Kartu Kredit / Cicilan'}</span></span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <label class="form-label" style="margin-top:0;">Pilih Cepat Kartu Kredit / Cicilan</label>
        <div class="preset-grid">
          ${LIABILITY_PRESETS.map((p, idx) => `
            <button type="button" class="preset-btn ${form.name === p.name ? 'selected' : ''}" onclick="pickLiabilityPreset(${idx})">
              <span style="font-size:9px;font-weight:900;color:#FF6B81;">${escapeHtml(p.provider)}</span>
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(p.name)}</span>
            </button>
          `).join('')}
        </div>

        <div style="display:grid;grid-template-columns:2fr 1fr;gap:10px;">
          <div>
            <label class="form-label">Nama Kartu Kredit / Cicilan</label>
            <input id="liabNameInput" type="text" class="form-control" style="font-weight:700;" placeholder="Cth: BCA KrisFlyer..." value="${escapeHtml(form.name)}" oninput="form.name=this.value" />
          </div>
          <div>
            <label class="form-label">Kode Bank</label>
            <input id="liabProvInput" type="text" class="form-control" style="font-weight:800;text-transform:uppercase;" maxlength="4" placeholder="BCA" value="${escapeHtml(form.provider)}" oninput="form.provider=this.value.toUpperCase()" />
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div>
            <label class="form-label">Tagihan Terpakai Saat Ini (Rp)</label>
            <input id="liabUsedInput" type="text" inputmode="numeric" class="form-control" style="font-size:18px;font-weight:800;color:var(--danger);" placeholder="0" value="${formatThousands(form.usedAmount)}" oninput="form.usedAmount=this.value.replace(/\\D/g,'');this.value=formatThousands(form.usedAmount);" />
          </div>
          <div>
            <label class="form-label">Batas Limit Total (Rp)</label>
            <input id="liabLimitInput" type="text" inputmode="numeric" class="form-control" style="font-size:18px;font-weight:800;" placeholder="15.000.000" value="${formatThousands(form.limitAmount)}" oninput="form.limitAmount=this.value.replace(/\\D/g,'');this.value=formatThousands(form.limitAmount);" />
          </div>
        </div>

        <div class="chip-row">
          <button type="button" class="chip-btn" onclick="addLiabilityAmount(100000)">+100rb</button>
          <button type="button" class="chip-btn" onclick="addLiabilityAmount(500000)">+500rb</button>
          <button type="button" class="chip-btn" onclick="addLiabilityAmount(1000000)">+1 Juta</button>
          <button type="button" class="chip-btn" style="color:var(--emerald);" onclick="form.usedAmount='0';document.getElementById('liabUsedInput').value='0';">Lunas (Rp 0)</button>
        </div>

        ${isEdit && curUsed > 0 ? `
          <div style="margin-top:12px;padding:12px;border-radius:14px;background:rgba(0,229,143,0.06);border:1px solid rgba(0,229,143,0.2);">
            <div style="font-size:11.5px;font-weight:800;color:var(--emerald);margin-bottom:6px;">LUNASI TAGIHAN DARI SALDO REKENING</div>
            <div style="display:flex;gap:8px;">
              <select class="form-control" style="flex:1;" onchange="form.payWalletId=this.value">
                ${state.wallets.map(w => `<option value="${w.id}" ${form.payWalletId===w.id?'selected':''}>${escapeHtml(w.name)}</option>`).join('')}
              </select>
              <button type="button" class="btn-finpro-primary" style="white-space:nowrap;" onclick="payLiabilityBill('${form.id}')">Bayar Lunas</button>
            </div>
          </div>
        ` : ''}

        <button type="button" class="btn-submit" onclick="saveLiabilityItem()">Simpan Kartu / Cicilan</button>
        ${isEdit ? `
          <button type="button" class="btn-danger" onclick="deleteLiabilityItem('${form.id}')">Hapus Kartu / Cicilan Ini</button>
        ` : ''}
      `);
    }

    function saveLiabilityItem() {
      const nameEl = document.getElementById('liabNameInput');
      const provEl = document.getElementById('liabProvInput');
      const usedEl = document.getElementById('liabUsedInput');
      const limEl = document.getElementById('liabLimitInput');

      const cleanName = ((nameEl ? nameEl.value : form.name) || '').trim() || 'Kartu Kredit';
      const cleanProv = (((provEl ? provEl.value : form.provider) || '').trim() || cleanName.slice(0, 3)).toUpperCase();
      const usedVal = parseInt(String((usedEl ? usedEl.value : form.usedAmount) || '0').replace(/\D/g, ''), 10) || 0;
      const limVal = parseInt(String((limEl ? limEl.value : form.limitAmount) || '0').replace(/\D/g, ''), 10) || 0;

      if (!Array.isArray(state.liabilities)) state.liabilities = [];
      const payload = {
        id: form.id || 'l_' + uid(),
        name: cleanName,
        provider: cleanProv,
        type: form.type || 'Kartu Kredit',
        usedAmount: usedVal,
        limitAmount: limVal,
      };

      if (form.id) {
        state.liabilities = state.liabilities.map(l => l.id === form.id ? payload : l);
      } else {
        state.liabilities.push(payload);
      }
      closeModal();
      saveState();
      showToast(`${cleanName} berhasil disimpan`);
    }

    function payLiabilityBill(id) {
      const liab = (state.liabilities || []).find(l => l.id === id);
      if (!liab) return;
      const bill = Math.max(0, Number(liab.usedAmount) || 0);
      if (bill <= 0) {
        showToast('Tagihan sudah Rp 0 (Lunas)');
        return;
      }
      const totals = computeTotals();
      const wId = form.payWalletId || (state.wallets[0] && state.wallets[0].id);
      const wBal = Number(totals.walletBalances[wId] || 0);
      if (wBal < bill) {
        showToast(`Saldo rekening tidak cukup untuk melunasi ${formatRupiah(bill)}`);
        return;
      }
      liab.usedAmount = 0;
      state.transactions.unshift({
        id: uid(),
        type: 'expense',
        amount: bill,
        categoryId: 'tagihan',
        walletId: wId,
        note: `Bayar Tagihan ${liab.name}`,
        date: localDateStr(),
      });
      closeModal();
      saveState();
      showToast(`Tagihan ${liab.name} (${formatRupiah(bill)}) berhasil dilunasi!`);
    }

    function deleteLiabilityItem(id) {
      state.liabilities = (state.liabilities || []).filter(l => l.id !== id);
      closeModal();
      saveState();
      showToast('Kartu kredit / cicilan dihapus');
    }

    /* 5. MODAL PROFIL */
    function openProfileModal() {
      form = { userName: state.userName || 'Alfian Dimas' };
      openModal(`
        <div class="modal-header">
          <span class="modal-title">Ubah Nama Profil</span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <label class="form-label" style="margin-top:0;">Nama Lengkap / Panggilan</label>
        <input id="profNameInput" type="text" class="form-control" style="font-size:16px;font-weight:700;" value="${escapeHtml(form.userName)}" oninput="form.userName=this.value" />
        <button type="button" class="btn-submit" onclick="saveProfileName()">Simpan Nama</button>
      `);
    }

    function saveProfileName() {
      const el = document.getElementById('profNameInput');
      const val = ((el ? el.value : form.userName) || '').trim();
      if (val) {
        state.userName = val;
        closeModal();
        saveState();
        showToast('Nama profil berhasil diperbarui');
      }
    }

    /* 6. MODAL PENGATURAN DATA, BACKUP EKSPOR/IMPOR & RESET */
    function exportBackupJson() {
      const payload = {
        app: 'DompetKu Pro',
        version: 5,
        exportedAt: new Date().toISOString(),
        data: state,
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `dompetku-backup-${localDateStr()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      showToast('File Backup JSON berhasil diunduh');
    }

    function exportTransactionsCsv() {
      const csvCell = (value, protectFormula = true) => {
        let text = String(value == null ? '' : value);
        // Prevent spreadsheet formula injection in user-controlled text fields.
        if (protectFormula && /^[\\t\\r ]*[=+\\-@]/.test(text)) text = "'" + text;
        return '"' + text.replace(/"/g, '""') + '"';
      };
      const rows = [['Tanggal', 'Tipe', 'Kategori', 'Keterangan', 'Akun', 'Nominal']];
      state.transactions.forEach(t => {
        const cat = t.transfer ? { name: 'Transfer Target Dana' } : (getCategory(t.categoryId) || { name: 'Kategori tidak ditemukan' });
        const w = (state.wallets || []).find(item => item.id === t.walletId);
        const typeLabel = t.transfer ? 'Transfer' : (t.type === 'income' ? 'Pemasukan' : 'Pengeluaran');
        rows.push([
          t.date || '',
          typeLabel,
          cat.name || 'Kategori tidak ditemukan',
          String(t.note || ''),
          w ? String(w.name || '') : 'Akun tidak ditemukan',
          Number.isFinite(Number(t.amount)) ? Number(t.amount) : 0,
        ]);
      });
      const csvContent = '\\uFEFF' + rows.map((row, rowIndex) =>
        row.map((cell, columnIndex) => csvCell(cell, !(rowIndex > 0 && columnIndex === 5))).join(',')
      ).join('\\r\\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `dompetku-transaksi-${localDateStr()}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      showToast('Laporan CSV berhasil diunduh');
    }

    function handleImportJsonFile(event) {
      const input = event.target;
      const file = input && input.files && input.files[0];
      if (!file) return;
      const clearInput = () => { if (input) input.value = ''; };
      const reader = new FileReader();
      reader.onerror = () => {
        showToast('Gagal membaca file. Coba pilih backup JSON lain.');
        clearInput();
      };
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          const candidate = parsed && parsed.data && isValidState(parsed.data) ? parsed.data : parsed;
          if (!isValidState(candidate)) {
            showToast('Format backup tidak valid atau koleksi datanya rusak. Data saat ini tidak diubah.');
            return;
          }
          const normalized = normalizeState(candidate);
          // Snapshot first, and only then replace the current state.
          saveSnapshot('Sebelum impor backup');
          state = normalized;
          closeModal();
          saveState();
          showToast('Data backup berhasil dipulihkan!');
        } catch (err) {
          showToast('Gagal membaca backup JSON. Data saat ini tidak diubah.');
        } finally {
          clearInput();
        }
      };
      reader.readAsText(file);
    }

    function openDataModal() {
      const snap = getSnapshot();
      openModal(`
        <div class="modal-header">
          <span class="modal-title">${SVG_PATHS.settings} <span>Backup & Kelola Data</span></span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <label class="form-label" style="margin-top:0;">Cadangkan & Pulihkan Data (Backup)</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
          <button type="button" class="btn-finpro-primary" onclick="exportBackupJson()">
            ${SVG_PATHS.income}
            <span>Ekspor JSON</span>
          </button>
          <button type="button" class="btn-finpro-secondary" onclick="exportTransactionsCsv()">
            ${SVG_PATHS.layers}
            <span>Ekspor CSV</span>
          </button>
        </div>
        <input type="file" id="importJsonInput" accept=".json,application/json" style="display:none;" onchange="handleImportJsonFile(event)" />
        <button type="button" class="btn-finpro-secondary" style="width:100%;margin-bottom:10px;" onclick="document.getElementById('importJsonInput').click()">
          ${SVG_PATHS.expense}
          <span>Impor / Pulihkan dari File JSON</span>
        </button>

        ${snap ? `
          <button type="button" class="btn-submit" style="margin-top:4px;margin-bottom:10px;background:linear-gradient(135deg,#059669,#10B981);" onclick="restoreSnapshot()">
            Pulihkan Data Sebelum Reset (${escapeHtml(snap.reason || 'Cadangan')})
          </button>
        ` : ''}

        <label class="form-label">Reset & Data Contoh</label>
        <button type="button" class="btn-danger" onclick="resetAllToZero()">
          Nolkan Semua Saldo & Transaksi (Rp 0)
        </button>
        <button type="button" class="btn-danger" style="color:var(--text-main);border-color:var(--glass-border);background:rgba(255,255,255,0.05);" onclick="confirmAction({title:'Reset penuh ke setelan awal?',message:'Semua akun, transaksi, dan target dana akan dikembalikan ke daftar awal Rp 0. Cadangan otomatis tetap disimpan.',confirmLabel:'Ya, Reset Penuh',onConfirm:doFullReset})">
          Reset Penuh ke Setelan Awal (Rp 0)
        </button>
        <button type="button" class="btn-finpro-secondary" style="width:100%;margin-top:8px;" onclick="confirmAction({title:'Muat contoh data?',message:'Data saat ini akan dicadangkan otomatis lalu diganti dengan contoh data dashboard.',confirmLabel:'Muat Contoh',onConfirm:doLoadSample})">
          Muat Contoh Data Dashboard
        </button>
      `);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    saveState();
  </script>
  <script src="./dompetku_safety_patch.js?v=fix7"></script>
  <script src="./dompetku_budggt_patch.js?v=budggt2fix1"></script>
