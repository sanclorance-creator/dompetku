<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B0E14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DompetKu" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>DompetKu Pro — Smart Personal Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0A0D14;
      --bg-elevated: #121621;
      --card-bg: linear-gradient(160deg, rgba(25, 30, 44, 0.92) 0%, rgba(16, 20, 30, 0.96) 100%);
      --card-solid: #151A26;
      --card-hover: rgba(32, 39, 56, 0.95);
      --glass-border: rgba(255, 255, 255, 0.075);
      --glass-highlight: rgba(255, 255, 255, 0.14);
      --text-main: #F8FAFC;
      --text-sub: #94A3B8;
      --text-muted: #64748B;
      --blue: #1D6FF2;
      --blue-light: #3B82F6;
      --blue-glow: rgba(29, 111, 242, 0.38);
      --emerald: #00E58F;
      --emerald-soft: rgba(0, 229, 143, 0.14);
      --danger: #FF4D6A;
      --danger-soft: rgba(255, 77, 106, 0.14);
      --warning: #F59E0B;
      --input-bg: rgba(11, 14, 21, 0.75);
      --shadow-card: 0 18px 40px -12px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.07);
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html[data-theme="light"] {
      --bg-main: #F1F5F9;
      --bg-elevated: #FFFFFF;
      --card-bg: linear-gradient(160deg, #FFFFFF 0%, #F8FAFC 100%);
      --card-solid: #FFFFFF;
      --card-hover: #F1F5F9;
      --glass-border: rgba(15, 23, 42, 0.08);
      --glass-highlight: rgba(15, 23, 42, 0.15);
      --text-main: #0F172A;
      --text-sub: #475569;
      --text-muted: #64748B;
      --blue: #1D6FF2;
      --blue-light: #2563EB;
      --blue-glow: rgba(29, 111, 242, 0.25);
      --emerald: #059669;
      --emerald-soft: rgba(16, 185, 129, 0.12);
      --danger: #E11D48;
      --danger-soft: rgba(225, 29, 72, 0.1);
      --input-bg: #F8FAFC;
      --shadow-card: 0 12px 28px -8px rgba(15, 23, 42, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      background-image:
        radial-gradient(circle at 15% 0%, rgba(29, 111, 242, 0.13), transparent 42%),
        radial-gradient(circle at 85% 15%, rgba(0, 229, 143, 0.07), transparent 38%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
      transition: background-color 0.35s var(--ease-spring), color 0.35s var(--ease-spring);
    }

    svg {
      display: block;
      flex-shrink: 0;
    }

    /* Smooth Keyframes */
    @keyframes fadeUpSpring {
      0% { opacity: 0; transform: translateY(14px) scale(0.985); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes drawLine {
      0% { stroke-dashoffset: 900; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.65; }
    }

    .anim-in {
      animation: fadeUpSpring 0.48s var(--ease-spring) both;
    }
    .d-1 { animation-delay: 0.04s; }
    .d-2 { animation-delay: 0.08s; }
    .d-3 { animation-delay: 0.12s; }
    .d-4 { animation-delay: 0.16s; }

    /* Toast */
    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px) scale(0.9);
      background: rgba(20, 25, 38, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 11px 20px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 700;
      z-index: 999;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.45);
      transition: transform 0.38s var(--ease-spring), opacity 0.3s ease;
      opacity: 0;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0) scale(1);
      opacity: 1;
    }

    /* ==================== SIDEBAR / NAVIGATION ==================== */
    .sidebar {
      width: 240px;
      background: rgba(14, 18, 28, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid var(--glass-border);
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      padding: 24px 14px;
      transition: background 0.3s ease;
    }
    html[data-theme="light"] .sidebar {
      background: rgba(255, 255, 255, 0.9);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 4px 12px 28px;
    }
    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: linear-gradient(135deg, rgba(29, 111, 242, 0.2), rgba(29, 111, 242, 0.05));
      border: 1px solid rgba(29, 111, 242, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(29, 111, 242, 0.25);
    }
    .brand-text {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text-main);
    }
    .brand-pro {
      font-size: 10px;
      font-weight: 800;
      color: var(--blue-light);
      background: rgba(29, 111, 242, 0.14);
      padding: 2px 6px;
      border-radius: 6px;
      margin-left: 4px;
      vertical-align: middle;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .nav-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 13px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.24s var(--ease-spring);
    }
    .nav-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.04);
    }
    .nav-btn:active {
      transform: scale(0.96);
    }
    .nav-btn.active {
      background: linear-gradient(135deg, rgba(29, 111, 242, 0.22) 0%, rgba(29, 111, 242, 0.06) 100%);
      border-color: rgba(29, 111, 242, 0.35);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 6px 20px -4px rgba(29, 111, 242, 0.28);
    }
    html[data-theme="light"] .nav-btn.active {
      background: var(--blue);
      color: #fff;
    }
    .nav-btn.active svg {
      color: var(--blue-light);
    }
    html[data-theme="light"] .nav-btn.active svg {
      color: #fff;
    }

    /* ==================== MAIN & TOPBAR ==================== */
    .main {
      margin-left: 240px;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 68px;
      background: rgba(14, 18, 28, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--glass-border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    html[data-theme="light"] .topbar {
      background: rgba(255, 255, 255, 0.82);
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      padding: 5px 10px 5px 5px;
      border-radius: 99px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.03);
      text-align: left;
      transition: all 0.22s var(--ease-spring);
    }
    .user-chip:hover {
      border-color: var(--glass-highlight);
      transform: translateY(-1px);
    }
    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1D6FF2, #00E58F);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 4px 10px rgba(29, 111, 242, 0.35);
    }
    .user-greeting {
      font-size: 10.5px;
      color: var(--text-sub);
      font-weight: 600;
    }
    .user-name {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* FinPro Theme Switcher Pill */
    .theme-pill {
      display: inline-flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 99px;
      padding: 3px;
      gap: 2px;
    }
    .theme-pill-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.22s var(--ease-spring);
    }
    .theme-pill-btn.active {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 2px 8px var(--blue-glow);
    }

    .top-btn {
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      height: 36px;
      padding: 0 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.22s var(--ease-spring);
    }
    .top-btn:hover {
      border-color: var(--glass-highlight);
      transform: translateY(-1px);
    }
    .top-btn:active {
      transform: scale(0.95);
    }
    .top-btn.danger {
      border-color: rgba(255, 77, 106, 0.28);
      background: var(--danger-soft);
      color: var(--danger);
    }

    .container {
      padding: 22px 24px 104px;
      max-width: 1240px;
      width: 100%;
      margin: 0 auto;
    }

    /* ==================== FINPRO CARDS & DASHBOARD GRID ==================== */
    .finpro-top-grid {
      display: grid;
      grid-template-columns: 1.35fr 1.15fr 0.85fr;
      gap: 16px;
      margin-bottom: 18px;
    }

    .f-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 20px;
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
      transition: transform 0.28s var(--ease-spring), border-color 0.28s ease;
    }
    .f-card:hover {
      border-color: var(--glass-highlight);
    }

    /* Card 1: Total Balance (FinPro Top-Center Widget Style) */
    .balance-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        radial-gradient(circle at 90% 10%, rgba(29, 111, 242, 0.22), transparent 55%),
        var(--card-bg);
    }
    .bal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .bal-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 0.2px;
    }
    .bank-filter-select {
      margin-top: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
    }
    .bank-filter-select option {
      background: #151A26;
      color: #fff;
    }
    .pill-edit-btn {
      background: rgba(29, 111, 242, 0.14);
      border: 1px solid rgba(29, 111, 242, 0.35);
      color: #60A5FA;
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.22s var(--ease-spring);
    }
    html[data-theme="light"] .pill-edit-btn {
      color: var(--blue);
    }
    .pill-edit-btn:hover {
      background: var(--blue);
      color: #fff;
      transform: translateY(-1px);
    }

    .bal-amount-wrap {
      margin: 16px 0 18px;
      cursor: pointer;
    }
    .bal-currency {
      color: var(--blue-light);
      font-weight: 800;
      font-size: 28px;
      margin-right: 4px;
    }
    .bal-digits {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;
      color: var(--text-main);
    }

    .bal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-finpro-primary {
      border: none;
      background: linear-gradient(135deg, #2575FC 0%, #1D6FF2 100%);
      color: #fff;
      padding: 12px 14px;
      border-radius: 13px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 8px 22px -4px var(--blue-glow);
      transition: all 0.24s var(--ease-spring);
    }
    .btn-finpro-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px -4px var(--blue-glow);
    }
    .btn-finpro-primary:active {
      transform: scale(0.96);
    }

    .btn-finpro-secondary {
      border: 1px solid rgba(29, 111, 242, 0.32);
      background: rgba(29, 111, 242, 0.08);
      color: #60A5FA;
      padding: 12px 14px;
      border-radius: 13px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.24s var(--ease-spring);
    }
    html[data-theme="light"] .btn-finpro-secondary {
      color: var(--blue);
    }
    .btn-finpro-secondary:hover {
      background: rgba(29, 111, 242, 0.16);
      transform: translateY(-2px);
    }
    .btn-finpro-secondary:active {
      transform: scale(0.96);
    }

    /* Card 2: Cashflow & Smooth Spline Chart */
    .card-head-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .card-subtitle {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-sub);
    }
    .card-main-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
    }
    .period-pills {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 99px;
      padding: 2px;
      gap: 2px;
    }
    .period-pill {
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 10.5px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.2s var(--ease-spring);
    }
    .period-pill.active {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 2px 8px var(--blue-glow);
    }

    .cashflow-mini-stats {
      display: flex;
      gap: 14px;
      margin: 8px 0 10px;
      flex-wrap: wrap;
    }
    .cf-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
    }
    .cf-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .spline-svg {
      width: 100%;
      height: 92px;
      overflow: visible;
    }
    .spline-path {
      stroke-dasharray: 900;
      stroke-dashoffset: 0;
      animation: drawLine 1.1s var(--ease-spring) forwards;
    }

    /* Card 3: Radial Score / Target Tabungan Gauge */
    .gauge-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }
    .gauge-wrap {
      position: relative;
      width: 160px;
      height: 105px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin: 4px 0;
    }
    .gauge-score-text {
      position: absolute;
      bottom: 4px;
      left: 0;
      right: 0;
      text-align: center;
    }
    .gauge-num {
      font-size: 30px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1;
    }
    .gauge-caption {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--blue-light);
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ==================== LOWER TWO-COLUMN LAYOUT ==================== */
    .two-col {
      display: grid;
      grid-template-columns: 1.05fr 1.35fr;
      gap: 16px;
      align-items: start;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-title {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .link-action {
      background: rgba(29, 111, 242, 0.12);
      border: 1px solid rgba(29, 111, 242, 0.28);
      color: #60A5FA;
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.22s var(--ease-spring);
    }
    html[data-theme="light"] .link-action {
      color: var(--blue);
    }
    .link-action:hover {
      background: var(--blue);
      color: #fff;
      transform: translateY(-1px);
    }

    /* Item Rows (Wallets & Transactions) */
    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 10px;
      border-bottom: 1px solid var(--glass-border);
      gap: 12px;
      cursor: pointer;
      border-radius: 14px;
      transition: all 0.22s var(--ease-spring);
    }
    .item-row:hover {
      background: rgba(255, 255, 255, 0.035);
      transform: translateX(3px);
    }
    html[data-theme="light"] .item-row:hover {
      background: rgba(15, 23, 42, 0.035);
    }
    .item-row:active {
      transform: scale(0.985);
    }
    .item-row:last-child {
      border-bottom: none;
    }
    .item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }
    .icon-squircle {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 800;
      font-size: 11.5px;
      letter-spacing: -0.3px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .item-info {
      min-width: 0;
      flex: 1;
    }
    .item-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-meta {
      font-size: 11.5px;
      color: var(--text-sub);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-right {
      text-align: right;
      flex-shrink: 0;
    }
    .item-amt {
      font-size: 13.5px;
      font-weight: 800;
    }
    .edit-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10.5px;
      font-weight: 700;
      color: #60A5FA;
      background: rgba(29, 111, 242, 0.12);
      padding: 2px 8px;
      border-radius: 6px;
      margin-top: 3px;
    }
    html[data-theme="light"] .edit-pill {
      color: var(--blue);
    }

    /* FinPro Transaction Table Header */
    .tx-table-head {
      display: grid;
      grid-template-columns: 1.6fr 1fr 0.8fr 0.9fr;
      padding: 6px 10px 10px;
      border-bottom: 1px solid var(--glass-border);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .tx-grid-row {
      display: grid;
      grid-template-columns: 1.6fr 1fr 0.8fr 0.9fr;
      align-items: center;
      padding: 12px 10px;
      border-bottom: 1px solid var(--glass-border);
      border-radius: 13px;
      cursor: pointer;
      gap: 8px;
      transition: all 0.22s var(--ease-spring);
    }
    .tx-grid-row:hover {
      background: rgba(255, 255, 255, 0.04);
      transform: translateX(3px);
    }
    .tx-grid-row:last-child {
      border-bottom: none;
    }

    /* Progress Track (FinPro Glowing Bar) */
    .progress-track {
      height: 7px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 99px;
      overflow: hidden;
      margin: 8px 0;
    }
    html[data-theme="light"] .progress-track {
      background: #E2E8F0;
    }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #1D6FF2 0%, #00E58F 100%);
      box-shadow: 0 0 12px rgba(0, 229, 143, 0.45);
      transition: width 0.6s var(--ease-spring);
    }

    /* ==================== SMOOTH SPRING MODAL ==================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(6, 9, 15, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s var(--ease-spring);
    }
    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      background: var(--card-solid);
      border: 1px solid var(--glass-highlight);
      width: 100%;
      max-width: 470px;
      border-radius: 24px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
      transform: translateY(24px) scale(0.96);
      transition: transform 0.34s var(--ease-spring);
    }
    .modal-backdrop.open .modal-box {
      transform: translateY(0) scale(1);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--glass-border);
    }
    .modal-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .close-btn:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      margin: 12px 0 6px;
    }
    .form-control {
      width: 100%;
      border: 1.5px solid var(--glass-border);
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      background: var(--input-bg);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .form-control:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(29, 111, 242, 0.2);
    }
    .form-control option {
      background: var(--card-solid);
      color: var(--text-main);
    }

    .chip-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .chip-btn {
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      padding: 7px 11px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s var(--ease-spring);
    }
    .chip-btn:hover {
      border-color: var(--blue-light);
    }
    .chip-btn:active {
      transform: scale(0.95);
    }
    .chip-btn.active {
      background: rgba(29, 111, 242, 0.2);
      border-color: var(--blue);
      color: #60A5FA;
    }
    html[data-theme="light"] .chip-btn.active {
      color: var(--blue);
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      max-height: 225px;
      overflow-y: auto;
      padding: 2px;
    }
    .cat-btn {
      border: 1.5px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.025);
      border-radius: 12px;
      padding: 9px 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-sub);
      text-align: center;
      min-height: 66px;
      transition: all 0.2s var(--ease-spring);
    }
    .cat-btn:active {
      transform: scale(0.95);
    }
    .cat-btn.selected {
      border-color: var(--blue);
      background: rgba(29, 111, 242, 0.16);
      color: var(--text-main);
      box-shadow: 0 4px 14px rgba(29, 111, 242, 0.22);
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      max-height: 170px;
      overflow-y: auto;
      padding: 2px;
    }
    .preset-btn {
      border: 1.5px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.03);
      border-radius: 11px;
      padding: 8px 8px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      text-align: left;
      transition: all 0.2s var(--ease-spring);
    }
    .preset-btn:active {
      transform: scale(0.95);
    }
    .preset-btn.selected {
      border-color: var(--blue);
      background: rgba(29, 111, 242, 0.18);
      box-shadow: 0 4px 12px rgba(29, 111, 242, 0.2);
    }

    .btn-submit {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 13.5px;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #2575FC 0%, #1D6FF2 100%);
      box-shadow: 0 8px 24px -4px var(--blue-glow);
      cursor: pointer;
      margin-top: 16px;
      transition: all 0.24s var(--ease-spring);
    }
    .btn-submit:hover {
      transform: translateY(-1px);
    }
    .btn-submit:active {
      transform: scale(0.97);
    }
    .btn-danger {
      width: 100%;
      border: 1px solid rgba(255, 77, 106, 0.35);
      border-radius: 14px;
      padding: 12px;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--danger);
      background: var(--danger-soft);
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.22s var(--ease-spring);
    }
    .btn-danger:active {
      transform: scale(0.97);
    }

    @media (max-width: 1024px) {
      .finpro-top-grid { grid-template-columns: 1fr; }
      .two-col { grid-template-columns: 1fr; }
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        height: 66px;
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        flex-direction: row;
        padding: 6px 8px;
        border-right: none;
        border-top: 1px solid var(--glass-border);
        box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.45);
      }
      .brand { display: none; }
      .nav-list {
        flex-direction: row;
        width: 100%;
        justify-content: space-around;
        align-items: center;
        gap: 4px;
      }
      .nav-btn {
        flex: 1;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 6px 2px;
        gap: 4px;
        font-size: 10.5px;
        border-radius: 12px;
        text-align: center;
      }
      .main { margin-left: 0; }
      .topbar { padding: 0 12px; height: 60px; }
      .container { padding: 14px 12px 92px; }
      .bal-digits { font-size: 27px; }
      .bal-currency { font-size: 23px; }
      .tx-table-head { display: none; }
      .tx-grid-row {
        display: flex;
        justify-content: space-between;
      }
      .modal-backdrop { align-items: flex-end; padding: 0; }
      .modal-box {
        max-width: 100%;
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
        padding: 18px 15px 28px;
      }
    }
  </style>
</head>
<body>

        <span class="brand-pro">PRO</span>
      </div>
    </div>
    <nav class="nav-list">
      <button type="button" class="nav-btn active" data-page="dashboard" onclick="navigate('dashboard')">
        <span class="nav-ico" data-ico="dashboard"></span>

      </button>
      <button type="button" class="nav-btn" data-page="wallets" onclick="navigate('wallets')">

        <span>Bank/Akun</span>
      </button>
      <button type="button" class="nav-btn" data-page="income" onclick="navigate('income')">

        <span>Pemasukan</span>
      </button>
      <button type="button" class="nav-btn" data-page="expense" onclick="navigate('expense')">
        <span class="nav-ico" data-ico="expense"></span>
        <span>Pengeluaran</span>
      </button>
      <button type="button" class="nav-btn" data-page="savings" onclick="navigate('savings')">

        <span>Target Dana</span>
      </button>

  <!-- MAIN CONTENT -->
  <div class="main">
    <header class="topbar">
      <button type="button" class="user-chip" onclick="openProfileModal()">

          <div class="user-greeting">Halo, Selamat Datang</div>

            <span id="editUserIco" style="color:var(--blue-light);display:inline-flex;"></span>

          <span id="eyeIcon"></span>

    <main class="container" id="pageContent"></main>

    function formatNumberOnly(n, masked = false) {
      if (masked && hideBalance) return '•••••••';
      const num = Number(n) || 0;
      const formatted = Math.round(Math.abs(num)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return `${num < 0 ? '-' : ''}${formatted}`;
    }

    function formatRupiah(n, masked = false) {
      if (masked && hideBalance) return 'Rp •••••••';
      const num = Number(n) || 0;
      const formatted = Math.round(Math.abs(num)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return `${num < 0 ? '-' : ''}Rp ${formatted}`;
    }

    function formatThousands(val) {
      const digits = String(val || '').replace(/\D/g, '');
      if (!digits) return '';
      return digits.replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function computeTotals() {
      const walletBalances = {};
      const walletTxNet = {};
      state.wallets.forEach(w => {
        walletBalances[w.id] = Number(w.initialBalance) || 0;
        walletTxNet[w.id] = 0;
      });

      let totalIncome = 0;
      let totalExpense = 0;

      state.transactions.forEach(t => {
        const amt = Number(t.amount) || 0;
        if (t.type === 'income') {
          totalIncome += amt;
          if (walletBalances[t.walletId] !== undefined) {
            walletBalances[t.walletId] += amt;
            walletTxNet[t.walletId] += amt;
          }
        } else {
          totalExpense += amt;
          if (walletBalances[t.walletId] !== undefined) {
            walletBalances[t.walletId] -= amt;
            walletTxNet[t.walletId] -= amt;
          }
        }
      });

      const totalWalletBalance = Object.values(walletBalances).reduce((a, b) => a + b, 0);
      const totalSavings = (state.savings || []).reduce((s, item) => s + (Number(item.current) || 0), 0);
      const totalSavingsTarget = (state.savings || []).reduce((s, item) => s + (Number(item.target) || 0), 0);

      return {
        walletBalances,
        walletTxNet,
        totalWalletBalance,
        totalIncome,
        totalExpense,
        totalSavings,
        totalSavingsTarget,
      };
    }

    function saveBulkWallets() {
      const totals = computeTotals();
      const nameInputs = document.querySelectorAll('.bulk-w-name');
      const balInputs = document.querySelectorAll('.bulk-w-bal');
      const nameMap = {};
      const balMap = {};
      nameInputs.forEach(el => { nameMap[el.dataset.id] = (el.value || '').trim(); });
      balInputs.forEach(el => { balMap[el.dataset.id] = parseInt(String(el.value || '0').replace(/\D/g, ''), 10) || 0; });

      state.wallets = state.wallets.map(w => {
        const newName = nameMap[w.id] || w.name;
        const desiredBal = balMap[w.id] !== undefined ? balMap[w.id] : (totals.walletBalances[w.id] || 0);
        const txNet = totals.walletTxNet[w.id] || 0;
        return {
          ...w,
          name: newName,
          initialBalance: desiredBal - txNet,
        };
      });
      closeModal();
      saveState();
      showToast('Semua Nama Bank & Saldo berhasil diperbarui');
    }

    /* 1. MODAL BANK / AKUN INDIVIDUAL */
    function openWalletModal(walletId = null) {
      const totals = computeTotals();
      const w = walletId ? state.wallets.find(x => x.id === walletId) : null;
      const currentBal = w ? (totals.walletBalances[w.id] || 0) : 0;

      form = {
        id: w ? w.id : null,
        name: w ? w.name : '',
        type: w ? w.type : 'bank',
        targetBalance: w ? String(Math.max(0, currentBal)) : '',
      };
      renderWalletModal();
    }

    function pickBankPreset(name, type) {
      form.name = name;
      form.type = type;
      const nameInp = document.getElementById('walletNameInput');
      if (nameInp) nameInp.value = name;
      document.querySelectorAll('#bankPresetGrid .preset-btn').forEach(b => {
        b.classList.toggle('selected', b.dataset.name === name);
      });
      document.querySelectorAll('#walletTypeRow .chip-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.type === type);
      });
    }

    function selectWalletType(typeId) {
      form.type = typeId;
      document.querySelectorAll('#walletTypeRow .chip-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.type === typeId);
      });
    }

    function addWalletBalance(delta) {
      const balEl = document.getElementById('walletBalInput');
      const curRaw = balEl ? balEl.value.replace(/\D/g, '') : form.targetBalance;
      const cur = parseInt(curRaw, 10) || 0;
      form.targetBalance = String(Math.max(0, cur + delta));
      if (balEl) balEl.value = formatThousands(form.targetBalance);
    }

          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <label class="form-label" style="margin-top:0;">Pilih Cepat Bank / E-Wallet</label>
        <div class="preset-grid" id="bankPresetGrid">
          ${BANK_PRESETS.map(p => `
            <button type="button" class="preset-btn ${form.name === p.name ? 'selected' : ''}" data-name="${escapeHtml(p.name)}" onclick="pickBankPreset('${p.name}', '${p.type}')">
              <span style="width:22px;height:22px;border-radius:6px;background:${p.color}25;color:${p.color};display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex-shrink:0;">${p.code}</span>
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.name}</span>
            </button>
          `).join('')}
        </div>

        <label class="form-label">Nama Bank / E-Wallet / Akun (Bisa Diketik Bebas)</label>
        <input id="walletNameInput" type="text" class="form-control" style="font-weight:700;" placeholder="Ketik nama bank atau dompet..." value="${escapeHtml(form.name)}" oninput="form.name=this.value" />

        <label class="form-label">Jenis Akun</label>
        <div style="display:flex;gap:6px;" id="walletTypeRow">
          ${WALLET_TYPES.map(t => `
            <button type="button" class="chip-btn ${form.type === t.id ? 'active' : ''}" data-type="${t.id}" style="flex:1;padding:9px 6px;display:inline-flex;align-items:center;justify-content:center;gap:5px;" onclick="selectWalletType('${t.id}')">
              ${getSvg(t.icon)}
              <span>${t.name}</span>
            </button>
          `).join('')}
        </div>

        <label class="form-label">Saldo Saat Ini (Rp)</label>
        <input id="walletBalInput" type="text" inputmode="numeric" class="form-control" style="font-size:21px;font-weight:800;" placeholder="0" value="${formatThousands(form.targetBalance)}" oninput="form.targetBalance=this.value.replace(/\\D/g,'');this.value=formatThousands(form.targetBalance);" />
        <div class="chip-row">
          <button type="button" class="chip-btn" onclick="addWalletBalance(50000)">+50rb</button>
          <button type="button" class="chip-btn" onclick="addWalletBalance(100000)">+100rb</button>
          <button type="button" class="chip-btn" onclick="addWalletBalance(500000)">+500rb</button>
          <button type="button" class="chip-btn" onclick="addWalletBalance(1000000)">+1 Juta</button>
          <button type="button" class="chip-btn" style="color:var(--danger);" onclick="form.targetBalance='0';document.getElementById('walletBalInput').value='0';">Nolkan (Rp 0)</button>
        </div>

        <button type="button" class="btn-submit" onclick="saveWallet()">Simpan Akun & Saldo</button>
        ${isEdit && state.wallets.length > 1 ? `
          <button type="button" class="btn-danger" onclick="deleteWallet('${form.id}')">Hapus Akun Ini</button>
        ` : ''}
      `);
    }

    function saveWallet() {
      const nameEl = document.getElementById('walletNameInput');
      const balEl = document.getElementById('walletBalInput');
      const cleanName = ((nameEl ? nameEl.value : form.name) || '').trim() || 'Akun Baru';
      const rawBal = (balEl ? balEl.value : form.targetBalance) || '0';
      const desiredBalance = parseInt(String(rawBal).replace(/\D/g, ''), 10) || 0;
      const totals = computeTotals();

      if (form.id) {
        const txNet = totals.walletTxNet[form.id] || 0;
        const newInitial = desiredBalance - txNet;
        state.wallets = state.wallets.map(w =>
          w.id === form.id ? { ...w, name: cleanName, type: form.type, initialBalance: newInitial } : w
        );
      } else {
        state.wallets.push({
          id: uid(),
          name: cleanName,
          type: form.type,
          initialBalance: desiredBalance,
        });
      }
      closeModal();
      saveState();
      showToast(`${cleanName} disimpan (${formatRupiah(desiredBalance)})`);
    }

    function deleteWallet(id) {
      state.wallets = state.wallets.filter(w => w.id !== id);
      if (selectedBankFilter === id) selectedBankFilter = 'all';
      closeModal();
      saveState();
      showToast('Akun dihapus');
    }

    /* 2. MODAL TRANSAKSI */
    function openTxModal(type = 'expense', txId = null) {
      const existing = txId ? state.transactions.find(t => t.id === txId) : null;
      const actualType = existing ? existing.type : type;
      const cats = actualType === 'income' ? getIncomeCategories() : getExpenseCategories();
      form = {
        id: existing ? existing.id : null,
        type: actualType,
        note: existing ? existing.note : '',
        amount: existing ? String(existing.amount) : '',
        categoryId: existing ? existing.categoryId : cats[0].id,
        walletId: existing ? existing.walletId : (state.wallets[0] ? state.wallets[0].id : ''),
        date: existing ? existing.date : new Date().toISOString().slice(0, 10),
        addingCustomCat: false,
        customCatName: '',
      };
      renderTxModal();
    }

    function addTxAmount(delta) {
      const inp = document.getElementById('txAmountInput');
      const curRaw = inp ? inp.value.replace(/\D/g, '') : form.amount;
      const cur = parseInt(curRaw, 10) || 0;
      form.amount = String(Math.max(0, cur + delta));
      if (inp) inp.value = formatThousands(form.amount);
    }

    function selectTxCategory(catId) {
      form.categoryId = catId;
      document.querySelectorAll('#txCatGrid .cat-btn').forEach(b => {
        b.classList.toggle('selected', b.dataset.id === catId);
      });
    }

    function renderTxModal() {
      const cats = form.type === 'income' ? getIncomeCategories() : getExpenseCategories();
      if (!cats.some(c => c.id === form.categoryId)) form.categoryId = cats[0].id;

      openModal(`
        <div class="modal-header">
          <span class="modal-title">${form.type === 'income' ? SVG_PATHS.income : SVG_PATHS.expense} <span>${form.id ? 'Edit Transaksi' : (form.type === 'income' ? 'Catat Pemasukan' : 'Catat Pengeluaran')}</span></span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
          <button type="button" class="${form.type==='income'?'btn-finpro-primary':'btn-finpro-secondary'}" onclick="form.type='income';renderTxModal();">Pemasukan</button>
          <button type="button" class="${form.type==='expense'?'btn-finpro-primary':'btn-finpro-secondary'}" onclick="form.type='expense';renderTxModal();">Pengeluaran</button>
        </div>

        <label class="form-label">Nominal (Rp)</label>
        <input id="txAmountInput" type="text" inputmode="numeric" class="form-control" style="font-size:21px;font-weight:800;" placeholder="0" value="${formatThousands(form.amount)}" oninput="form.amount=this.value.replace(/\\D/g,'');this.value=formatThousands(form.amount);" />
        <div class="chip-row">
          <button type="button" class="chip-btn" onclick="addTxAmount(10000)">+10rb</button>
          <button type="button" class="chip-btn" onclick="addTxAmount(20000)">+20rb</button>
          <button type="button" class="chip-btn" onclick="addTxAmount(50000)">+50rb</button>
          <button type="button" class="chip-btn" onclick="addTxAmount(100000)">+100rb</button>
          <button type="button" class="chip-btn" onclick="addTxAmount(500000)">+500rb</button>
          <button type="button" class="chip-btn" style="color:var(--danger);" onclick="form.amount='0';document.getElementById('txAmountInput').value='';">Nolkan</button>
        </div>

        <label class="form-label">Keterangan Transaksi</label>
        <input id="txNoteInput" type="text" class="form-control" placeholder="Cth: Makan Siang, Kopi, Bensin, Gaji..." value="${escapeHtml(form.note)}" oninput="form.note=this.value" />

        <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px;">
          <label class="form-label" style="margin:0;">Kategori (${cats.length} Pilihan)</label>
          <button type="button" style="background:none;border:none;color:#60A5FA;font-size:12px;font-weight:700;cursor:pointer;" onclick="form.addingCustomCat=!form.addingCustomCat;renderTxModal();">
            ${form.addingCustomCat ? 'Tutup' : '+ Buat Kategori Sendiri'}
          </button>
        </div>

        ${form.addingCustomCat ? `
          <div style="background:rgba(29,111,242,0.1);border:1px solid var(--blue);border-radius:12px;padding:10px;margin-bottom:8px;display:flex;gap:6px;">
            <input id="customCatInput" class="form-control" style="flex:1;" placeholder="Ketik nama kategori baru..." value="${escapeHtml(form.customCatName)}" oninput="form.customCatName=this.value" />
            <button type="button" class="btn-finpro-primary" style="padding:0 14px;" onclick="saveCustomCategory()">Tambah</button>
          </div>
        ` : ''}

        <div class="cat-grid" id="txCatGrid">
          ${cats.map(c => `
            <button type="button" class="cat-btn ${form.categoryId === c.id ? 'selected' : ''}" data-id="${c.id}" onclick="selectTxCategory('${c.id}')">
              <span style="color:${c.color};">${getSvg(c.icon)}</span>
              <span>${escapeHtml(c.name)}</span>
            </button>
          `).join('')}
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div>
            <label class="form-label">Akun Bank / Dompet</label>
            <select class="form-control" onchange="form.walletId=this.value">
              ${state.wallets.map(w => `<option value="${w.id}" ${form.walletId===w.id?'selected':''}>${escapeHtml(w.name)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="form-label">Tanggal</label>
            <input type="date" class="form-control" value="${form.date}" onchange="form.date=this.value" />
          </div>
        </div>

        <button type="button" class="btn-submit" onclick="saveTx()">Simpan Transaksi</button>
        ${form.id ? `
          <button type="button" class="btn-danger" onclick="deleteTx('${form.id}')">Hapus Transaksi Ini</button>
        ` : ''}
      `);
    }

    function saveCustomCategory() {
      const inp = document.getElementById('customCatInput');
      const name = ((inp ? inp.value : form.customCatName) || '').trim();
      if (!name) return;
      const newCat = {
        id: 'cust_' + uid(),
        type: form.type,
        name,
        icon: form.type === 'income' ? 'trending' : 'layers',
        color: '#3B82F6',
      };
      state.customCategories.push(newCat);
      form.categoryId = newCat.id;
      form.addingCustomCat = false;
      form.customCatName = '';
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderTxModal();
    }

    function saveTx() {
      const amtEl = document.getElementById('txAmountInput');
      const noteEl = document.getElementById('txNoteInput');
      const rawAmt = (amtEl ? amtEl.value : form.amount) || '0';
      const amt = parseInt(String(rawAmt).replace(/\D/g, ''), 10) || 0;
      if (amt <= 0) {
        if (amtEl) amtEl.focus();
        showToast('Masukkan nominal lebih dari Rp 0');
        return;
      }
      const cat = getCategory(form.categoryId);
      const noteVal = ((noteEl ? noteEl.value : form.note) || '').trim() || cat.name;
      const payload = {
        id: form.id || uid(),
        type: form.type,
        amount: amt,
        note: noteVal,
        categoryId: form.categoryId,
        walletId: form.walletId,
        date: form.date,
      };
      if (form.id) state.transactions = state.transactions.map(t => t.id === form.id ? payload : t);
      else state.transactions.unshift(payload);
      closeModal();
      saveState();
      showToast('Transaksi berhasil disimpan');
    }

    function deleteTx(id) {
      state.transactions = state.transactions.filter(t => t.id !== id);
      closeModal();
      saveState();
      showToast('Transaksi dihapus');
    }

    /* 3. MODAL SETOR / TARIK TARGET DANA */
    function openSavingDepositModal() {
      if (!state.savings.length) return openSavingModal();
      form = {
        savingId: state.savings[0].id,
        walletId: state.wallets[0] ? state.wallets[0].id : '',
        mode: 'deposit',
        amount: '',
      };
      renderSavingDepositModal();
    }

    function renderSavingDepositModal() {
      openModal(`
        <div class="modal-header">
          <span class="modal-title">${SVG_PATHS.vault} <span>Setor / Tarik Dana Simpanan</span></span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
          <button type="button" class="${form.mode==='deposit'?'btn-finpro-primary':'btn-finpro-secondary'}" onclick="form.mode='deposit';renderSavingDepositModal();">Setor Dana</button>
          <button type="button" class="${form.mode==='withdraw'?'btn-finpro-primary':'btn-finpro-secondary'}" onclick="form.mode='withdraw';renderSavingDepositModal();">Tarik Dana</button>
        </div>
        <label class="form-label">Pilih Target Dana</label>
        <select class="form-control" onchange="form.savingId=this.value">
          ${state.savings.map(s => `<option value="${s.id}" ${form.savingId===s.id?'selected':''}>${escapeHtml(s.name)} (${formatRupiah(s.current)})</option>`).join('')}
        </select>
        <label class="form-label">${form.mode === 'deposit' ? 'Sumber Akun Bank/Dompet' : 'Tujuan Akun Bank/Dompet'}</label>
        <select class="form-control" onchange="form.walletId=this.value">
          ${state.wallets.map(w => `<option value="${w.id}" ${form.walletId===w.id?'selected':''}>${escapeHtml(w.name)}</option>`).join('')}
        </select>
        <label class="form-label">Nominal (Rp)</label>
        <input id="savDepInput" type="text" inputmode="numeric" class="form-control" style="font-size:20px;font-weight:800;" placeholder="0" value="${formatThousands(form.amount)}" oninput="form.amount=this.value.replace(/\\D/g,'');this.value=formatThousands(form.amount);" />
        <button type="button" class="btn-submit" onclick="saveSavingDeposit()">Simpan Perubahan</button>
      `);
    }

    function saveSavingDeposit() {
      const inp = document.getElementById('savDepInput');
      const raw = (inp ? inp.value : form.amount) || '0';
      const amt = parseInt(String(raw).replace(/\D/g, ''), 10) || 0;
      if (amt <= 0) return;
      const target = state.savings.find(s => s.id === form.savingId);
      if (!target) return;
      if (form.mode === 'deposit') {
        target.current = (Number(target.current) || 0) + amt;
        state.transactions.unshift({
          id: uid(), type: 'expense', amount: amt, categoryId: 'other_exp',
          walletId: form.walletId, note: `Alokasi ke ${target.name}`, date: new Date().toISOString().slice(0, 10)
        });
      } else {
        target.current = Math.max(0, (Number(target.current) || 0) - amt);
        state.transactions.unshift({
          id: uid(), type: 'income', amount: amt, categoryId: 'cashback',
          walletId: form.walletId, note: `Pencairan ${target.name}`, date: new Date().toISOString().slice(0, 10)
        });
      }
      closeModal();
      saveState();
      showToast('Alokasi dana simpanan diperbarui');
    }

    /* 4. MODAL TARGET DANA */
    function openSavingModal(savingId = null) {
      const s = savingId ? state.savings.find(x => x.id === savingId) : null;
      form = {
        id: s ? s.id : null,
        name: s ? s.name : '',
        icon: s && SVG_PATHS[s.icon] ? s.icon : 'vault',
        current: s ? String(s.current || '') : '',
        target: s ? String(s.target || '') : '',
      };
      renderSavingModal();
    }

    function pickSavingPreset(name, icon) {
      form.name = name;
      form.icon = icon;
      const nameEl = document.getElementById('savNameInput');
      if (nameEl) nameEl.value = name;
      document.querySelectorAll('#savingPresetGrid .preset-btn').forEach(b => {
        b.classList.toggle('selected', b.dataset.name === name);
      });
    }

    function renderSavingModal() {
      const isEdit = !!form.id;
      openModal(`
        <div class="modal-header">
          <span class="modal-title">${SVG_PATHS.vault} <span>${isEdit ? 'Edit Target Dana' : 'Buat Target Dana Baru'}</span></span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <label class="form-label" style="margin-top:0;">Pilih Cepat Tujuan Dana (Atau ketik bebas)</label>
        <div class="preset-grid" id="savingPresetGrid">
          ${SAVING_PRESETS.map(p => `
            <button type="button" class="preset-btn ${form.name === p.name ? 'selected' : ''}" data-name="${escapeHtml(p.name)}" onclick="pickSavingPreset('${p.name}', '${p.icon}')">
              <span style="color:var(--blue-light);">${getSvg(p.icon)}</span>
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.name}</span>
            </button>
          `).join('')}
        </div>

        <label class="form-label">Nama Target Dana</label>
        <input id="savNameInput" type="text" class="form-control" style="font-weight:700;" placeholder="Ketik nama target dana..." value="${escapeHtml(form.name)}" oninput="form.name=this.value" />

        <label class="form-label">Dana Terkumpul Saat Ini (Rp)</label>
        <input id="savCurInput" type="text" inputmode="numeric" class="form-control" style="font-size:18px;font-weight:800;" placeholder="0" value="${formatThousands(form.current)}" oninput="form.current=this.value.replace(/\\D/g,'');this.value=formatThousands(form.current);" />

        <label class="form-label">Target Nominal (Rp)</label>
        <input id="savTarInput" type="text" inputmode="numeric" class="form-control" style="font-size:18px;font-weight:800;" placeholder="0" value="${formatThousands(form.target)}" oninput="form.target=this.value.replace(/\\D/g,'');this.value=formatThousands(form.target);" />

        <button type="button" class="btn-submit" onclick="saveSavingGoal()">Simpan Target Dana</button>
        ${isEdit ? `
          <button type="button" class="btn-danger" onclick="deleteSavingGoal('${form.id}')">Hapus Target Ini</button>
        ` : ''}
      `);
    }

    function saveSavingGoal() {
      const nameEl = document.getElementById('savNameInput');
      const curEl = document.getElementById('savCurInput');
      const tarEl = document.getElementById('savTarInput');
      const cleanName = ((nameEl ? nameEl.value : form.name) || '').trim() || 'Target Baru';
      const curVal = parseInt(String((curEl ? curEl.value : form.current) || '0').replace(/\D/g, ''), 10) || 0;
      const tarVal = parseInt(String((tarEl ? tarEl.value : form.target) || '0').replace(/\D/g, ''), 10) || 1000000;

      const payload = {
        id: form.id || uid(),
        name: cleanName,
        icon: SVG_PATHS[form.icon] ? form.icon : 'vault',
        current: curVal,
        target: tarVal,
      };
      if (form.id) state.savings = state.savings.map(s => s.id === form.id ? payload : s);
      else state.savings.push(payload);
      closeModal();
      saveState();
      showToast('Target dana berhasil disimpan');
    }

    function deleteSavingGoal(id) {
      state.savings = state.savings.filter(s => s.id !== id);
      closeModal();
      saveState();
      showToast('Target dana dihapus');
    }

    /* 5. MODAL PROFIL */
    function openProfileModal() {
      form = { userName: state.userName || 'Alfian Dimas' };
      openModal(`
        <div class="modal-header">
          <span class="modal-title">Ubah Nama Profil</span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <label class="form-label" style="margin-top:0;">Nama Lengkap / Panggilan</label>
        <input id="profNameInput" type="text" class="form-control" style="font-size:16px;font-weight:700;" value="${escapeHtml(form.userName)}" oninput="form.userName=this.value" />
        <button type="button" class="btn-submit" onclick="saveProfileName()">Simpan Nama</button>
      `);
    }

    function saveProfileName() {
      const el = document.getElementById('profNameInput');
      const val = ((el ? el.value : form.userName) || '').trim();
      if (val) {
        state.userName = val;
        closeModal();
        saveState();
        showToast('Nama profil berhasil diperbarui');
      }
    }

    /* 6. MODAL PENGATURAN DATA */
    function openDataModal() {
      openModal(`
        <div class="modal-header">
          <span class="modal-title">${SVG_PATHS.settings} <span>Kelola Data Keuangan</span></span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <p style="font-size:13px;color:var(--text-sub);margin-bottom:12px;line-height:1.5;">
          Pilih aksi di bawah untuk mengosongkan seluruh saldo ke Rp 0, mengembalikan setelan awal, atau memuat contoh data:
        </p>
        <button type="button" class="btn-danger" onclick="resetAllToZero()">
          Nolkan Semua Saldo & Transaksi (Rp 0)
        </button>
        <button type="button" class="btn-danger" style="color:var(--text-main);border-color:var(--glass-border);background:rgba(255,255,255,0.05);" onclick="state=getCleanZeroData();closeModal();saveState();showToast('Direset penuh ke setelan awal Rp 0');">
          Reset Penuh ke Setelan Awal (Rp 0)
        </button>
        <button type="button" class="btn-submit" onclick="state=getSampleData();closeModal();saveState();showToast('Contoh data FinPro dimuat');">
          Muat Contoh Data Dashboard
        </button>
      `);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    saveState();
  </script>
</body>
</html>
