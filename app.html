<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0E314A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DompetKu" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>DompetKu — Pengatur Keuangan Pribadi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-top: #133955;
      --navy-bottom: #0B253A;
      --green: #8CC63F;
      --green-dark: #5C9E23;
      --blue: #2563EB;
      --bg: #F1F5F9;
      --card: #FFFFFF;
      --text: #0F2942;
      --muted: #64748B;
      --border: #E2E8F0;
      --danger: #E11D48;
      --warning: #F59E0B;
      --shadow: 0 4px 14px rgba(15, 41, 66, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #0F2942;
      color: #fff;
      padding: 11px 20px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 700;
      z-index: 999;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      transition: transform 0.25s ease;
      white-space: nowrap;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* ==================== SIDEBAR (DESKTOP) & BOTTOM NAV (MOBILE) ==================== */
    .sidebar {
      width: 230px;
      background: linear-gradient(180deg, var(--navy-top) 0%, var(--navy-bottom) 100%);
      color: #fff;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      padding: 20px 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 10px 24px;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .brand-text {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nav-btn {
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.72);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }
    .nav-btn.active {
      background: rgba(140, 198, 63, 0.2);
      color: var(--green);
      font-weight: 800;
    }
    .nav-icon {
      font-size: 18px;
      line-height: 1;
    }

    /* ==================== MAIN CONTENT ==================== */
    .main {
      margin-left: 230px;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 60px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 4px 8px 4px 4px;
      border-radius: 12px;
      border: none;
      background: transparent;
      text-align: left;
    }
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #ECF6DF;
      border: 1.5px solid #B7DC82;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .user-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
    }
    .user-sub {
      font-size: 11px;
      color: var(--blue);
      font-weight: 700;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .top-btn {
      border: 1px solid var(--border);
      background: #F8FAFC;
      color: var(--text);
      height: 36px;
      padding: 0 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .top-btn.danger {
      border-color: #FECDD3;
      background: #FFF1F2;
      color: var(--danger);
    }

    .container {
      padding: 18px 20px 96px;
      max-width: 1220px;
      width: 100%;
      margin: 0 auto;
    }

    /* ==================== TOP SUMMARY CARDS ==================== */
    .summary-grid {
      display: grid;
      grid-template-columns: 1.35fr 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    .hero-card {
      background: linear-gradient(125deg, #7BB642 0%, #3E885B 40%, #164B68 80%, #0E314A 100%);
      border-radius: 16px;
      padding: 18px;
      color: #fff;
      box-shadow: 0 8px 20px rgba(14, 49, 74, 0.16);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      font-weight: 700;
    }
    .pill-btn {
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 5px 11px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
    }
    .hero-balance {
      font-size: 28px;
      font-weight: 800;
      margin: 10px 0 14px;
      letter-spacing: -0.5px;
    }
    .hero-btn-row {
      display: flex;
      gap: 8px;
    }
    .hero-btn {
      flex: 1;
      border: none;
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .hero-btn.in {
      background: var(--green);
      color: #fff;
    }
    .hero-btn.out {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .hero-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      margin-top: 14px;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
    }

    .stat-card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .stat-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--muted);
    }
    .stat-val {
      font-size: 21px;
      font-weight: 800;
      color: var(--text);
      margin: 8px 0 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .stat-sub {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      gap: 8px;
      flex-wrap: wrap;
    }
    .stat-link {
      background: none;
      border: none;
      color: var(--blue);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      text-align: right;
      margin-top: 10px;
    }

    /* ==================== CONTENT LAYOUT ==================== */
    .section-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .two-col {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 16px;
      align-items: start;
    }
    .card-box {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    /* Item Row */
    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 6px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
      cursor: pointer;
      border-radius: 10px;
    }
    .item-row:hover, .item-row:active {
      background: #F8FAFC;
    }
    .item-row:last-child {
      border-bottom: none;
    }
    .item-left {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      flex: 1;
    }
    .item-badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
    }
    .item-info {
      min-width: 0;
      flex: 1;
    }
    .item-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-meta {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-right {
      text-align: right;
      flex-shrink: 0;
    }
    .item-amt {
      font-size: 13.5px;
      font-weight: 800;
    }
    .edit-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      color: var(--blue);
      background: #EFF6FF;
      padding: 2px 8px;
      border-radius: 6px;
      margin-top: 3px;
    }

    .progress-track {
      height: 8px;
      background: #E2E8F0;
      border-radius: 99px;
      overflow: hidden;
      margin: 6px 0;
    }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
    }

    /* ==================== MODAL ==================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(11, 37, 58, 0.6);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 460px;
      border-radius: 20px;
      padding: 18px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .modal-title {
      font-size: 15.5px;
      font-weight: 800;
    }
    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #F1F5F9;
      font-weight: 800;
      cursor: pointer;
      font-size: 15px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      margin: 12px 0 6px;
    }
    .form-control {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      background: #fff;
    }
    .form-control:focus {
      border-color: var(--blue);
    }

    .chip-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .chip-btn {
      border: 1px solid var(--border);
      background: #F8FAFC;
      color: var(--text);
      padding: 6px 10px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .chip-btn.active {
      background: #EFF6FF;
      border-color: var(--blue);
      color: var(--blue);
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      max-height: 220px;
      overflow-y: auto;
      padding: 2px;
    }
    .cat-btn {
      border: 1.5px solid var(--border);
      background: #F8FAFC;
      border-radius: 10px;
      padding: 8px 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      min-height: 60px;
    }
    .cat-btn.selected {
      border-color: var(--blue);
      background: #EFF6FF;
      color: var(--blue);
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      max-height: 165px;
      overflow-y: auto;
      padding: 2px;
    }
    .preset-btn {
      border: 1.5px solid var(--border);
      background: #F8FAFC;
      border-radius: 9px;
      padding: 8px 6px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      text-align: left;
    }
    .preset-btn.selected {
      border-color: var(--blue);
      background: #EFF6FF;
      color: var(--blue);
    }

    .btn-submit {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      background: var(--green);
      cursor: pointer;
      margin-top: 14px;
    }
    .btn-danger {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 13.5px;
      font-weight: 800;
      color: #fff;
      background: var(--danger);
      cursor: pointer;
      margin-top: 8px;
    }

    @media (max-width: 960px) {
      .summary-grid { grid-template-columns: 1fr; }
      .two-col { grid-template-columns: 1fr; }
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        height: 62px;
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        flex-direction: row;
        padding: 4px 6px;
        box-shadow: 0 -4px 14px rgba(0, 0, 0, 0.12);
      }
      .brand { display: none; }
      .nav-list {
        flex-direction: row;
        width: 100%;
        justify-content: space-around;
        align-items: center;
        gap: 2px;
      }
      .nav-btn {
        flex: 1;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 5px 2px;
        gap: 2px;
        font-size: 10.5px;
        border-radius: 8px;
        text-align: center;
      }
      .nav-icon { font-size: 18px; }
      .main { margin-left: 0; }
      .topbar { padding: 0 12px; height: 56px; }
      .container { padding: 12px 12px 84px; }
      .hero-balance { font-size: 25px; }
      .modal-backdrop { align-items: flex-end; padding: 0; }
      .modal-box {
        max-width: 100%;
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
        padding: 16px 14px 26px;
      }
    }
  </style>
</head>
<body>

  <div class="toast" id="toastMsg">✅ Tersimpan!</div>

  <!-- SIDEBAR / BOTTOM BAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">💰</div>
      <span class="brand-text">DOMPETKU</span>
    </div>
    <nav class="nav-list">
      <button type="button" class="nav-btn active" data-page="dashboard" onclick="navigate('dashboard')">
        <span class="nav-icon">🏠</span>
        <span>Beranda</span>
      </button>
      <button type="button" class="nav-btn" data-page="wallets" onclick="navigate('wallets')">
        <span class="nav-icon">🏦</span>
        <span>Bank/Dompet</span>
      </button>
      <button type="button" class="nav-btn" data-page="income" onclick="navigate('income')">
        <span class="nav-icon">📥</span>
        <span>Masuk</span>
      </button>
      <button type="button" class="nav-btn" data-page="expense" onclick="navigate('expense')">
        <span class="nav-icon">📤</span>
        <span>Keluar</span>
      </button>
      <button type="button" class="nav-btn" data-page="savings" onclick="navigate('savings')">
        <span class="nav-icon">🐷</span>
        <span>Tabungan</span>
      </button>
    </nav>
  </aside>

  <!-- MAIN AREA -->
  <div class="main">
    <header class="topbar">
      <button type="button" class="user-chip" onclick="openProfileModal()">
        <div class="user-avatar">👤</div>
        <div>
          <div class="user-name"><span id="userNameText">Alfian Dimas</span> ✏️</div>
          <div class="user-sub">Ganti Nama</div>
        </div>
      </button>

      <div class="topbar-actions">
        <button type="button" class="top-btn" onclick="hideBalance=!hideBalance;saveState();">
          <span id="eyeIcon">👁️</span>
        </button>
        <button type="button" class="top-btn danger" onclick="resetAllToZero()">
          🗑️ Nolkan Rp 0
        </button>
        <button type="button" class="top-btn" onclick="openDataModal()">
          ⚙️
        </button>
      </div>
    </header>

    <main class="container" id="pageContent"></main>
  </div>

  <!-- MODAL -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target.id==='modalBackdrop') closeModal()">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <script>
    // 1. Force unregister any old Service Worker & clear stale caches immediately
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister())).catch(() => {});
    }
    if ('caches' in window) {
      caches.keys().then(keys => keys.forEach(k => caches.delete(k))).catch(() => {});
    }

    function showToast(msg) {
      const t = document.getElementById('toastMsg');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    /* ==================== DETAILED INDONESIAN CATEGORIES ==================== */
    const DEFAULT_EXPENSE_CATEGORIES = [
      { id: 'makan', name: 'Makan (Warteg/RM)', icon: '🍛', color: '#F97316' },
      { id: 'ngopi', name: 'Ngopi & Minuman', icon: '☕', color: '#D97706' },
      { id: 'jajan', name: 'Jajan & Camilan', icon: '🍢', color: '#EAB308' },
      { id: 'gofood', name: 'GoFood / GrabFood', icon: '🛵', color: '#10B981' },
      { id: 'bensin', name: 'Bensin Motor/Mobil', icon: '⛽', color: '#3B82F6' },
      { id: 'parkir', name: 'Parkir & Tol', icon: '🅿️', color: '#6366F1' },
      { id: 'ojol', name: 'Ojol / Kereta / Bus', icon: '🚆', color: '#0EA5E9' },
      { id: 'minimarket', name: 'Indomaret / Alfamart', icon: '🏪', color: '#EC4899' },
      { id: 'dapur', name: 'Belanja Dapur/Pasar', icon: '🛒', color: '#14B8A6' },
      { id: 'olshop', name: 'Shopee / Tokped / TikTok', icon: '📦', color: '#F43F5E' },
      { id: 'kuota', name: 'Pulsa & Paket Kuota', icon: '📱', color: '#8B5CF6' },
      { id: 'listrik', name: 'Token Listrik PLN', icon: '⚡', color: '#F59E0B' },
      { id: 'wifi', name: 'WiFi & Internet', icon: '🛜', color: '#0284C7' },
      { id: 'kost', name: 'Kost / Kontrakan / KPR', icon: '🏠', color: '#4F46E5' },
      { id: 'cicilan', name: 'Cicilan / Paylater', icon: '💳', color: '#E11D48' },
      { id: 'skincare', name: 'Skincare / Cukur / Laundry', icon: '🧴', color: '#0D9488' },
      { id: 'hiburan', name: 'Top Up Game / Netflix', icon: '🎮', color: '#9333EA' },
      { id: 'nongkrong', name: 'Nongkrong & Bioskop', icon: '🍻', color: '#EA580C' },
      { id: 'ortu', name: 'Kasih Ortu / Keluarga', icon: '🤲', color: '#059669' },
      { id: 'sedekah', name: 'Sedekah / Kondangan', icon: '🕌', color: '#16A34A' },
      { id: 'kesehatan', name: 'Obat & Kesehatan', icon: '💊', color: '#DC2626' },
      { id: 'servis', name: 'Servis Kendaraan', icon: '🔧', color: '#475569' },
      { id: 'hewan', name: 'Peliharaan / Kucing', icon: '🐱', color: '#D97706' },

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    function formatRupiah(n, masked = false) {
      if (masked && hideBalance) return 'Rp •••••••';
      const num = Number(n) || 0;
      const formatted = Math.round(Math.abs(num)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return `${num < 0 ? '-' : ''}Rp ${formatted}`;
    }

    function formatThousands(val) {
      const digits = String(val || '').replace(/\D/g, '');
      if (!digits) return '';
      return digits.replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function formatDateIndo(dateStr) {
      const d = new Date(dateStr);
      if (isNaN(d)) return dateStr;
      return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]} ${d.getFullYear()}`;
    }

    function getExpenseCategories() {
      const custom = (state.customCategories || []).filter(c => c.type === 'expense');
      return [...DEFAULT_EXPENSE_CATEGORIES, ...custom];
    }

    function getIncomeCategories() {
      const custom = (state.customCategories || []).filter(c => c.type === 'income');
      return [...DEFAULT_INCOME_CATEGORIES, ...custom];
    }

    function getCategory(id) {
      return [...getExpenseCategories(), ...getIncomeCategories()].find(c => c.id === id) ||
        { id, name: 'Lainnya', icon: '📋', color: '#64748B' };
    }

    function getWallet(id) {
      return state.wallets.find(w => w.id === id) || state.wallets[0] || { id: '', name: 'Utama', type: 'bank' };
    }

    function getWalletType(typeId) {
      return WALLET_TYPES.find(t => t.id === typeId) || WALLET_TYPES[0];
    }

    function computeTotals() {
      const walletBalances = {};
      const walletTxNet = {};
      state.wallets.forEach(w => {
        walletBalances[w.id] = Number(w.initialBalance) || 0;
        walletTxNet[w.id] = 0;
      });

      let totalIncome = 0;
      let totalExpense = 0;

      state.transactions.forEach(t => {
        const amt = Number(t.amount) || 0;
        if (t.type === 'income') {
          totalIncome += amt;
          if (walletBalances[t.walletId] !== undefined) {
            walletBalances[t.walletId] += amt;
            walletTxNet[t.walletId] += amt;
          }
        } else {
          totalExpense += amt;
          if (walletBalances[t.walletId] !== undefined) {
            walletBalances[t.walletId] -= amt;
            walletTxNet[t.walletId] -= amt;
          }
        }
      });

      const totalWalletBalance = Object.values(walletBalances).reduce((a, b) => a + b, 0);
      const totalSavings = (state.savings || []).reduce((s, item) => s + (Number(item.current) || 0), 0);
      const totalSavingsTarget = (state.savings || []).reduce((s, item) => s + (Number(item.target) || 0), 0);

      return {
        walletBalances,
        walletTxNet,
        totalWalletBalance,
        totalIncome,
        totalExpense,
        totalSavings,
        totalSavingsTarget,
      };
    }

      openModal(`

          <button type="button" class="chip-btn" style="flex:1;padding:10px;color:var(--danger);border-color:#FECDD3;background:#FFF1F2;" onclick="resetAllToZero()">🗑️ Nolkan Semua Rp 0</button>
        </div>
        <button type="button" class="btn-submit" onclick="saveBulkWallets()">💾 Simpan Semua Saldo & Nama Bank</button>
      `);

    function saveBulkWallets() {
      const totals = computeTotals();
      const nameInputs = document.querySelectorAll('.bulk-w-name');
      const balInputs = document.querySelectorAll('.bulk-w-bal');
      const nameMap = {};
      const balMap = {};
      nameInputs.forEach(el => { nameMap[el.dataset.id] = (el.value || '').trim(); });
      balInputs.forEach(el => { balMap[el.dataset.id] = parseInt(String(el.value || '0').replace(/\D/g, ''), 10) || 0; });

      state.wallets = state.wallets.map(w => {
        const newName = nameMap[w.id] || w.name;
        const desiredBal = balMap[w.id] !== undefined ? balMap[w.id] : (totals.walletBalances[w.id] || 0);
        const txNet = totals.walletTxNet[w.id] || 0;
        return {
          ...w,
          name: newName,
          initialBalance: desiredBal - txNet,
        };
      });
      closeModal();
      saveState();
      showToast('✅ Semua Nama Bank & Saldo berhasil disimpan!');
    }

    /* 1. MODAL BANK / DOMPET INDIVIDUAL */
    function openWalletModal(walletId = null) {
      const totals = computeTotals();
      const w = walletId ? state.wallets.find(x => x.id === walletId) : null;
      const currentBal = w ? (totals.walletBalances[w.id] || 0) : 0;

      form = {
        id: w ? w.id : null,
        name: w ? w.name : '',
        type: w ? w.type : 'bank',
        targetBalance: w ? String(Math.max(0, currentBal)) : '',
      };
      renderWalletModal();
    }

    function pickBankPreset(name, type, btnEl) {
      form.name = name;
      form.type = type;
      const nameInp = document.getElementById('walletNameInput');
      if (nameInp) nameInp.value = name;
      document.querySelectorAll('#bankPresetGrid .preset-btn').forEach(b => {
        b.classList.toggle('selected', b.dataset.name === name);
      });
      document.querySelectorAll('#walletTypeRow .chip-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.type === type);
      });
    }

    function selectWalletType(typeId) {
      form.type = typeId;
      document.querySelectorAll('#walletTypeRow .chip-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.type === typeId);
      });
    }

    function addWalletBalance(delta) {
      const balEl = document.getElementById('walletBalInput');
      const curRaw = balEl ? balEl.value.replace(/\D/g, '') : form.targetBalance;
      const cur = parseInt(curRaw, 10) || 0;
      form.targetBalance = String(Math.max(0, cur + delta));
      if (balEl) balEl.value = formatThousands(form.targetBalance);
    }

    function renderWalletModal() {
      const isEdit = !!form.id;
      openModal(`
        <div class="modal-header">
          <span class="modal-title">${isEdit ? '✏️ Edit Bank / Dompet & Saldo' : '🏦 Tambah Bank / Dompet Baru'}</span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <label class="form-label" style="margin-top:0;">Pilih Cepat Bank / E-Wallet (Atau ketik bebas di bawah)</label>
        <div class="preset-grid" id="bankPresetGrid">
          ${BANK_PRESETS.map(p => `
            <button type="button" class="preset-btn ${form.name === p.name ? 'selected' : ''}" data-name="${escapeHtml(p.name)}" onclick="pickBankPreset('${p.name}', '${p.type}', this)">
              <span>${p.icon}</span>
              <span>${p.name}</span>
            </button>
          `).join('')}

        <label class="form-label">Jenis Akun</label>
        <div style="display:flex;gap:6px;" id="walletTypeRow">
          ${WALLET_TYPES.map(t => `

              ${t.icon} ${t.name}
            </button>
          `).join('')}
        </div>

        <label class="form-label">Saldo Saat Ini (Rp)</label>
        <input id="walletBalInput" type="text" inputmode="numeric" class="form-control" style="font-size:21px;font-weight:800;" placeholder="0" value="${formatThousands(form.targetBalance)}" oninput="form.targetBalance=this.value.replace(/\\D/g,'');this.value=formatThousands(form.targetBalance);" />
        <div class="chip-row">
          <button type="button" class="chip-btn" onclick="addWalletBalance(50000)">+50rb</button>
          <button type="button" class="chip-btn" onclick="addWalletBalance(100000)">+100rb</button>
          <button type="button" class="chip-btn" onclick="addWalletBalance(500000)">+500rb</button>
          <button type="button" class="chip-btn" onclick="addWalletBalance(1000000)">+1 Juta</button>
          <button type="button" class="chip-btn" style="color:var(--danger);" onclick="form.targetBalance='0';document.getElementById('walletBalInput').value='0';">Nolkan (Rp 0)</button>
        </div>

        <button type="button" class="btn-submit" onclick="saveWallet()">💾 Simpan Perubahan</button>
        ${isEdit && state.wallets.length > 1 ? `
          <button type="button" class="btn-danger" onclick="deleteWallet('${form.id}')">🗑️ Hapus Dompet Ini</button>
        ` : ''}
      `);
    }

    function saveWallet() {
      const nameEl = document.getElementById('walletNameInput');
      const balEl = document.getElementById('walletBalInput');
      const cleanName = ((nameEl ? nameEl.value : form.name) || '').trim() || 'Dompet Baru';
      const rawBal = (balEl ? balEl.value : form.targetBalance) || '0';
      const desiredBalance = parseInt(String(rawBal).replace(/\D/g, ''), 10) || 0;
      const totals = computeTotals();

      if (form.id) {
        const txNet = totals.walletTxNet[form.id] || 0;
        const newInitial = desiredBalance - txNet;
        state.wallets = state.wallets.map(w =>
          w.id === form.id ? { ...w, name: cleanName, type: form.type, initialBalance: newInitial } : w
        );
      } else {
        state.wallets.push({
          id: uid(),
          name: cleanName,
          type: form.type,
          initialBalance: desiredBalance,
        });
      }
      closeModal();
      saveState();
      showToast(`✅ ${cleanName} disimpan (${formatRupiah(desiredBalance)})`);
    }

    function deleteWallet(id) {
      state.wallets = state.wallets.filter(w => w.id !== id);
      closeModal();
      saveState();
      showToast('🗑️ Dompet dihapus');
    }

    /* 2. MODAL TRANSAKSI */
    function openTxModal(type = 'expense', txId = null) {
      const existing = txId ? state.transactions.find(t => t.id === txId) : null;
      const actualType = existing ? existing.type : type;
      const cats = actualType === 'income' ? getIncomeCategories() : getExpenseCategories();
      form = {
        id: existing ? existing.id : null,
        type: actualType,
        note: existing ? existing.note : '',
        amount: existing ? String(existing.amount) : '',
        categoryId: existing ? existing.categoryId : cats[0].id,
        walletId: existing ? existing.walletId : (state.wallets[0] ? state.wallets[0].id : ''),
        date: existing ? existing.date : new Date().toISOString().slice(0, 10),
        addingCustomCat: false,
        customCatName: '',
      };
      renderTxModal();
    }

    function addTxAmount(delta) {
      const inp = document.getElementById('txAmountInput');
      const curRaw = inp ? inp.value.replace(/\D/g, '') : form.amount;
      const cur = parseInt(curRaw, 10) || 0;
      form.amount = String(Math.max(0, cur + delta));
      if (inp) inp.value = formatThousands(form.amount);
    }

    function selectTxCategory(catId) {
      form.categoryId = catId;
      document.querySelectorAll('#txCatGrid .cat-btn').forEach(b => {
        b.classList.toggle('selected', b.dataset.id === catId);
      });
    }

    function renderTxModal() {
      const cats = form.type === 'income' ? getIncomeCategories() : getExpenseCategories();
      if (!cats.some(c => c.id === form.categoryId)) form.categoryId = cats[0].id;

      openModal(`
        <div class="modal-header">
          <span class="modal-title">${form.id ? '✏️ Edit Transaksi' : (form.type === 'income' ? '📥 Catat Pemasukan' : '📤 Catat Pengeluaran')}</span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <button type="button" class="hero-btn" style="background:${form.type==='income'?'var(--green)':'#E2E8F0'};color:${form.type==='income'?'#fff':'var(--text)'}" onclick="form.type='income';renderTxModal();">📥 Pemasukan</button>
          <button type="button" class="hero-btn" style="background:${form.type==='expense'?'var(--danger)':'#E2E8F0'};color:${form.type==='expense'?'#fff':'var(--text)'}" onclick="form.type='expense';renderTxModal();">📤 Pengeluaran</button>
        </div>

        <label class="form-label">Nominal (Rp)</label>
        <input id="txAmountInput" type="text" inputmode="numeric" class="form-control" style="font-size:21px;font-weight:800;" placeholder="0" value="${formatThousands(form.amount)}" oninput="form.amount=this.value.replace(/\\D/g,'');this.value=formatThousands(form.amount);" />
        <div class="chip-row">
          <button type="button" class="chip-btn" onclick="addTxAmount(10000)">+10rb</button>
          <button type="button" class="chip-btn" onclick="addTxAmount(20000)">+20rb</button>
          <button type="button" class="chip-btn" onclick="addTxAmount(50000)">+50rb</button>
          <button type="button" class="chip-btn" onclick="addTxAmount(100000)">+100rb</button>
          <button type="button" class="chip-btn" onclick="addTxAmount(500000)">+500rb</button>
          <button type="button" class="chip-btn" style="color:var(--danger);" onclick="form.amount='0';document.getElementById('txAmountInput').value='';">Nolkan</button>
        </div>

        <label class="form-label">Catatan / Keterangan</label>
        <input id="txNoteInput" type="text" class="form-control" placeholder="Cth: Nasi Padang, Kopi, Bensin, Gaji..." value="${escapeHtml(form.note)}" oninput="form.note=this.value" />

        <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px;">
          <label class="form-label" style="margin:0;">Pilih Kategori (${cats.length} Pilihan Spesifik)</label>
          <button type="button" style="background:none;border:none;color:var(--blue);font-size:12px;font-weight:800;cursor:pointer;" onclick="form.addingCustomCat=!form.addingCustomCat;renderTxModal();">
            ${form.addingCustomCat ? 'Tutup' : '＋ Buat Kategori Sendiri'}
          </button>
        </div>

        ${form.addingCustomCat ? `
          <div style="background:#EFF6FF;border:1.5px solid var(--blue);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;gap:6px;">
            <input id="customCatInput" class="form-control" style="flex:1;" placeholder="Ketik nama kategori baru..." value="${escapeHtml(form.customCatName)}" oninput="form.customCatName=this.value" />
            <button type="button" class="hero-btn" style="flex:0;padding:0 14px;background:var(--blue);color:#fff;" onclick="saveCustomCategory()">Tambah</button>
          </div>
        ` : ''}

        <div class="cat-grid" id="txCatGrid">
          ${cats.map(c => `
            <button type="button" class="cat-btn ${form.categoryId === c.id ? 'selected' : ''}" data-id="${c.id}" onclick="selectTxCategory('${c.id}')">
              <span style="font-size:19px;">${c.icon}</span>
              <span>${escapeHtml(c.name)}</span>
            </button>
          `).join('')}
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div>
            <label class="form-label">Pakai Bank / Dompet</label>
            <select class="form-control" onchange="form.walletId=this.value">
              ${state.wallets.map(w => `<option value="${w.id}" ${form.walletId===w.id?'selected':''}>${escapeHtml(w.name)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="form-label">Tanggal</label>
            <input type="date" class="form-control" value="${form.date}" onchange="form.date=this.value" />
          </div>
        </div>

        <button type="button" class="btn-submit" onclick="saveTx()">💾 Simpan Transaksi</button>
        ${form.id ? `
          <button type="button" class="btn-danger" onclick="deleteTx('${form.id}')">🗑️ Hapus Transaksi Ini</button>
        ` : ''}
      `);
    }

    function saveCustomCategory() {
      const inp = document.getElementById('customCatInput');
      const name = ((inp ? inp.value : form.customCatName) || '').trim();
      if (!name) return;
      const newCat = {
        id: 'cust_' + uid(),
        type: form.type,
        name,
        icon: form.type === 'income' ? '💵' : '🏷️',
        color: '#2563EB',
      };
      state.customCategories.push(newCat);
      form.categoryId = newCat.id;
      form.addingCustomCat = false;
      form.customCatName = '';
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderTxModal();
    }

    function saveTx() {
      const amtEl = document.getElementById('txAmountInput');
      const noteEl = document.getElementById('txNoteInput');
      const rawAmt = (amtEl ? amtEl.value : form.amount) || '0';
      const amt = parseInt(String(rawAmt).replace(/\D/g, ''), 10) || 0;
      if (amt <= 0) {
        if (amtEl) amtEl.focus();
        showToast('⚠️ Masukkan nominal lebih dari Rp 0');
        return;
      }
      const cat = getCategory(form.categoryId);
      const noteVal = ((noteEl ? noteEl.value : form.note) || '').trim() || cat.name;
      const payload = {
        id: form.id || uid(),
        type: form.type,
        amount: amt,
        note: noteVal,
        categoryId: form.categoryId,
        walletId: form.walletId,
        date: form.date,
      };
      if (form.id) state.transactions = state.transactions.map(t => t.id === form.id ? payload : t);
      else state.transactions.unshift(payload);
      closeModal();
      saveState();
      showToast('✅ Transaksi berhasil disimpan!');
    }

    function deleteTx(id) {
      state.transactions = state.transactions.filter(t => t.id !== id);
      closeModal();
      saveState();
      showToast('🗑️ Transaksi dihapus');
    }

    /* 3. MODAL SETOR / TARIK TABUNGAN */
    function openSavingDepositModal() {
      if (!state.savings.length) return openSavingModal();
      form = {
        savingId: state.savings[0].id,
        walletId: state.wallets[0] ? state.wallets[0].id : '',
        mode: 'deposit',
        amount: '',
      };
      renderSavingDepositModal();
    }

    function renderSavingDepositModal() {
      openModal(`
        <div class="modal-header">
          <span class="modal-title">🐷 Setor / Tarik Tabungan</span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <button type="button" class="hero-btn" style="background:${form.mode==='deposit'?'var(--green)':'#E2E8F0'};color:${form.mode==='deposit'?'#fff':'var(--text)'}" onclick="form.mode='deposit';renderSavingDepositModal();">＋ Setor Nabung</button>
          <button type="button" class="hero-btn" style="background:${form.mode==='withdraw'?'var(--warning)':'#E2E8F0'};color:${form.mode==='withdraw'?'#fff':'var(--text)'}" onclick="form.mode='withdraw';renderSavingDepositModal();">－ Tarik Tabungan</button>
        </div>
        <label class="form-label">Pilih Celengan Tabungan</label>
        <select class="form-control" onchange="form.savingId=this.value">
          ${state.savings.map(s => `<option value="${s.id}" ${form.savingId===s.id?'selected':''}>${s.icon} ${escapeHtml(s.name)} (${formatRupiah(s.current)})</option>`).join('')}
        </select>
        <label class="form-label">${form.mode === 'deposit' ? 'Ambil dari Bank/Dompet' : 'Masukkan ke Bank/Dompet'}</label>
        <select class="form-control" onchange="form.walletId=this.value">
          ${state.wallets.map(w => `<option value="${w.id}" ${form.walletId===w.id?'selected':''}>${escapeHtml(w.name)}</option>`).join('')}
        </select>
        <label class="form-label">Nominal (Rp)</label>
        <input id="savDepInput" type="text" inputmode="numeric" class="form-control" style="font-size:20px;font-weight:800;" placeholder="0" value="${formatThousands(form.amount)}" oninput="form.amount=this.value.replace(/\\D/g,'');this.value=formatThousands(form.amount);" />
        <button type="button" class="btn-submit" onclick="saveSavingDeposit()">💾 Simpan</button>
      `);
    }

    function saveSavingDeposit() {
      const inp = document.getElementById('savDepInput');
      const raw = (inp ? inp.value : form.amount) || '0';
      const amt = parseInt(String(raw).replace(/\D/g, ''), 10) || 0;
      if (amt <= 0) return;
      const target = state.savings.find(s => s.id === form.savingId);
      if (!target) return;
      if (form.mode === 'deposit') {
        target.current = (Number(target.current) || 0) + amt;
        state.transactions.unshift({
          id: uid(), type: 'expense', amount: amt, categoryId: 'other_exp',
          walletId: form.walletId, note: `Nabung ke ${target.name}`, date: new Date().toISOString().slice(0, 10)
        });
      } else {
        target.current = Math.max(0, (Number(target.current) || 0) - amt);
        state.transactions.unshift({
          id: uid(), type: 'income', amount: amt, categoryId: 'cashback',
          walletId: form.walletId, note: `Tarik dari ${target.name}`, date: new Date().toISOString().slice(0, 10)
        });
      }
      closeModal();
      saveState();
      showToast('✅ Tabungan diperbarui!');
    }

      const s = savingId ? state.savings.find(x => x.id === savingId) : null;

              <span>${p.name}</span>

          `).join('')}

        ` : ''}
      `);
    }

    function saveSavingGoal() {
      const nameEl = document.getElementById('savNameInput');
      const curEl = document.getElementById('savCurInput');
      const tarEl = document.getElementById('savTarInput');
      const cleanName = ((nameEl ? nameEl.value : form.name) || '').trim() || 'Tabungan Baru';
      const curVal = parseInt(String((curEl ? curEl.value : form.current) || '0').replace(/\D/g, ''), 10) || 0;
      const tarVal = parseInt(String((tarEl ? tarEl.value : form.target) || '0').replace(/\D/g, ''), 10) || 1000000;

      const payload = {
        id: form.id || uid(),
        name: cleanName,
        icon: form.icon || '🐷',
        current: curVal,
        target: tarVal,
      };
      if (form.id) state.savings = state.savings.map(s => s.id === form.id ? payload : s);
      else state.savings.push(payload);
      closeModal();
      saveState();
      showToast('✅ Target tabungan disimpan!');
    }

    function deleteSavingGoal(id) {
      state.savings = state.savings.filter(s => s.id !== id);
      closeModal();
      saveState();
      showToast('🗑️ Celengan dihapus');
    }

    /* 5. MODAL EDIT NAMA PROFIL */
    function openProfileModal() {
      form = { userName: state.userName || 'Alfian Dimas' };
      openModal(`
        <div class="modal-header">
          <span class="modal-title">👤 Ganti Nama Kamu</span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <label class="form-label" style="margin-top:0;">Nama Panggilan / Lengkap</label>
        <input id="profNameInput" type="text" class="form-control" style="font-size:16px;font-weight:700;" value="${escapeHtml(form.userName)}" oninput="form.userName=this.value" />
        <button type="button" class="btn-submit" onclick="saveProfileName()">💾 Simpan Nama</button>
      `);
    }

    function saveProfileName() {
      const el = document.getElementById('profNameInput');
      const val = ((el ? el.value : form.userName) || '').trim();
      if (val) {
        state.userName = val;
        closeModal();
        saveState();
        showToast('✅ Nama berhasil diubah!');
      }
    }

    /* 6. MODAL DATA & PENGATURAN */
    function openDataModal() {
      openModal(`
        <div class="modal-header">
          <span class="modal-title">⚙️ Kelola Data Keuangan</span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <p style="font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.5;">
          Pilih aksi di bawah untuk mereset saldo ke Rp 0, mengatur ulang nama bank ke awal, atau memuat contoh data:
        </p>
        <button type="button" class="btn-danger" onclick="resetAllToZero()">
          🗑️ Nolkan Semua Saldo & Transaksi (Rp 0)
        </button>
        <button type="button" class="btn-danger" style="background:#0F2942;" onclick="state=getCleanZeroData();closeModal();saveState();showToast('✅ Direset total ke setelan awal Rp 0!');">
          🔄 Reset Total ke Setelan Awal (Rp 0)
        </button>
        <button type="button" class="btn-submit" style="background:var(--blue);" onclick="state=getSampleData();closeModal();saveState();showToast('✅ Data contoh dimuat!');">
          📊 Isi Data Contoh
        </button>
      `);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    saveState();
  </script>
</body>
</html>
