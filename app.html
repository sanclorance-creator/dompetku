    /* ==================== MODALS ==================== */
    let form = {};

    function openModal(html) {
      document.getElementById('modalBox').innerHTML = html;
      document.getElementById('modalBackdrop').classList.add('open');
    }
    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
    }

    /* 0. MODAL ATUR SEMUA SALDO & NAMA BANK SEKALIGUS */
    function openBulkWalletModal() {
      const totals = computeTotals();
      openModal(`
        <div class="modal-header">
          <span class="modal-title">${SVG_PATHS.bank} <span>Atur Nama Bank & Saldo</span></span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <p style="font-size:12px;color:var(--text-sub);margin-bottom:12px;">
          Ubah langsung <strong>Nama Bank/E-Wallet</strong> dan <strong>Nominal Saldo</strong> di bawah, lalu klik Simpan:
        </p>
        <div style="display:flex;flex-direction:column;gap:10px;max-height:50vh;overflow-y:auto;padding-right:2px;">
          ${state.wallets.map(w => {
            const bal = Math.max(0, totals.walletBalances[w.id] || 0);
            const badge = getWalletBadge(w);
            return `
              <div style="border:1px solid var(--glass-border);border-radius:14px;padding:11px;background:rgba(255,255,255,0.025);">
                <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
                  <div class="icon-squircle" style="width:34px;height:34px;background:${badge.color}22;color:${badge.color};">${badge.code}</div>
                  <input type="text" class="form-control bulk-w-name" data-id="${w.id}" style="font-weight:700;padding:8px 11px;" value="${escapeHtml(w.name)}" placeholder="Nama Bank / Akun" />
                  <button type="button" class="chip-btn" onclick="openWalletModal('${w.id}')">Detail</button>
                </div>
                <div style="display:flex;gap:8px;align-items:center;">
                  <span style="font-size:13px;font-weight:800;color:var(--blue-light);padding-left:6px;">Rp</span>
                  <input type="text" inputmode="numeric" class="form-control bulk-w-bal" data-id="${w.id}" style="font-size:17px;font-weight:800;padding:8px 11px;" value="${formatThousands(bal)}" placeholder="0" oninput="this.value=formatThousands(this.value)" />
                  <button type="button" class="chip-btn" style="color:var(--danger);" onclick="this.previousElementSibling.value='0'">Rp 0</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
        <div style="display:flex;gap:8px;margin-top:12px;">
          <button type="button" class="chip-btn" style="flex:1;padding:10px;color:#60A5FA;border-color:rgba(29,111,242,0.4);" onclick="openWalletModal()">+ Tambah Bank Baru</button>
          <button type="button" class="chip-btn" style="flex:1;padding:10px;color:var(--danger);border-color:rgba(255,77,106,0.35);" onclick="resetAllToZero()">Nolkan Semua Rp 0</button>
        </div>
        <button type="button" class="btn-submit" onclick="saveBulkWallets()">Simpan Semua Perubahan</button>
      `);
    }

    function saveBulkWallets() {
      const totals = computeTotals();
      const nameInputs = document.querySelectorAll('.bulk-w-name');
      const balInputs = document.querySelectorAll('.bulk-w-bal');
      const nameMap = {};
      const balMap = {};
      nameInputs.forEach(el => { nameMap[el.dataset.id] = (el.value || '').trim(); });
      balInputs.forEach(el => { balMap[el.dataset.id] = parseInt(String(el.value || '0').replace(/\D/g, ''), 10) || 0; });

      state.wallets = state.wallets.map(w => {
        const newName = nameMap[w.id] || w.name;
        const desiredBal = balMap[w.id] !== undefined ? balMap[w.id] : (totals.walletBalances[w.id] || 0);
        const txNet = totals.walletTxNet[w.id] || 0;
        return {
          ...w,
          name: newName,
          initialBalance: desiredBal - txNet,
        };
      });
      closeModal();
      saveState();
      showToast('Semua Nama Bank & Saldo berhasil diperbarui');
    }

    /* 1. MODAL BANK / AKUN INDIVIDUAL */
    function openWalletModal(walletId = null) {
      const totals = computeTotals();
      const w = walletId ? state.wallets.find(x => x.id === walletId) : null;
      const currentBal = w ? (totals.walletBalances[w.id] || 0) : 0;

      form = {
        id: w ? w.id : null,
        name: w ? w.name : '',
        type: w ? w.type : 'bank',
        targetBalance: w ? String(Math.max(0, currentBal)) : '',
      };
      renderWalletModal();
    }

    function pickBankPreset(name, type) {
      form.name = name;
      form.type = type;
      const nameInp = document.getElementById('walletNameInput');
      if (nameInp) nameInp.value = name;
      document.querySelectorAll('#bankPresetGrid .preset-btn').forEach(b => {
        b.classList.toggle('selected', b.dataset.name === name);
      });
      document.querySelectorAll('#walletTypeRow .chip-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.type === type);
      });
    }

    function selectWalletType(typeId) {
      form.type = typeId;
      document.querySelectorAll('#walletTypeRow .chip-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.type === typeId);
      });
    }

    function addWalletBalance(delta) {
      const balEl = document.getElementById('walletBalInput');
      const curRaw = balEl ? balEl.value.replace(/\D/g, '') : form.targetBalance;
      const cur = parseInt(curRaw, 10) || 0;
      form.targetBalance = String(Math.max(0, cur + delta));
      if (balEl) balEl.value = formatThousands(form.targetBalance);
    }

    function renderWalletModal() {
      const isEdit = !!form.id;
      openModal(`
        <div class="modal-header">
          <span class="modal-title">${SVG_PATHS.bank} <span>${isEdit ? 'Edit Akun Bank & Saldo' : 'Tambah Bank / E-Wallet'}</span></span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <label class="form-label" style="margin-top:0;">Pilih Cepat Bank / E-Wallet</label>
        <div class="preset-grid" id="bankPresetGrid">
          ${BANK_PRESETS.map(p => `
            <button type="button" class="preset-btn ${form.name === p.name ? 'selected' : ''}" data-name="${escapeHtml(p.name)}" onclick="pickBankPreset('${p.name}', '${p.type}')">
              <span style="width:22px;height:22px;border-radius:6px;background:${p.color}25;color:${p.color};display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex-shrink:0;">${p.code}</span>
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.name}</span>
            </button>
          `).join('')}
        </div>

        <label class="form-label">Nama Bank / E-Wallet / Akun (Bisa Diketik Bebas)</label>
        <input id="walletNameInput" type="text" class="form-control" style="font-weight:700;" placeholder="Ketik nama bank atau dompet..." value="${escapeHtml(form.name)}" oninput="form.name=this.value" />

        <label class="form-label">Jenis Akun</label>
        <div style="display:flex;gap:6px;" id="walletTypeRow">
          ${WALLET_TYPES.map(t => `
            <button type="button" class="chip-btn ${form.type === t.id ? 'active' : ''}" data-type="${t.id}" style="flex:1;padding:9px 6px;display:inline-flex;align-items:center;justify-content:center;gap:5px;" onclick="selectWalletType('${t.id}')">
              ${getSvg(t.icon)}
              <span>${t.name}</span>
            </button>
          `).join('')}
        </div>

        <label class="form-label">Saldo Saat Ini (Rp)</label>
        <input id="walletBalInput" type="text" inputmode="numeric" class="form-control" style="font-size:21px;font-weight:800;" placeholder="0" value="${formatThousands(form.targetBalance)}" oninput="form.targetBalance=this.value.replace(/\\D/g,'');this.value=formatThousands(form.targetBalance);" />
        <div class="chip-row">
          <button type="button" class="chip-btn" onclick="addWalletBalance(50000)">+50rb</button>
          <button type="button" class="chip-btn" onclick="addWalletBalance(100000)">+100rb</button>
          <button type="button" class="chip-btn" onclick="addWalletBalance(500000)">+500rb</button>
          <button type="button" class="chip-btn" onclick="addWalletBalance(1000000)">+1 Juta</button>
          <button type="button" class="chip-btn" style="color:var(--danger);" onclick="form.targetBalance='0';document.getElementById('walletBalInput').value='0';">Nolkan (Rp 0)</button>
        </div>

        <button type="button" class="btn-submit" onclick="saveWallet()">Simpan Akun & Saldo</button>
        ${isEdit && state.wallets.length > 1 ? `
          <button type="button" class="btn-danger" onclick="deleteWallet('${form.id}')">Hapus Akun Ini</button>
        ` : ''}
      `);
    }

    function saveWallet() {
      const nameEl = document.getElementById('walletNameInput');
      const balEl = document.getElementById('walletBalInput');
      const cleanName = ((nameEl ? nameEl.value : form.name) || '').trim() || 'Akun Baru';
      const rawBal = (balEl ? balEl.value : form.targetBalance) || '0';
      const desiredBalance = parseInt(String(rawBal).replace(/\D/g, ''), 10) || 0;
      const totals = computeTotals();

      if (form.id) {
        const txNet = totals.walletTxNet[form.id] || 0;
        const newInitial = desiredBalance - txNet;
        state.wallets = state.wallets.map(w =>
          w.id === form.id ? { ...w, name: cleanName, type: form.type, initialBalance: newInitial } : w
        );
      } else {
        state.wallets.push({
          id: uid(),
          name: cleanName,
          type: form.type,
          initialBalance: desiredBalance,
        });
      }
      closeModal();
      saveState();
      showToast(`${cleanName} disimpan (${formatRupiah(desiredBalance)})`);
    }

    function deleteWallet(id) {
      if (state.wallets.length <= 1) {
        showToast('Minimal harus ada 1 akun aktif');
        return;
      }
      const w = state.wallets.find(x => x.id === id);
      if (!w) return;
      const linkedTx = state.transactions.filter(t => t.walletId === id);
      const others = state.wallets.filter(x => x.id !== id);

      if (linkedTx.length === 0) {
        confirmAction({
          title: `Hapus akun ${escapeHtml(w.name)}?`,
          message: `Akun <strong>${escapeHtml(w.name)}</strong> belum memiliki riwayat transaksi dan akan dihapus.`,
          confirmLabel: 'Ya, Hapus Akun',
          onConfirm: () => {
            saveSnapshot(`Hapus akun ${w.name}`);
            state.wallets = state.wallets.filter(x => x.id !== id);
            if (selectedBankFilter === id) selectedBankFilter = 'all';
            closeModal();
            saveState();
            showToast(`Akun ${w.name} dihapus`);
          },
        });
        return;
      }

      // Jika ada transaksi terkait, wajib pilih: pindahkan ke akun lain atau hapus beserta transaksinya
      openModal(`
        <div class="modal-header">
          <span class="modal-title" style="color:var(--warning);">${SVG_PATHS.bank} <span>Pindahkan Transaksi ${escapeHtml(w.name)}</span></span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <p style="font-size:13px;color:var(--text-sub);line-height:1.6;margin-bottom:10px;">
          Akun <strong>${escapeHtml(w.name)}</strong> memiliki <strong>${linkedTx.length} transaksi</strong> tercatat. Agar tidak meninggalkan transaksi yatim, pilih akun tujuan untuk memindahkan transaksi & saldo awal:
        </p>
        <label class="form-label">Pindahkan ke Akun</label>
        <select id="migrateTargetWallet" class="form-control">
          ${others.map(o => `<option value="${o.id}">${escapeHtml(o.name)}</option>`).join('')}
        </select>
        <button type="button" class="btn-submit" onclick="confirmMigrateAndDeleteWallet('${id}')">
          Pindahkan Transaksi & Hapus ${escapeHtml(w.name)}
        </button>
        <button type="button" class="btn-danger" onclick="confirmDeleteWalletWithTx('${id}')">
          Hapus Akun Beserta ${linkedTx.length} Transaksinya
        </button>
      `);
    }

    function confirmMigrateAndDeleteWallet(sourceId) {
      const sel = document.getElementById('migrateTargetWallet');
      const targetId = sel ? sel.value : '';
      const source = state.wallets.find(w => w.id === sourceId);
      const target = state.wallets.find(w => w.id === targetId);
      if (!source || !target) return;

      saveSnapshot(`Pindahkan & hapus akun ${source.name}`);
      target.initialBalance = (Number(target.initialBalance) || 0) + (Number(source.initialBalance) || 0);
      state.transactions.forEach(t => {
        if (t.walletId === sourceId) t.walletId = targetId;
      });
      state.wallets = state.wallets.filter(w => w.id !== sourceId);
      if (selectedBankFilter === sourceId) selectedBankFilter = 'all';
      closeModal();
      saveState();
      showToast(`Transaksi dipindahkan ke ${target.name} & akun dihapus`);
    }

    function confirmDeleteWalletWithTx(sourceId) {
      const source = state.wallets.find(w => w.id === sourceId);
      if (!source) return;
      saveSnapshot(`Hapus akun ${source.name} beserta transaksi`);
      state.transactions = state.transactions.filter(t => t.walletId !== sourceId);
      state.wallets = state.wallets.filter(w => w.id !== sourceId);
      if (selectedBankFilter === sourceId) selectedBankFilter = 'all';
      closeModal();
      saveState();
      showToast(`Akun ${source.name} beserta transaksinya dihapus`);
    }

    /* 2. MODAL TRANSAKSI */
    function openTxModal(type = 'expense', txId = null) {
      const existing = txId ? state.transactions.find(t => t.id === txId) : null;
      if (existing && existing.transfer) return openTransferInfoModal(existing);
      const actualType = existing ? existing.type : type;
      const cats = actualType === 'income' ? getIncomeCategories() : getExpenseCategories();
      const walletExists = existing && state.wallets.some(w => w.id === existing.walletId);
      form = {
        id: existing ? existing.id : null,
        type: actualType,
        note: existing ? existing.note : '',
        amount: existing ? String(existing.amount) : '',
        categoryId: existing ? existing.categoryId : cats[0].id,
        walletId: walletExists ? existing.walletId : (state.wallets[0] ? state.wallets[0].id : ''),
        date: existing ? existing.date : localDateStr(),
        addingCustomCat: false,
        customCatName: '',
      };
      renderTxModal();
    }

    // Transaksi setor/tarik target dana tidak boleh diedit bebas (bisa bikin saldo target & akun tidak sinkron)
    function openTransferInfoModal(tx) {
      const sv = state.savings.find(s => s.id === tx.savingId);
      const isDeposit = tx.type === 'expense';
      openModal(`
        <div class="modal-header">
          <span class="modal-title">${SVG_PATHS.vault} <span>Transfer Target Dana</span></span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <p style="font-size:13px;color:var(--text-sub);line-height:1.6;">
          ${escapeHtml(tx.note)}<br>
          <strong style="color:var(--text-main);">${formatRupiah(tx.amount)}</strong> • ${formatDateIndo(tx.date)} • ${escapeHtml(getWallet(tx.walletId).name)}
        </p>
        <p style="font-size:12px;color:var(--text-muted);margin-top:10px;line-height:1.5;">
          Ini perpindahan uang antara akun dan target dana, jadi tidak dihitung sebagai pemasukan/pengeluaran.
          ${sv ? '' : '<br><span style="color:var(--warning);">Target dana terkait sudah tidak ada / data lama — membatalkan hanya mengembalikan saldo akun.</span>'}
        </p>
        <button type="button" class="btn-danger" onclick="cancelTransfer('${tx.id}')">
          Batalkan ${isDeposit ? 'Setoran' : 'Penarikan'} Ini
        </button>
      `);
    }

    function cancelTransfer(txId) {
      const tx = state.transactions.find(t => t.id === txId);
      if (!tx) return closeModal();
      const sv = state.savings.find(s => s.id === tx.savingId);
      const amt = Number(tx.amount) || 0;
      if (sv) {
        if (tx.type === 'expense') {
          // membatalkan setoran: dana target harus cukup untuk dikembalikan
          if ((Number(sv.current) || 0) < amt) {
            showToast(`Dana ${sv.name} tinggal ${formatRupiah(sv.current)}, tidak cukup untuk dibatalkan`);
            return;
          }
          sv.current = (Number(sv.current) || 0) - amt;
        } else {
          sv.current = (Number(sv.current) || 0) + amt;
        }
      }
      state.transactions = state.transactions.filter(t => t.id !== txId);
      closeModal();
      saveState();
      showToast('Transfer dibatalkan');
    }

    function addTxAmount(delta) {
      const inp = document.getElementById('txAmountInput');
      const curRaw = inp ? inp.value.replace(/\D/g, '') : form.amount;
      const cur = parseInt(curRaw, 10) || 0;
      form.amount = String(Math.max(0, cur + delta));
      if (inp) inp.value = formatThousands(form.amount);
    }

    function selectTxCategory(catId) {
      form.categoryId = catId;
      document.querySelectorAll('#txCatGrid .cat-btn').forEach(b => {
        b.classList.toggle('selected', b.dataset.id === catId);
      });
    }

    function renderTxModal() {
      const cats = form.type === 'income' ? getIncomeCategories() : getExpenseCategories();
      if (!cats.some(c => c.id === form.categoryId)) form.categoryId = cats[0].id;

      openModal(`
        <div class="modal-header">
          <span class="modal-title">${form.type === 'income' ? SVG_PATHS.income : SVG_PATHS.expense} <span>${form.id ? 'Edit Transaksi' : (form.type === 'income' ? 'Catat Pemasukan' : 'Catat Pengeluaran')}</span></span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
          <button type="button" class="${form.type==='income'?'btn-finpro-primary':'btn-finpro-secondary'}" onclick="form.type='income';renderTxModal();">Pemasukan</button>
          <button type="button" class="${form.type==='expense'?'btn-finpro-primary':'btn-finpro-secondary'}" onclick="form.type='expense';renderTxModal();">Pengeluaran</button>
        </div>

        <label class="form-label">Nominal (Rp)</label>
        <input id="txAmountInput" type="text" inputmode="numeric" class="form-control" style="font-size:21px;font-weight:800;" placeholder="0" value="${formatThousands(form.amount)}" oninput="form.amount=this.value.replace(/\\D/g,'');this.value=formatThousands(form.amount);" />
        <div class="chip-row">
          <button type="button" class="chip-btn" onclick="addTxAmount(10000)">+10rb</button>
          <button type="button" class="chip-btn" onclick="addTxAmount(20000)">+20rb</button>
          <button type="button" class="chip-btn" onclick="addTxAmount(50000)">+50rb</button>
          <button type="button" class="chip-btn" onclick="addTxAmount(100000)">+100rb</button>
          <button type="button" class="chip-btn" onclick="addTxAmount(500000)">+500rb</button>
          <button type="button" class="chip-btn" style="color:var(--danger);" onclick="form.amount='0';document.getElementById('txAmountInput').value='';">Nolkan</button>
        </div>

        <label class="form-label">Keterangan Transaksi</label>
        <input id="txNoteInput" type="text" class="form-control" placeholder="Cth: Makan Siang, Kopi, Bensin, Gaji..." value="${escapeHtml(form.note)}" oninput="form.note=this.value" />

        <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px;">
          <label class="form-label" style="margin:0;">Kategori (${cats.length} Pilihan)</label>
          <button type="button" style="background:none;border:none;color:#60A5FA;font-size:12px;font-weight:700;cursor:pointer;" onclick="form.addingCustomCat=!form.addingCustomCat;renderTxModal();">
            ${form.addingCustomCat ? 'Tutup' : '+ Buat Kategori Sendiri'}
          </button>
        </div>

        ${form.addingCustomCat ? `
          <div style="background:rgba(29,111,242,0.1);border:1px solid var(--blue);border-radius:12px;padding:10px;margin-bottom:8px;display:flex;gap:6px;">
            <input id="customCatInput" class="form-control" style="flex:1;" placeholder="Ketik nama kategori baru..." value="${escapeHtml(form.customCatName)}" oninput="form.customCatName=this.value" />
            <button type="button" class="btn-finpro-primary" style="padding:0 14px;" onclick="saveCustomCategory()">Tambah</button>
          </div>
        ` : ''}

        <div class="cat-grid" id="txCatGrid">
          ${cats.map(c => `
            <button type="button" class="cat-btn ${form.categoryId === c.id ? 'selected' : ''}" data-id="${c.id}" onclick="selectTxCategory('${c.id}')">
              <span style="color:${c.color};">${getSvg(c.icon)}</span>
              <span>${escapeHtml(c.name)}</span>
            </button>
          `).join('')}
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div>
            <label class="form-label">Akun Bank / Dompet</label>
            <select class="form-control" onchange="form.walletId=this.value">
              ${state.wallets.map(w => `<option value="${w.id}" ${form.walletId===w.id?'selected':''}>${escapeHtml(w.name)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="form-label">Tanggal</label>
            <input type="date" class="form-control" value="${form.date}" onchange="form.date=this.value" />
          </div>
        </div>

        <button type="button" class="btn-submit" onclick="saveTx()">Simpan Transaksi</button>
        ${form.id ? `
          <button type="button" class="btn-danger" onclick="deleteTx('${form.id}')">Hapus Transaksi Ini</button>
        ` : ''}
      `);
    }

    function saveCustomCategory() {
      const inp = document.getElementById('customCatInput');
      const name = ((inp ? inp.value : form.customCatName) || '').trim();
      if (!name) return;
      const newCat = {
        id: 'cust_' + uid(),
        type: form.type,
        name,
        icon: form.type === 'income' ? 'trending' : 'layers',
        color: '#3B82F6',
      };
      state.customCategories.push(newCat);
      form.categoryId = newCat.id;
      form.addingCustomCat = false;
      form.customCatName = '';
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderTxModal();
    }

    function saveTx() {
      const amtEl = document.getElementById('txAmountInput');
      const noteEl = document.getElementById('txNoteInput');
      const rawAmt = (amtEl ? amtEl.value : form.amount) || '0';
      const amt = parseInt(String(rawAmt).replace(/\D/g, ''), 10) || 0;
      if (amt <= 0) {
        if (amtEl) amtEl.focus();
        showToast('Masukkan nominal lebih dari Rp 0');
        return;
      }
      const cat = getCategory(form.categoryId);
      const noteVal = ((noteEl ? noteEl.value : form.note) || '').trim() || cat.name;
      const payload = {
        id: form.id || uid(),
        type: form.type,
        amount: amt,
        note: noteVal,
        categoryId: form.categoryId,
        walletId: form.walletId,
        date: form.date,
      };
      if (form.id) state.transactions = state.transactions.map(t => t.id === form.id ? payload : t);
      else state.transactions.unshift(payload);
      closeModal();
      saveState();
      showToast('Transaksi berhasil disimpan');
    }

    function deleteTx(id) {
      state.transactions = state.transactions.filter(t => t.id !== id);
      closeModal();
      saveState();
      showToast('Transaksi dihapus');
    }

    /* 3. MODAL SETOR / TARIK TARGET DANA */
    function openSavingDepositModal() {
      if (!state.savings.length) return openSavingModal();
      form = {
        savingId: state.savings[0].id,
        walletId: state.wallets[0] ? state.wallets[0].id : '',
        mode: 'deposit',
        amount: '',
      };
      renderSavingDepositModal();
    }

    function renderSavingDepositModal() {
      const totals = computeTotals();
      const target = state.savings.find(s => s.id === form.savingId) || state.savings[0];
      const maxAvailable = form.mode === 'withdraw'
        ? Math.max(0, Number(target ? target.current : 0) || 0)
        : Math.max(0, Number(totals.walletBalances[form.walletId] || 0));

      openModal(`
        <div class="modal-header">
          <span class="modal-title">${SVG_PATHS.vault} <span>Setor / Tarik Dana Simpanan</span></span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
          <button type="button" class="${form.mode==='deposit'?'btn-finpro-primary':'btn-finpro-secondary'}" onclick="form.mode='deposit';renderSavingDepositModal();">Setor Dana</button>
          <button type="button" class="${form.mode==='withdraw'?'btn-finpro-primary':'btn-finpro-secondary'}" onclick="form.mode='withdraw';renderSavingDepositModal();">Tarik Dana</button>
        </div>
        <label class="form-label">Pilih Target Dana</label>
        <select class="form-control" onchange="form.savingId=this.value;renderSavingDepositModal();">
          ${state.savings.map(s => `<option value="${s.id}" ${form.savingId===s.id?'selected':''}>${escapeHtml(s.name)} (Tersedia: ${formatRupiah(s.current)})</option>`).join('')}
        </select>
        <label class="form-label">${form.mode === 'deposit' ? 'Sumber Akun Bank/Dompet' : 'Tujuan Akun Bank/Dompet'}</label>
        <select class="form-control" onchange="form.walletId=this.value;renderSavingDepositModal();">
          ${state.wallets.map(w => `<option value="${w.id}" ${form.walletId===w.id?'selected':''}>${escapeHtml(w.name)} (Saldo: ${formatRupiah(totals.walletBalances[w.id] || 0)})</option>`).join('')}
        </select>
        <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px;">
          <label class="form-label" style="margin:0;">Nominal (Rp)</label>
          <span style="font-size:11.5px;color:var(--text-sub);">Maks: <strong>${formatRupiah(maxAvailable)}</strong></span>
        </div>
        <input id="savDepInput" type="text" inputmode="numeric" class="form-control" style="font-size:20px;font-weight:800;" placeholder="0" value="${formatThousands(form.amount)}" oninput="form.amount=this.value.replace(/\\D/g,'');this.value=formatThousands(form.amount);" />
        <div class="chip-row">
          <button type="button" class="chip-btn" onclick="form.amount='${maxAvailable}';document.getElementById('savDepInput').value=formatThousands('${maxAvailable}');">Isi Maksimal (${formatRupiah(maxAvailable)})</button>
        </div>
        <button type="button" class="btn-submit" onclick="saveSavingDeposit()">Simpan Perubahan</button>
      `);
    }

    function saveSavingDeposit() {
      const inp = document.getElementById('savDepInput');
      const raw = (inp ? inp.value : form.amount) || '0';
      const amt = parseInt(String(raw).replace(/\D/g, ''), 10) || 0;
      if (amt <= 0) {
        showToast('Masukkan nominal lebih dari Rp 0');
        return;
      }
      const target = state.savings.find(s => s.id === form.savingId);
      if (!target) return;
      const totals = computeTotals();

      if (form.mode === 'deposit') {
        const walletBal = Number(totals.walletBalances[form.walletId]) || 0;
        if (amt > walletBal) {
          showToast(`Saldo akun tidak cukup (Tersedia: ${formatRupiah(walletBal)})`);
          return;
        }
        target.current = (Number(target.current) || 0) + amt;
        state.transactions.unshift({
          id: uid(),
          type: 'expense',
          amount: amt,
          categoryId: 'other_exp',
          walletId: form.walletId,
          note: `Alokasi ke ${target.name}`,
          date: localDateStr(),
          transfer: true,
          savingId: target.id,
        });
      } else {
        const availableSaving = Number(target.current) || 0;
        // Blokir penarikan yang melebihi saldo tabungan agar tidak menciptakan uang fiktif!
        if (amt > availableSaving) {
          showToast(`Dana simpanan tidak cukup! Maksimal tarik: ${formatRupiah(availableSaving)}`);
          return;
        }
        target.current = availableSaving - amt;
        state.transactions.unshift({
          id: uid(),
          type: 'income',
          amount: amt,
          categoryId: 'cashback',
          walletId: form.walletId,
          note: `Pencairan ${target.name}`,
          date: localDateStr(),
          transfer: true,
          savingId: target.id,
        });
      }
      closeModal();
      saveState();
      showToast('Alokasi dana simpanan diperbarui');
    }

    /* 4. MODAL TARGET DANA */
    function openSavingModal(savingId = null) {
      const s = savingId ? state.savings.find(x => x.id === savingId) : null;
      form = {
        id: s ? s.id : null,
        name: s ? s.name : '',
        icon: s && SVG_PATHS[s.icon] ? s.icon : 'vault',
        current: s ? String(s.current || '') : '',
        target: s ? String(s.target || '') : '',
      };
      renderSavingModal();
    }

    function pickSavingPreset(name, icon) {
      form.name = name;
      form.icon = icon;
      const nameEl = document.getElementById('savNameInput');
      if (nameEl) nameEl.value = name;
      document.querySelectorAll('#savingPresetGrid .preset-btn').forEach(b => {
        b.classList.toggle('selected', b.dataset.name === name);
      });
    }

    function renderSavingModal() {
      const isEdit = !!form.id;
      openModal(`
        <div class="modal-header">
          <span class="modal-title">${SVG_PATHS.vault} <span>${isEdit ? 'Edit Target Dana' : 'Buat Target Dana Baru'}</span></span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <label class="form-label" style="margin-top:0;">Pilih Cepat Tujuan Dana (Atau ketik bebas)</label>
        <div class="preset-grid" id="savingPresetGrid">
          ${SAVING_PRESETS.map(p => `
            <button type="button" class="preset-btn ${form.name === p.name ? 'selected' : ''}" data-name="${escapeHtml(p.name)}" onclick="pickSavingPreset('${p.name}', '${p.icon}')">
              <span style="color:var(--blue-light);">${getSvg(p.icon)}</span>
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.name}</span>
            </button>
          `).join('')}
        </div>

        <label class="form-label">Nama Target Dana</label>
        <input id="savNameInput" type="text" class="form-control" style="font-weight:700;" placeholder="Ketik nama target dana..." value="${escapeHtml(form.name)}" oninput="form.name=this.value" />

        <label class="form-label">Dana Terkumpul Saat Ini (Rp)</label>
        <input id="savCurInput" type="text" inputmode="numeric" class="form-control" style="font-size:18px;font-weight:800;" placeholder="0" value="${formatThousands(form.current)}" oninput="form.current=this.value.replace(/\\D/g,'');this.value=formatThousands(form.current);" />

        <label class="form-label">Target Nominal (Rp)</label>
        <input id="savTarInput" type="text" inputmode="numeric" class="form-control" style="font-size:18px;font-weight:800;" placeholder="0" value="${formatThousands(form.target)}" oninput="form.target=this.value.replace(/\\D/g,'');this.value=formatThousands(form.target);" />

        <button type="button" class="btn-submit" onclick="saveSavingGoal()">Simpan Target Dana</button>
        ${isEdit ? `
          <button type="button" class="btn-danger" onclick="deleteSavingGoal('${form.id}')">Hapus Target Ini</button>
        ` : ''}
      `);
    }

    function saveSavingGoal() {
      const nameEl = document.getElementById('savNameInput');
      const curEl = document.getElementById('savCurInput');
      const tarEl = document.getElementById('savTarInput');
      const cleanName = ((nameEl ? nameEl.value : form.name) || '').trim() || 'Target Baru';
      const curVal = parseInt(String((curEl ? curEl.value : form.current) || '0').replace(/\D/g, ''), 10) || 0;
      const tarVal = parseInt(String((tarEl ? tarEl.value : form.target) || '0').replace(/\D/g, ''), 10) || 1000000;

      const payload = {
        id: form.id || uid(),
        name: cleanName,
        icon: SVG_PATHS[form.icon] ? form.icon : 'vault',
        current: curVal,
        target: tarVal,
      };
      if (form.id) state.savings = state.savings.map(s => s.id === form.id ? payload : s);
      else state.savings.push(payload);
      closeModal();
      saveState();
      showToast('Target dana berhasil disimpan');
    }

    function deleteSavingGoal(id) {
      state.savings = state.savings.filter(s => s.id !== id);
      closeModal();
      saveState();
      showToast('Target dana dihapus');
    }

    /* 5. MODAL PROFIL */
    function openProfileModal() {
      form = { userName: state.userName || 'Alfian Dimas' };
      openModal(`
        <div class="modal-header">
          <span class="modal-title">Ubah Nama Profil</span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <label class="form-label" style="margin-top:0;">Nama Lengkap / Panggilan</label>
        <input id="profNameInput" type="text" class="form-control" style="font-size:16px;font-weight:700;" value="${escapeHtml(form.userName)}" oninput="form.userName=this.value" />
        <button type="button" class="btn-submit" onclick="saveProfileName()">Simpan Nama</button>
      `);
    }

    function saveProfileName() {
      const el = document.getElementById('profNameInput');
      const val = ((el ? el.value : form.userName) || '').trim();
      if (val) {
        state.userName = val;
        closeModal();
        saveState();
        showToast('Nama profil berhasil diperbarui');
      }
    }

    /* 6. MODAL PENGATURAN DATA, BACKUP EKSPOR/IMPOR & RESET */
    function exportBackupJson() {
      const payload = {
        app: 'DompetKu Pro',
        version: 5,
        exportedAt: new Date().toISOString(),
        data: state,
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `dompetku-backup-${localDateStr()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('File Backup JSON berhasil diunduh');
    }

    function exportTransactionsCsv() {
      const rows = [['Tanggal', 'Tipe', 'Kategori', 'Keterangan', 'Akun', 'Nominal']];
      state.transactions.forEach(t => {
        const cat = t.transfer ? { name: 'Transfer Target Dana' } : getCategory(t.categoryId);
        const w = getWallet(t.walletId);
        const tipe = t.transfer ? 'Transfer' : (t.type === 'income' ? 'Pemasukan' : 'Pengeluaran');
        rows.push([
          t.date,
          tipe,
          cat.name,
          String(t.note || '').replace(/"/g, '""'),
          String(w.name || '').replace(/"/g, '""'),
          String(t.amount || 0),
        ]);
      });
      const csvContent = rows.map(r => r.map(cell => `"${cell}"`).join(',')).join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `dompetku-transaksi-${localDateStr()}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Laporan CSV berhasil diunduh');
    }

    function handleImportJsonFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          const candidate = parsed && parsed.data && isValidState(parsed.data) ? parsed.data : parsed;
          if (!isValidState(candidate)) {
            showToast('Format file backup tidak valid');
            return;
          }
          saveSnapshot('Sebelum impor backup');
          state = normalizeState(candidate);
          closeModal();
          saveState();
          showToast('Data backup berhasil dipulihkan!');
        } catch (err) {
          showToast('Gagal membaca file JSON');
        }
      };
      reader.readAsText(file);
    }

    function openDataModal() {
      const snap = getSnapshot();
      openModal(`
        <div class="modal-header">
          <span class="modal-title">${SVG_PATHS.settings} <span>Backup & Kelola Data</span></span>
          <button type="button" class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <label class="form-label" style="margin-top:0;">Cadangkan & Pulihkan Data (Backup)</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
          <button type="button" class="btn-finpro-primary" onclick="exportBackupJson()">
            ${SVG_PATHS.income}
            <span>Ekspor JSON</span>
          </button>
          <button type="button" class="btn-finpro-secondary" onclick="exportTransactionsCsv()">
            ${SVG_PATHS.layers}
            <span>Ekspor CSV</span>
          </button>
        </div>
        <input type="file" id="importJsonInput" accept=".json,application/json" style="display:none;" onchange="handleImportJsonFile(event)" />
        <button type="button" class="btn-finpro-secondary" style="width:100%;margin-bottom:10px;" onclick="document.getElementById('importJsonInput').click()">
          ${SVG_PATHS.expense}
          <span>Impor / Pulihkan dari File JSON</span>
        </button>

        ${snap ? `
          <button type="button" class="btn-submit" style="margin-top:4px;margin-bottom:10px;background:linear-gradient(135deg,#059669,#10B981);" onclick="restoreSnapshot()">
            Pulihkan Data Sebelum Reset (${escapeHtml(snap.reason || 'Cadangan')})
          </button>
        ` : ''}

        <label class="form-label">Reset & Data Contoh</label>
        <button type="button" class="btn-danger" onclick="resetAllToZero()">
          Nolkan Semua Saldo & Transaksi (Rp 0)
        </button>
        <button type="button" class="btn-danger" style="color:var(--text-main);border-color:var(--glass-border);background:rgba(255,255,255,0.05);" onclick="confirmAction({title:'Reset penuh ke setelan awal?',message:'Semua akun, transaksi, dan target dana akan dikembalikan ke daftar awal Rp 0. Cadangan otomatis tetap disimpan.',confirmLabel:'Ya, Reset Penuh',onConfirm:doFullReset})">
          Reset Penuh ke Setelan Awal (Rp 0)
        </button>
        <button type="button" class="btn-finpro-secondary" style="width:100%;margin-top:8px;" onclick="confirmAction({title:'Muat contoh data?',message:'Data saat ini akan dicadangkan otomatis lalu diganti dengan contoh data dashboard.',confirmLabel:'Muat Contoh',onConfirm:doLoadSample})">
          Muat Contoh Data Dashboard
        </button>
      `);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    saveState();
  </script>
  <script src="./dompetku_safety_patch.js?v=fix7"></script>
</body>
</html>
