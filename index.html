<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0E314A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DompetKu" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>DompetKu — Pengatur Keuangan Pribadi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-top: #133955;
      --navy-bottom: #0B253A;
      --green: #8CC63F;
      --green-dark: #5C9E23;
      --blue: #3B82F6;
      --bg: #F1F5F9;
      --card: #FFFFFF;
      --text: #0F2942;
      --muted: #64748B;
      --border: #E2E8F0;
      --danger: #E11D48;
      --warning: #F59E0B;
      --shadow: 0 4px 16px rgba(15, 41, 66, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    /* ==================== SIDEBAR (DESKTOP) & BOTTOM NAV (MOBILE) ==================== */
    .sidebar {
      width: 230px;
      background: linear-gradient(180deg, var(--navy-top) 0%, var(--navy-bottom) 100%);
      color: #fff;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      padding: 20px 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 10px 24px;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .brand-text {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nav-btn {
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.72);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .nav-btn.active {
      background: rgba(140, 198, 63, 0.18);
      color: var(--green);
      font-weight: 800;
    }
    .nav-icon {
      font-size: 18px;
      line-height: 1;
    }

    /* ==================== MAIN CONTENT ==================== */
    .main {
      margin-left: 230px;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    /* Topbar */
    .topbar {
      height: 62px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 4px 8px 4px 4px;
      border-radius: 12px;
      transition: background 0.15s;
    }
    .user-chip:hover {
      background: var(--bg);
    }
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #ECF6DF;
      border: 1.5px solid #B7DC82;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }
    .user-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .user-sub {
      font-size: 11px;
      color: var(--green-dark);
      font-weight: 700;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-btn {
      border: 1px solid var(--border);
      background: #F8FAFC;
      color: var(--text);
      height: 36px;
      padding: 0 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* Page container */
    .container {
      padding: 20px 24px 96px;
      max-width: 1260px;
      width: 100%;
      margin: 0 auto;
    }

    /* ==================== TOP SUMMARY CARDS ==================== */
    .summary-grid {
      display: grid;
      grid-template-columns: 1.35fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 22px;
    }

    .hero-card {
      background: linear-gradient(125deg, #7BB642 0%, #3E885B 40%, #164B68 80%, #0E314A 100%);
      border-radius: 16px;
      padding: 20px;
      color: #fff;
      box-shadow: 0 8px 20px rgba(14, 49, 74, 0.18);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      opacity: 0.95;
    }
    .edit-pill-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .hero-balance {
      font-size: 28px;
      font-weight: 800;
      margin: 8px 0 14px;
      letter-spacing: -0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hero-btn-row {
      display: flex;
      gap: 8px;
    }
    .hero-btn {
      flex: 1;
      border: none;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .hero-btn.in {
      background: var(--green);
      color: #fff;
    }
    .hero-btn.out {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.28);
    }
    .hero-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      margin-top: 14px;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
    }

    /* White Metric Card */
    .stat-card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .stat-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }
    .stat-val {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      margin: 8px 0 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .stat-sub {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      gap: 8px;
      flex-wrap: wrap;
    }
    .stat-link {
      background: none;
      border: none;
      color: var(--blue);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      text-align: right;
      margin-top: 10px;
    }

    /* ==================== QUICK ACTIONS ==================== */
    .section-title {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }
    .quick-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: var(--shadow);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: transform 0.15s, border-color 0.15s;
    }
    .quick-card:active {
      transform: scale(0.98);
    }
    .quick-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .quick-card h4 {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text);
    }
    .quick-card p {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ==================== 2-COLUMN CONTENT GRID ==================== */
    .two-col {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 18px;
      align-items: start;
    }
    .card-box {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    /* Transaction Row */
    .tx-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 4px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      gap: 10px;
      border-radius: 8px;
    }
    .tx-row:hover {
      background: #F8FAFC;
    }
    .tx-row:last-child {
      border-bottom: none;
    }
    .tx-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }
    .tx-badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
    }
    .tx-info {
      min-width: 0;
      flex: 1;
    }
    .tx-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tx-meta {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tx-right {
      text-align: right;
      flex-shrink: 0;
    }
    .tx-amt {
      font-size: 13.5px;
      font-weight: 800;
    }
    .tx-wallet-tag {
      font-size: 11px;
      color: var(--blue);
      font-weight: 700;
      margin-top: 2px;
    }

    .progress-track {
      height: 8px;
      background: #E2E8F0;
      border-radius: 99px;
      overflow: hidden;
      margin: 6px 0;
    }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    /* ==================== MODAL SHEET ==================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(11, 37, 58, 0.6);
      backdrop-filter: blur(2px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 460px;
      border-radius: 20px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .modal-title {
      font-size: 16px;
      font-weight: 800;
    }
    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #F1F5F9;
      font-weight: 800;
      cursor: pointer;
      font-size: 15px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      margin: 14px 0 6px;
    }
    .form-control {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      background: #fff;
    }
    .form-control:focus {
      border-color: var(--blue);
    }

    /* Quick Nominal Chips */
    .chip-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .chip-btn {
      border: 1px solid var(--border);
      background: #F8FAFC;
      color: var(--text);
      padding: 6px 10px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .chip-btn:active, .chip-btn.active {
      background: #EBF5FF;
      border-color: var(--blue);
      color: var(--blue);
    }

    /* Category Grid */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      max-height: 230px;
      overflow-y: auto;
      padding: 2px;
    }
    .cat-btn {
      border: 1.5px solid var(--border);
      background: #F8FAFC;
      border-radius: 12px;
      padding: 8px 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      min-height: 64px;
    }
    .cat-btn.selected {
      border-color: var(--blue);
      background: #EBF5FF;
      color: var(--blue);
    }

    /* Bank / Wallet Preset Grid */
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      max-height: 170px;
      overflow-y: auto;
      padding: 2px;
    }
    .preset-btn {
      border: 1.5px solid var(--border);
      background: #F8FAFC;
      border-radius: 10px;
      padding: 8px 6px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .preset-btn.selected {
      border-color: var(--blue);
      background: #EBF5FF;
      color: var(--blue);
    }

    .btn-submit {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      background: var(--green);
      cursor: pointer;
      margin-top: 16px;
    }
    .btn-danger {
      width: 100%;
      border: 1.5px solid var(--danger);
      border-radius: 12px;
      padding: 11px;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--danger);
      background: #FFF1F2;
      cursor: pointer;
      margin-top: 10px;
    }

    /* ==================== RESPONSIVE MOBILE (< 768px) ==================== */
    @media (max-width: 960px) {
      .summary-grid { grid-template-columns: 1fr; }
      .two-col { grid-template-columns: 1fr; }
      .quick-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        height: 64px;
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        flex-direction: row;
        padding: 4px 6px;
        box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.12);
      }
      .brand { display: none; }
      .nav-list {
        flex-direction: row;
        width: 100%;
        justify-content: space-around;
        align-items: center;
        gap: 2px;
      }
      .nav-btn {
        flex: 1;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 6px 2px;
        gap: 3px;
        font-size: 10.5px;
        border-radius: 8px;
        text-align: center;
      }
      .nav-icon { font-size: 19px; }

      .main { margin-left: 0; }
      .topbar { padding: 0 14px; height: 56px; }
      .container { padding: 14px 14px 86px; }
      .hero-balance { font-size: 25px; }
      .quick-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .quick-card { padding: 12px; gap: 10px; }
      .quick-icon { width: 36px; height: 36px; font-size: 17px; }
      .quick-card h4 { font-size: 12.5px; }
      .quick-card p { display: none; }
      .modal-backdrop { align-items: flex-end; padding: 0; }
      .modal-box {
        max-width: 100%;
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
        padding: 18px 16px 28px;
      }
    }
  </style>
</head>
<body>

  <!-- SIDEBAR / MOBILE BOTTOM NAV -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">💰</div>
      <span class="brand-text">DOMPETKU</span>
    </div>
    <nav class="nav-list">
      <button class="nav-btn active" data-page="dashboard" onclick="navigate('dashboard')">
        <span class="nav-icon">🏠</span>
        <span>Beranda</span>
      </button>
      <button class="nav-btn" data-page="income" onclick="navigate('income')">
        <span class="nav-icon">📥</span>
        <span>Masuk</span>
      </button>
      <button class="nav-btn" data-page="expense" onclick="navigate('expense')">
        <span class="nav-icon">📤</span>
        <span>Keluar</span>
      </button>
      <button class="nav-btn" data-page="savings" onclick="navigate('savings')">
        <span class="nav-icon">🐷</span>
        <span>Tabungan</span>
      </button>
      <button class="nav-btn" data-page="wallets" onclick="navigate('wallets')">
        <span class="nav-icon">🏦</span>
        <span>Bank/Dompet</span>
      </button>
    </nav>
  </aside>

  <!-- MAIN AREA -->
  <div class="main">
    <header class="topbar">
      <div class="user-chip" onclick="openProfileModal()">
        <div class="user-avatar">👤</div>
        <div>
          <div class="user-name">
            <span id="userNameText">Alfian Dimas</span>
            <span style="font-size:11px;color:var(--muted);">✏️</span>
          </div>
          <div class="user-sub">Ketuk untuk ganti nama</div>
        </div>
      </div>

      <div class="topbar-actions">
        <button class="icon-btn" onclick="hideBalance=!hideBalance;saveState();">
          <span id="eyeIcon">👁️</span> Saldo
        </button>
        <button class="icon-btn" onclick="openSettingsModal()">
          ⚙️ Data
        </button>
      </div>
    </header>

    <main class="container" id="pageContent"></main>
  </div>

  <!-- MODAL -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target.id==='modalBackdrop') closeModal()">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <script>
    /* ==================== SPECIFIC INDONESIAN CATEGORIES ==================== */
    const DEFAULT_EXPENSE_CATEGORIES = [
      { id: 'makan', name: 'Makan Harian', icon: '🍛', color: '#F97316' },
      { id: 'ngopi', name: 'Ngopi & Jajan', icon: '☕', color: '#D97706' },
      { id: 'gofood', name: 'GoFood / GrabFood', icon: '🛵', color: '#10B981' },
      { id: 'bensin', name: 'Bensin & Parkir', icon: '⛽', color: '#3B82F6' },
      { id: 'ojol', name: 'Ojol / Transport', icon: '🚆', color: '#0EA5E9' },
      { id: 'minimarket', name: 'Indomaret / Alfamart', icon: '🏪', color: '#EC4899' },
      { id: 'olshop', name: 'Shopee / Tokped / TikTok', icon: '📦', color: '#F43F5E' },
      { id: 'kuota', name: 'Pulsa & Paket Data', icon: '📱', color: '#8B5CF6' },
      { id: 'listrik', name: 'Listrik PLN & WiFi', icon: '⚡', color: '#eab308' },
      { id: 'kost', name: 'Kost / Cicilan / Sewa', icon: '🏠', color: '#6366F1' },
      { id: 'skincare', name: 'Skincare & Laundry', icon: '🧴', color: '#14B8A6' },
      { id: 'hiburan', name: 'Netflix / Game / Nonton', icon: '🎮', color: '#A855F7' },
      { id: 'ortu', name: 'Kasih Ortu / Sedekah', icon: '🤲', color: '#059669' },
      { id: 'kesehatan', name: 'Obat & Kesehatan', icon: '💊', color: '#EF4444' },
      { id: 'nongkrong', name: 'Nongkrong Bareng Teman', icon: '🍻', color: '#F59E0B' },
      { id: 'other_exp', name: 'Pengeluaran Lainnya', icon: '📋', color: '#64748B' },
    ];

    const DEFAULT_INCOME_CATEGORIES = [
      { id: 'gaji', name: 'Gaji Pokok', icon: '💰', color: '#10B981' },

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (!parsed.customCategories) parsed.customCategories = [];
          return parsed;
        }
      } catch (e) {}
      const def = getDefaultData();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(def));
      return def;
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      document.getElementById('userNameText').textContent = state.userName || 'Alfian Dimas';
      document.getElementById('eyeIcon').textContent = hideBalance ? '🙈' : '👁️';
      renderPage();
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function formatRupiah(n, masked = false) {
      if (masked && hideBalance) return 'Rp •••••••';
      const num = Number(n) || 0;
      const formatted = Math.round(Math.abs(num)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return `${num < 0 ? '-' : ''}Rp ${formatted}`;
    }

    function formatThousands(val) {
      const digits = String(val || '').replace(/\D/g, '');
      if (!digits) return '';
      return digits.replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function formatDateIndo(dateStr) {
      const d = new Date(dateStr);
      if (isNaN(d)) return dateStr;
      return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]} ${d.getFullYear()}`;
    }

    function getExpenseCategories() {
      const custom = (state.customCategories || []).filter(c => c.type === 'expense');
      return [...DEFAULT_EXPENSE_CATEGORIES, ...custom];
    }

    function getIncomeCategories() {
      const custom = (state.customCategories || []).filter(c => c.type === 'income');
      return [...DEFAULT_INCOME_CATEGORIES, ...custom];
    }

    function getCategory(id) {
      return [...getExpenseCategories(), ...getIncomeCategories()].find(c => c.id === id) ||
        { id, name: 'Lainnya', icon: '📋', color: '#64748B' };
    }

    function getWallet(id) {
      return state.wallets.find(w => w.id === id) || state.wallets[0] || { id: '', name: 'Utama', type: 'bank' };
    }

    function getWalletType(typeId) {
      return WALLET_TYPES.find(t => t.id === typeId) || WALLET_TYPES[0];
    }

    function computeTotals() {
      const walletBalances = {};
      const walletTxNet = {};
      state.wallets.forEach(w => {
        walletBalances[w.id] = Number(w.initialBalance) || 0;
        walletTxNet[w.id] = 0;
      });

      let totalIncome = 0;
      let totalExpense = 0;

      state.transactions.forEach(t => {
        const amt = Number(t.amount) || 0;
        if (t.type === 'income') {
          totalIncome += amt;
          if (walletBalances[t.walletId] !== undefined) {
            walletBalances[t.walletId] += amt;
            walletTxNet[t.walletId] += amt;
          }
        } else {
          totalExpense += amt;
          if (walletBalances[t.walletId] !== undefined) {
            walletBalances[t.walletId] -= amt;
            walletTxNet[t.walletId] -= amt;
          }
        }
      });

      const totalWalletBalance = Object.values(walletBalances).reduce((a, b) => a + b, 0);
      const totalSavings = (state.savings || []).reduce((s, item) => s + (Number(item.current) || 0), 0);
      const totalSavingsTarget = (state.savings || []).reduce((s, item) => s + (Number(item.target) || 0), 0);

      return {
        walletBalances,
        walletTxNet,
        totalWalletBalance,
        totalIncome,
        totalExpense,
        totalSavings,
        totalSavingsTarget,
      };
    }

    function navigate(page) {
      currentPage = page;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.page === page);
      });
      window.scrollTo(0, 0);
      renderPage();

    function renderTxRow(tx) {

            </div>
            <div class="tx-wallet-tag">${escapeHtml(w.name)}</div>
          </div>
        </div>
      `;
    }

      else if (currentPage === 'savings') el.innerHTML = renderSavingsPage();

        note: existing ? existing.note : '',
        amount: existing ? String(existing.amount) : '',
        categoryId: existing ? existing.categoryId : cats[0].id,
        walletId: existing ? existing.walletId : (state.wallets[0] ? state.wallets[0].id : ''),
        date: existing ? existing.date : new Date().toISOString().slice(0, 10),
        confirmDelete: false,
        addingCustomCat: false,
        customCatName: '',
        customCatIcon: '🏷️',
      };
      renderTxModal();
    }

    function addQuickAmount(val) {
      const cur = parseInt(form.amount, 10) || 0;
      form.amount = String(cur + val);
      const inp = document.getElementById('txAmountInput');
      if (inp) inp.value = formatThousands(form.amount);
    }

    function renderTxModal() {
      const cats = form.type === 'income' ? getIncomeCategories() : getExpenseCategories();
      if (!cats.some(c => c.id === form.categoryId)) form.categoryId = cats[0].id;

      openModal(`
        <div class="modal-header">
          <span class="modal-title">${form.id ? '✏️ Edit Transaksi' : (form.type === 'income' ? '📥 Catat Pemasukan' : '📤 Catat Pengeluaran')}</span>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <button type="button" class="hero-btn" style="background:${form.type==='income'?'var(--green)':'#E2E8F0'};color:${form.type==='income'?'#fff':'var(--text)'}" onclick="form.type='income';renderTxModal();">📥 Pemasukan</button>
          <button type="button" class="hero-btn" style="background:${form.type==='expense'?'var(--danger)':'#E2E8F0'};color:${form.type==='expense'?'#fff':'var(--text)'}" onclick="form.type='expense';renderTxModal();">📤 Pengeluaran</button>
        </div>

        <label class="form-label">Nominal (Rp)</label>
        <input id="txAmountInput" type="text" inputmode="numeric" class="form-control" style="font-size:21px;font-weight:800;" placeholder="0" value="${formatThousands(form.amount)}" oninput="form.amount=this.value.replace(/\\D/g,'');this.value=formatThousands(form.amount);" />
        <div class="chip-row">
          <button type="button" class="chip-btn" onclick="addQuickAmount(10000)">+10rb</button>
          <button type="button" class="chip-btn" onclick="addQuickAmount(20000)">+20rb</button>
          <button type="button" class="chip-btn" onclick="addQuickAmount(50000)">+50rb</button>
          <button type="button" class="chip-btn" onclick="addQuickAmount(100000)">+100rb</button>
          <button type="button" class="chip-btn" onclick="addQuickAmount(500000)">+500rb</button>
          <button type="button" class="chip-btn" style="color:var(--danger);" onclick="form.amount='';document.getElementById('txAmountInput').value='';">Reset</button>
        </div>

        <label class="form-label">Catatan / Keterangan</label>
        <input class="form-control" placeholder="Cth: Nasi Padang, Kopi, Bensin, Gaji..." value="${escapeHtml(form.note)}" oninput="form.note=this.value" />

        <div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px;">
          <label class="form-label" style="margin:0;">Pilih Kategori (${cats.length} pilihan)</label>
          <button type="button" style="background:none;border:none;color:var(--blue);font-size:12px;font-weight:800;cursor:pointer;" onclick="form.addingCustomCat=!form.addingCustomCat;renderTxModal();">
            ${form.addingCustomCat ? 'Batal' : '＋ Buat Kategori Sendiri'}
          </button>
        </div>

        ${form.addingCustomCat ? `
          <div style="background:#F8FAFC;border:1.5px solid var(--blue);border-radius:12px;padding:12px;margin-bottom:10px;">
            <div style="font-size:12px;font-weight:800;margin-bottom:6px;">Tambah Kategori Baru</div>
            <div style="display:flex;gap:8px;">
              <input class="form-control" style="flex:1;" placeholder="Nama kategori baru..." value="${escapeHtml(form.customCatName)}" oninput="form.customCatName=this.value" />
              <button type="button" class="hero-btn" style="flex:0;padding:0 14px;background:var(--blue);color:#fff;" onclick="saveCustomCategory()">Tambah</button>
            </div>
          </div>
        ` : ''}

        <div class="cat-grid">
          ${cats.map(c => `
            <button type="button" class="cat-btn ${form.categoryId === c.id ? 'selected' : ''}" onclick="form.categoryId='${c.id}';renderTxModal();">
              <span style="font-size:20px;">${c.icon}</span>
              <span>${escapeHtml(c.name)}</span>
            </button>
          `).join('')}
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div>
            <label class="form-label">Pakai Bank / Dompet</label>
            <select class="form-control" onchange="form.walletId=this.value">
              ${state.wallets.map(w => `<option value="${w.id}" ${form.walletId===w.id?'selected':''}>${escapeHtml(w.name)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="form-label">Tanggal</label>
            <input type="date" class="form-control" value="${form.date}" onchange="form.date=this.value" />
          </div>
        </div>

        <button class="btn-submit" onclick="saveTx()">💾 Simpan Transaksi</button>
        ${form.id ? (
          !form.confirmDelete
            ? `<button type="button" class="btn-danger" onclick="form.confirmDelete=true;renderTxModal();">🗑️ Hapus Transaksi Ini</button>`
            : `<button type="button" class="btn-danger" style="background:var(--danger);color:#fff;" onclick="deleteTx('${form.id}')">⚠️ Yakin Hapus? Ketuk Sekali Lagi</button>`
        ) : ''}
      `);
    }

    function saveCustomCategory() {
      const name = (form.customCatName || '').trim();
      if (!name) return;
      const newCat = {
        id: 'cust_' + uid(),
        type: form.type,
        name,
        icon: form.type === 'income' ? '💵' : '🏷️',
        color: '#3B82F6',
      };
      state.customCategories.push(newCat);
      form.categoryId = newCat.id;
      form.addingCustomCat = false;
      form.customCatName = '';
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderTxModal();
    }

    function saveTx() {
      const amt = parseInt(form.amount, 10) || 0;
      if (amt <= 0) {
        document.getElementById('txAmountInput').focus();
        return;
      }
      const cat = getCategory(form.categoryId);
      const payload = {
        id: form.id || uid(),
        type: form.type,
        amount: amt,
        note: form.note.trim() || cat.name,
        categoryId: form.categoryId,
        walletId: form.walletId,
        date: form.date,
      };
      if (form.id) state.transactions = state.transactions.map(t => t.id === form.id ? payload : t);
      else state.transactions.unshift(payload);
      closeModal();
      saveState();
    }

    function deleteTx(id) {
      state.transactions = state.transactions.filter(t => t.id !== id);
      closeModal();
      saveState();
    }

    /* 2. MODAL EDIT / TAMBAH BANK & DOMPET (DIRECT CURRENT BALANCE EDIT!) */
    function openWalletModal(walletId = null) {
      const totals = computeTotals();
      const w = walletId ? state.wallets.find(x => x.id === walletId) : null;
      const currentBal = w ? (totals.walletBalances[w.id] || 0) : 0;

      form = {
        id: w ? w.id : null,
        name: w ? w.name : '',
        type: w ? w.type : 'bank',
        targetBalance: w ? String(Math.max(0, currentBal)) : '',
        confirmDelete: false,
      };
      renderWalletModal();
    }

    function selectBankPreset(name, type) {
      form.name = name;
      form.type = type;
      renderWalletModal();
    }

    function renderWalletModal() {
      const isEdit = !!form.id;
      openModal(`
        <div class="modal-header">
          <span class="modal-title">${isEdit ? '✏️ Edit Nama Bank & Saldo' : '🏦 Tambah Bank / E-Wallet / Dompet'}</span>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <label class="form-label" style="margin-top:0;">Pilih Cepat Bank / E-Wallet Indonesia (Atau ketik di bawah)</label>
        <div class="preset-grid">
          ${BANK_PRESETS.map(p => `
            <button type="button" class="preset-btn ${form.name === p.name ? 'selected' : ''}" onclick="selectBankPreset('${p.name}', '${p.type}')">
              <span>${p.icon}</span>
              <span>${p.name}</span>
            </button>
          `).join('')}
        </div>

        <label class="form-label">Nama Bank / E-Wallet / Dompet (Bebas Diubah)</label>
        <input id="walletNameInput" class="form-control" style="font-weight:700;" placeholder="Ketik nama bank/dompet, cth: BCA Utama, Mandiri, GoPay..." value="${escapeHtml(form.name)}" oninput="form.name=this.value" />

        <label class="form-label">Kategori Akun</label>
        <div style="display:flex;gap:6px;">
          ${WALLET_TYPES.map(t => `
            <button type="button" class="chip-btn ${form.type === t.id ? 'active' : ''}" style="flex:1;padding:9px 6px;" onclick="form.type='${t.id}';renderWalletModal();">
              ${t.icon} ${t.name}
            </button>
          `).join('')}
        </div>

        <label class="form-label">Saldo Saat Ini di ${escapeHtml(form.name || 'Dompet Ini')} (Rp)</label>
        <input id="walletBalInput" type="text" inputmode="numeric" class="form-control" style="font-size:21px;font-weight:800;" placeholder="0" value="${formatThousands(form.targetBalance)}" oninput="form.targetBalance=this.value.replace(/\\D/g,'');this.value=formatThousands(form.targetBalance);" />
        <div class="chip-row">
          <button type="button" class="chip-btn" onclick="form.targetBalance=String((parseInt(form.targetBalance,10)||0)+100000);document.getElementById('walletBalInput').value=formatThousands(form.targetBalance);">+100rb</button>
          <button type="button" class="chip-btn" onclick="form.targetBalance=String((parseInt(form.targetBalance,10)||0)+500000);document.getElementById('walletBalInput').value=formatThousands(form.targetBalance);">+500rb</button>
          <button type="button" class="chip-btn" onclick="form.targetBalance=String((parseInt(form.targetBalance,10)||0)+1000000);document.getElementById('walletBalInput').value=formatThousands(form.targetBalance);">+1 Juta</button>
          <button type="button" class="chip-btn" style="color:var(--danger);" onclick="form.targetBalance='0';document.getElementById('walletBalInput').value='0';">Set Rp 0</button>
        </div>

        <button class="btn-submit" onclick="saveWallet()">💾 Simpan Bank / Dompet</button>
        ${isEdit && state.wallets.length > 1 ? (
          !form.confirmDelete
            ? `<button type="button" class="btn-danger" onclick="form.confirmDelete=true;renderWalletModal();">🗑️ Hapus Dompet Ini</button>`
            : `<button type="button" class="btn-danger" style="background:var(--danger);color:#fff;" onclick="deleteWallet('${form.id}')">⚠️ Yakin Hapus? Ketuk Sekali Lagi</button>`
        ) : ''}
      `);
    }

    function saveWallet() {
      const cleanName = (form.name || '').trim();
      if (!cleanName) {
        document.getElementById('walletNameInput').focus();
        return;
      }
      const desiredBalance = parseInt(form.targetBalance, 10) || 0;
      const totals = computeTotals();

      if (form.id) {
        // Adjust initialBalance so that initialBalance + walletTxNet === desiredBalance!
        const txNet = totals.walletTxNet[form.id] || 0;
        const newInitial = desiredBalance - txNet;
        state.wallets = state.wallets.map(w =>
          w.id === form.id ? { ...w, name: cleanName, type: form.type, initialBalance: newInitial } : w
        );
      } else {
        state.wallets.push({
          id: uid(),
          name: cleanName,
          type: form.type,
          initialBalance: desiredBalance,
        });
      }
      closeModal();
      saveState();
    }

    function deleteWallet(id) {
      state.wallets = state.wallets.filter(w => w.id !== id);
      closeModal();
      saveState();
    }

    /* 3. MODAL SETOR / TARIK TABUNGAN */
    function openSavingDepositModal() {
      if (!state.savings.length) return openSavingModal();
      form = {
        savingId: state.savings[0].id,
        walletId: state.wallets[0] ? state.wallets[0].id : '',
        mode: 'deposit',
        amount: '',
      };
      renderSavingDepositModal();
    }

    function renderSavingDepositModal() {
      openModal(`
        <div class="modal-header">
          <span class="modal-title">🐷 Setor / Tarik Tabungan</span>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <button type="button" class="hero-btn" style="background:${form.mode==='deposit'?'var(--green)':'#E2E8F0'};color:${form.mode==='deposit'?'#fff':'var(--text)'}" onclick="form.mode='deposit';renderSavingDepositModal();">＋ Setor Nabung</button>
          <button type="button" class="hero-btn" style="background:${form.mode==='withdraw'?'var(--warning)':'#E2E8F0'};color:${form.mode==='withdraw'?'#fff':'var(--text)'}" onclick="form.mode='withdraw';renderSavingDepositModal();">－ Tarik Tabungan</button>
        </div>
        <label class="form-label">Pilih Celengan Tabungan</label>
        <select class="form-control" onchange="form.savingId=this.value">
          ${state.savings.map(s => `<option value="${s.id}" ${form.savingId===s.id?'selected':''}>${s.icon} ${escapeHtml(s.name)} (${formatRupiah(s.current)})</option>`).join('')}
        </select>
        <label class="form-label">${form.mode === 'deposit' ? 'Ambil Saldo dari Bank/Dompet' : 'Masukkan ke Bank/Dompet'}</label>
        <select class="form-control" onchange="form.walletId=this.value">
          ${state.wallets.map(w => `<option value="${w.id}" ${form.walletId===w.id?'selected':''}>${escapeHtml(w.name)}</option>`).join('')}
        </select>
        <label class="form-label">Nominal (Rp)</label>
        <input id="savDepInput" type="text" inputmode="numeric" class="form-control" style="font-size:20px;font-weight:800;" placeholder="0" value="${formatThousands(form.amount)}" oninput="form.amount=this.value.replace(/\\D/g,'');this.value=formatThousands(form.amount);" />
        <button class="btn-submit" onclick="saveSavingDeposit()">💾 Simpan</button>
      `);
    }

    function saveSavingDeposit() {
      const amt = parseInt(form.amount, 10) || 0;
      if (amt <= 0) return;
      const target = state.savings.find(s => s.id === form.savingId);
      if (!target) return;
      if (form.mode === 'deposit') {
        target.current = (Number(target.current) || 0) + amt;
        state.transactions.unshift({
          id: uid(), type: 'expense', amount: amt, categoryId: 'other_exp',
          walletId: form.walletId, note: `Nabung ke ${target.name}`, date: new Date().toISOString().slice(0, 10)
        });
      } else {
        target.current = Math.max(0, (Number(target.current) || 0) - amt);
        state.transactions.unshift({
          id: uid(), type: 'income', amount: amt, categoryId: 'cashback',
          walletId: form.walletId, note: `Tarik dari ${target.name}`, date: new Date().toISOString().slice(0, 10)
        });
      }
      closeModal();
      saveState();
    }

    /* 4. MODAL TARGET TABUNGAN */
    const SAVING_PRESETS = [
      { name: 'Dana Darurat', icon: '🛡️' },
      { name: 'Beli HP / Gadget', icon: '📱' },
      { name: 'Rakit PC / Laptop', icon: '💻' },
      { name: 'Beli Motor / Mobil', icon: '🛵' },
      { name: 'Liburan / Healing', icon: '✈️' },
      { name: 'Modal Nikah', icon: '💍' },
      { name: 'Beli Rumah / Kost', icon: '🏠' },
      { name: 'Nonton Konser', icon: '🎫' },
      { name: 'Tabungan Umroh/Haji', icon: '🕋' },
    ];

    function openSavingModal(savingId = null) {
      const s = savingId ? state.savings.find(x => x.id === savingId) : null;
      form = {
        id: s ? s.id : null,
        name: s ? s.name : '',
        icon: s ? s.icon : '🐷',
        current: s ? String(s.current || '') : '',
        target: s ? String(s.target || '') : '',
        confirmDelete: false,
      };
      renderSavingModal();
    }

    function renderSavingModal() {
      const s = !!form.id;
      openModal(`
        <div class="modal-header">
          <span class="modal-title">${s ? '✏️ Edit Target Tabungan' : '🐷 Buat Target Tabungan'}</span>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <label class="form-label" style="margin-top:0;">Pilih Cepat Tujuan Tabungan (Atau ketik sendiri)</label>
        <div class="preset-grid">
          ${SAVING_PRESETS.map(p => `
            <button type="button" class="preset-btn ${form.name === p.name ? 'selected' : ''}" onclick="form.name='${p.name}';form.icon='${p.icon}';renderSavingModal();">
              <span>${p.icon}</span>
              <span>${p.name}</span>
            </button>
          `).join('')}
        </div>

        <label class="form-label">Nama Target Tabungan</label>
        <input class="form-control" style="font-weight:700;" placeholder="Ketik nama tabungan..." value="${escapeHtml(form.name)}" oninput="form.name=this.value" />

        <label class="form-label">Saldo Tabungan Terkumpul Saat Ini (Rp)</label>
        <input type="text" inputmode="numeric" class="form-control" style="font-size:18px;font-weight:800;" placeholder="0" value="${formatThousands(form.current)}" oninput="form.current=this.value.replace(/\\D/g,'');this.value=formatThousands(form.current);" />

        <label class="form-label">Target yang Ingin Dicapai (Rp)</label>
        <input type="text" inputmode="numeric" class="form-control" style="font-size:18px;font-weight:800;" placeholder="0" value="${formatThousands(form.target)}" oninput="form.target=this.value.replace(/\\D/g,'');this.value=formatThousands(form.target);" />

        <button class="btn-submit" onclick="saveSavingGoal()">💾 Simpan Tabungan</button>
        ${s ? (
          !form.confirmDelete
            ? `<button type="button" class="btn-danger" onclick="form.confirmDelete=true;renderSavingModal();">🗑️ Hapus Celengan Ini</button>`
            : `<button type="button" class="btn-danger" style="background:var(--danger);color:#fff;" onclick="deleteSavingGoal('${form.id}')">⚠️ Yakin Hapus? Ketuk Sekali Lagi</button>`
        ) : ''}
      `);
    }

    function saveSavingGoal() {
      if (!form.name.trim()) return;
      const payload = {
        id: form.id || uid(),
        name: form.name.trim(),
        icon: form.icon || '🐷',
        current: parseInt(form.current, 10) || 0,
        target: parseInt(form.target, 10) || 1000000,
      };
      if (form.id) state.savings = state.savings.map(s => s.id === form.id ? payload : s);
      else state.savings.push(payload);
      closeModal();
      saveState();
    }

    function deleteSavingGoal(id) {
      state.savings = state.savings.filter(s => s.id !== id);
      closeModal();
      saveState();
    }

    /* 5. MODAL EDIT NAMA PROFIL (MENGGANTIKAN window.prompt) */
    function openProfileModal() {
      form = { userName: state.userName || 'Alfian Dimas' };
      openModal(`
        <div class="modal-header">
          <span class="modal-title">👤 Ubah Nama Profil</span>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <label class="form-label" style="margin-top:0;">Nama Kamu</label>
        <input class="form-control" style="font-size:16px;font-weight:700;" value="${escapeHtml(form.userName)}" oninput="form.userName=this.value" />
        <button class="btn-submit" onclick="if(form.userName.trim()){state.userName=form.userName.trim();closeModal();saveState();}">💾 Simpan Nama</button>
      `);
    }

    /* 6. MODAL PENGATURAN & RESET DATA (MENGGANTIKAN window.confirm) */
    function openSettingsModal() {
      form = { confirmZero: false };
      renderSettingsModal();
    }

    function renderSettingsModal() {
      openModal(`
        <div class="modal-header">
          <span class="modal-title">⚙️ Pengaturan Data Keuangan</span>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <p style="font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5;">
          Semua catatan keuangan, saldo bank, dan tabunganmu tersimpan otomatis di dalam HP/perangkat ini.
        </p>

        ${!form.confirmZero ? `
          <button type="button" class="btn-danger" style="background:var(--danger);color:#fff;" onclick="form.confirmZero=true;renderSettingsModal();">
            🗑️ Mulai dari Nol (Set Semua Saldo Rp 0)
          </button>
        ` : `
          <button type="button" class="btn-danger" style="background:#991B1B;color:#fff;" onclick="resetToZeroNow()">
            ⚠️ Yakin Kosongkan Semua Jadi Rp 0? Ketuk di Sini
          </button>
        `}

        <button type="button" class="btn-submit" style="background:var(--blue);margin-top:10px;" onclick="state=getDefaultData();closeModal();saveState();">
          🔄 Isi Kembali Data Contoh
        </button>
      `);
    }

    function resetToZeroNow() {
      state.transactions = [];
      state.savings = [];
      state.wallets.forEach(w => { w.initialBalance = 0; });
      closeModal();
      saveState();
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then((reg) => reg.update()).catch(() => {});
    }

    saveState();
  </script>
</body>
</html>
