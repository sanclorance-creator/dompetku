<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0E314A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DompetKu" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>DompetKu — Keuangan Pribadi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-top: #133955;
      --navy-bottom: #0B253A;
      --green: #93C854;
      --green-dark: #65A30D;
      --blue: #4195D5;
      --bg: #F2F6FA;
      --card: #FFFFFF;
      --text: #133F5D;
      --muted: #6E8494;
      --border: #E3EBF2;
      --danger: #E35273;
      --warning: #F59E0B;
      --shadow: 0 4px 16px rgba(19, 63, 93, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    /* ==================== SIDEBAR (DESKTOP) & BOTTOM NAV (MOBILE) ==================== */
    .sidebar {
      width: 230px;
      background: linear-gradient(180deg, var(--navy-top) 0%, var(--navy-bottom) 100%);
      color: #fff;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      padding: 20px 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 10px 24px;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .brand-text {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nav-btn {
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.72);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .nav-btn.active {
      background: rgba(147, 200, 84, 0.16);
      color: var(--green);
      font-weight: 800;
    }
    .nav-icon {
      font-size: 18px;
      line-height: 1;
    }

    /* ==================== MAIN CONTENT ==================== */
    .main {
      margin-left: 230px;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    /* Topbar */
    .topbar {
      height: 62px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #ECF6DF;
      border: 1.5px solid #B7DC82;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }
    .user-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
    }
    .user-sub {
      font-size: 11px;
      color: #77B833;
      font-weight: 700;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-btn {
      border: 1px solid var(--border);
      background: #F8FAFC;
      color: var(--text);
      height: 36px;
      padding: 0 12px;
      border-radius: 99px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Page container */
    .container {
      padding: 20px 24px 90px;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
    }

    /* ==================== TOP SUMMARY CARDS ==================== */
    .summary-grid {
      display: grid;
      grid-template-columns: 1.35fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 22px;
    }

    /* Paper.id Hero Balance Card */
    .hero-card {
      background: linear-gradient(125deg, #7BB642 0%, #3E885B 40%, #164B68 80%, #0E314A 100%);
      border-radius: 16px;
      padding: 20px;
      color: #fff;
      box-shadow: 0 8px 20px rgba(14, 49, 74, 0.18);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      opacity: 0.92;
    }
    .hero-balance {
      font-size: 28px;
      font-weight: 800;
      margin: 8px 0 14px;
      letter-spacing: -0.5px;
      word-break: break-word;
    }
    .hero-btn-row {
      display: flex;
      gap: 8px;
    }
    .hero-btn {
      flex: 1;
      border: none;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .hero-btn.in {
      background: var(--green);
      color: #fff;
    }
    .hero-btn.out {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.28);
    }
    .hero-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      margin-top: 14px;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
    }

    /* White Metric Card */
    .stat-card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .stat-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }
    .stat-val {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      margin: 8px 0 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .stat-sub {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
    }
    .stat-link {
      background: none;
      border: none;
      color: var(--blue);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      text-align: right;
      margin-top: 10px;
    }

    /* ==================== QUICK ACTIONS (4 BUTTONS) ==================== */
    .section-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }
    .quick-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: var(--shadow);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: transform 0.15s, border-color 0.15s;
    }
    .quick-card:active {
      transform: scale(0.98);
    }
    .quick-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .quick-card h4 {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text);
    }
    .quick-card p {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ==================== 2-COLUMN CONTENT GRID ==================== */
    .two-col {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 18px;
      align-items: start;
    }
    .card-box {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    /* Transaction Item Row (Clean Mobile-First Card Row) */
    .tx-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      gap: 10px;
    }
    .tx-row:last-child {
      border-bottom: none;
      padding-bottom: 2px;
    }
    .tx-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }
    .tx-badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .tx-info {
      min-width: 0;
      flex: 1;
    }
    .tx-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tx-meta {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tx-right {
      text-align: right;
      flex-shrink: 0;
    }
    .tx-amt {
      font-size: 13.5px;
      font-weight: 800;
    }
    .tx-wallet-tag {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Progress bar */
    .progress-track {
      height: 8px;
      background: #E2E8F0;
      border-radius: 99px;
      overflow: hidden;
      margin: 6px 0;
    }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    /* ==================== MODAL SHEET ==================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(11, 37, 58, 0.55);
      backdrop-filter: blur(2px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .modal-title {
      font-size: 16px;
      font-weight: 800;
    }
    .close-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: #F1F5F9;
      font-weight: 800;
      cursor: pointer;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      margin: 12px 0 6px;
    }
    .form-control {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      background: #fff;
    }
    .form-control:focus {
      border-color: var(--blue);
    }
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .cat-btn {
      border: 1.5px solid var(--border);
      background: #F8FAFC;
      border-radius: 10px;
      padding: 8px 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
    }
    .cat-btn.selected {
      border-color: var(--blue);
      background: #EBF5FF;
    }
    .btn-submit {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      background: var(--green);
      cursor: pointer;
      margin-top: 16px;
    }

    /* ==================== RESPONSIVE MOBILE DESIGN (< 768px) ==================== */
    @media (max-width: 960px) {
      .summary-grid { grid-template-columns: 1fr; }
      .two-col { grid-template-columns: 1fr; }
      .quick-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      /* Turn sidebar into clean 5-item bottom tab bar */
      .sidebar {
        width: 100%;
        height: 64px;
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        flex-direction: row;
        padding: 4px 6px;
        box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.12);
      }
      .brand { display: none; }
      .nav-list {
        flex-direction: row;
        width: 100%;
        justify-content: space-around;
        align-items: center;
        gap: 2px;
      }
      .nav-btn {
        flex: 1;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 6px 2px;
        gap: 3px;
        font-size: 10.5px;
        border-radius: 8px;
        text-align: center;
      }
      .nav-icon { font-size: 19px; }

      .main {
        margin-left: 0;
      }
      .topbar {
        padding: 0 14px;
        height: 56px;
      }
      .container {
        padding: 14px 14px 86px;
      }
      .hero-balance {
        font-size: 25px;
      }
      .quick-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .quick-card {
        padding: 12px;
        gap: 10px;
      }
      .quick-icon {
        width: 36px;
        height: 36px;
        font-size: 17px;
      }
      .quick-card h4 {
        font-size: 12.5px;
      }
      .quick-card p {
        display: none;
      }
      .modal-backdrop {
        align-items: flex-end;
        padding: 0;
      }
      .modal-box {
        max-width: 100%;
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
        padding: 18px 16px 28px;
      }
    }
  </style>
</head>
<body>

  <!-- NAVIGATION (Sidebar on Desktop, Bottom Tab Bar on Mobile) -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">💰</div>
      <span class="brand-text">DOMPETKU</span>
    </div>
    <nav class="nav-list">
      <button class="nav-btn active" data-page="dashboard" onclick="navigate('dashboard')">
        <span class="nav-icon">🏠</span>
        <span>Beranda</span>
      </button>
      <button class="nav-btn" data-page="income" onclick="navigate('income')">
        <span class="nav-icon">📥</span>
        <span>Masuk</span>
      </button>
      <button class="nav-btn" data-page="expense" onclick="navigate('expense')">
        <span class="nav-icon">📤</span>
        <span>Keluar</span>
      </button>
      <button class="nav-btn" data-page="savings" onclick="navigate('savings')">
        <span class="nav-icon">🐷</span>
        <span>Tabungan</span>
      </button>
      <button class="nav-btn" data-page="wallets" onclick="navigate('wallets')">
        <span class="nav-icon">💳</span>
        <span>Dompet</span>
      </button>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main">
    <header class="topbar">
      <div class="user-chip" onclick="editUserName()">
        <div class="user-avatar">💰</div>
        <div>
          <div class="user-name" id="userNameText">Alfian Dimas</div>
          <div class="user-sub">Keuangan Pribadi</div>
        </div>
      </div>

      <div class="topbar-actions">
        <button class="icon-btn" onclick="hideBalance=!hideBalance;renderPage();" title="Sembunyikan/Tampilkan Saldo">
          <span id="eyeIcon">👁️</span>
        </button>
        <button class="icon-btn" onclick="openSettingsModal()" title="Pengaturan Data">
          ⚙️ Reset
        </button>
      </div>
    </header>

    <main class="container" id="pageContent"></main>
  </div>

  <!-- MODAL -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target.id==='modalBackdrop') closeModal()">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <script>
    const EXPENSE_CATEGORIES = [
      { id: 'food', name: 'Makan', icon: '🍜', color: '#F97316' },
      { id: 'coffee', name: 'Ngopi/Jajan', icon: '☕', color: '#D97706' },
      { id: 'transport', name: 'Transport', icon: '🛵', color: '#3B82F6' },
      { id: 'shopping', name: 'Belanja', icon: '🛍️', color: '#EC4899' },
      { id: 'bills', name: 'Tagihan', icon: '⚡', color: '#8B5CF6' },
      { id: 'entertainment', name: 'Hiburan', icon: '🎮', color: '#14B8A6' },
      { id: 'health', name: 'Kesehatan', icon: '💊', color: '#EF4444' },
      { id: 'other_exp', name: 'Lainnya', icon: '📦', color: '#64748B' },
    ];

    const INCOME_CATEGORIES = [
      { id: 'salary', name: 'Gaji', icon: '💰', color: '#10B981' },
      { id: 'sidejob', name: 'Sampingan', icon: '💻', color: '#3B82F6' },
      { id: 'bonus', name: 'Bonus/THR', icon: '🎁', color: '#F59E0B' },
      { id: 'gift', name: 'Transferan', icon: '🤲', color: '#8B5CF6' },
      { id: 'other_inc', name: 'Lainnya', icon: '✨', color: '#6366F1' },
    ];

    const WALLET_TYPES = [
      { id: 'bank', name: 'Rekening Bank', icon: '🏦' },
      { id: 'ewallet', name: 'E-Wallet', icon: '📱' },
      { id: 'cash', name: 'Uang Tunai', icon: '💵' },
    ];

    const MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    const STORAGE_KEY = 'dompetku_personal_v2';

    let currentPage = 'dashboard';
    let hideBalance = false;

    function getDefaultData() {
      return {
        userName: 'Alfian Dimas',
        wallets: [
          { id: 'w_bca', name: 'BCA', type: 'bank', initialBalance: 3200000 },
          { id: 'w_gopay', name: 'GoPay / DANA', type: 'ewallet', initialBalance: 450000 },
          { id: 'w_cash', name: 'Dompet Tunai', type: 'cash', initialBalance: 300000 },
        ],
        transactions: [
          { id: 't1', type: 'income', amount: 6500000, categoryId: 'salary', walletId: 'w_bca', note: 'Gaji Bulan Ini', date: '2026-10-01' },
          { id: 't2', type: 'income', amount: 1200000, categoryId: 'sidejob', walletId: 'w_bca', note: 'Project Freelance', date: '2026-10-10' },
          { id: 't3', type: 'expense', amount: 45000, categoryId: 'food', walletId: 'w_gopay', note: 'Makan Siang Ayam Bakar', date: '2026-10-16' },
          { id: 't4', type: 'expense', amount: 25000, categoryId: 'coffee', walletId: 'w_gopay', note: 'Es Kopi Susu', date: '2026-10-16' },
          { id: 't5', type: 'expense', amount: 150000, categoryId: 'transport', walletId: 'w_cash', note: 'Isi Bensin', date: '2026-10-15' },
          { id: 't6', type: 'expense', amount: 350000, categoryId: 'bills', walletId: 'w_bca', note: 'Listrik & Kuota Internet', date: '2026-10-12' },
        ],
        savings: [
          { id: 's1', name: 'Dana Darurat', icon: '🛡️', current: 4500000, target: 10000000 },
          { id: 's2', name: 'Beli Gadget / Laptop', icon: '💻', current: 3000000, target: 8000000 },
          { id: 's3', name: 'Liburan', icon: '✈️', current: 1500000, target: 4000000 },
        ],
        budgets: [
          { categoryId: 'food', limit: 1500000 },
          { categoryId: 'coffee', limit: 350000 },
          { categoryId: 'transport', limit: 500000 },
        ]
      };
    }

    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      const def = getDefaultData();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(def));
      return def;
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      document.getElementById('userNameText').textContent = state.userName || 'Alfian Dimas';
      document.getElementById('eyeIcon').textContent = hideBalance ? '🙈' : '👁️';
      renderPage();
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function formatRupiah(n, masked = false) {
      if (masked && hideBalance) return 'Rp •••••••';
      const num = Number(n) || 0;
      const formatted = Math.round(Math.abs(num)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return `${num < 0 ? '-' : ''}Rp ${formatted}`;
    }

    function formatThousands(val) {
      const digits = String(val || '').replace(/\D/g, '');
      if (!digits) return '';
      return digits.replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function formatDateIndo(dateStr) {
      const d = new Date(dateStr);
      if (isNaN(d)) return dateStr;
      return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]} ${d.getFullYear()}`;
    }

    function getCategory(id) {
      return [...EXPENSE_CATEGORIES, ...INCOME_CATEGORIES].find(c => c.id === id) ||
        { id, name: 'Lainnya', icon: '📦', color: '#64748B' };
    }

    function getWallet(id) {
      return state.wallets.find(w => w.id === id) || state.wallets[0] || { name: 'Utama' };
    }

    function getWalletType(typeId) {
      return WALLET_TYPES.find(t => t.id === typeId) || WALLET_TYPES[0];
    }

    function computeTotals() {
      const walletBalances = {};
      state.wallets.forEach(w => { walletBalances[w.id] = Number(w.initialBalance) || 0; });

      let totalIncome = 0;
      let totalExpense = 0;
      const expenseByCategory = {};

      state.transactions.forEach(t => {
        const amt = Number(t.amount) || 0;
        if (t.type === 'income') {
          totalIncome += amt;
          if (walletBalances[t.walletId] !== undefined) walletBalances[t.walletId] += amt;
        } else {
          totalExpense += amt;
          expenseByCategory[t.categoryId] = (expenseByCategory[t.categoryId] || 0) + amt;
          if (walletBalances[t.walletId] !== undefined) walletBalances[t.walletId] -= amt;
        }
      });

      const totalWalletBalance = Object.values(walletBalances).reduce((a, b) => a + b, 0);
      const totalSavings = (state.savings || []).reduce((s, item) => s + (Number(item.current) || 0), 0);
      const totalSavingsTarget = (state.savings || []).reduce((s, item) => s + (Number(item.target) || 0), 0);

      return {
        walletBalances,
        totalWalletBalance,
        totalIncome,
        totalExpense,
        expenseByCategory,
        totalSavings,
        totalSavingsTarget,
      };
    }

    function navigate(page) {
      currentPage = page;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.page === page);
      });
      window.scrollTo(0, 0);
      renderPage();
    }

    function renderTxRow(tx) {
      const cat = getCategory(tx.categoryId);
      const w = getWallet(tx.walletId);
      const isInc = tx.type === 'income';
      return `
        <div class="tx-row" onclick="openTxModal('${tx.type}', '${tx.id}')">
          <div class="tx-left">
            <div class="tx-badge" style="background:${cat.color}18;">${cat.icon}</div>
            <div class="tx-info">
              <div class="tx-title">${escapeHtml(tx.note || cat.name)}</div>
              <div class="tx-meta">${formatDateIndo(tx.date)} • ${cat.name}</div>
            </div>
          </div>
          <div class="tx-right">
            <div class="tx-amt" style="color:${isInc ? '#65A30D' : '#E35273'};">
              ${isInc ? '+' : '-'}${formatRupiah(tx.amount, true)}
            </div>
            <div class="tx-wallet-tag">${escapeHtml(w.name)}</div>
          </div>
        </div>
      `;
    }

    function renderPage() {
      const el = document.getElementById('pageContent');
      if (currentPage === 'dashboard') el.innerHTML = renderDashboard();
      else if (currentPage === 'income') el.innerHTML = renderTxListPage('income');
      else if (currentPage === 'expense') el.innerHTML = renderTxListPage('expense');
      else if (currentPage === 'savings') el.innerHTML = renderSavingsPage();
      else if (currentPage === 'wallets') el.innerHTML = renderWalletsPage();
    }

    /* ==================== MODALS ==================== */
    let form = {};

    function openModal(html) {
      document.getElementById('modalBox').innerHTML = html;
      document.getElementById('modalBackdrop').classList.add('open');
    }
    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
    }

    function openTxModal(type = 'expense', txId = null) {
      const existing = txId ? state.transactions.find(t => t.id === txId) : null;
      const cats = (existing ? existing.type : type) === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
      form = {
        id: existing ? existing.id : null,
        type: existing ? existing.type : type,
        note: existing ? existing.note : '',
        amount: existing ? String(existing.amount) : '',
        categoryId: existing ? existing.categoryId : cats[0].id,
        walletId: existing ? existing.walletId : (state.wallets[0] ? state.wallets[0].id : ''),
        date: existing ? existing.date : new Date().toISOString().slice(0, 10),
      };
      renderTxModal();
    }

    function renderTxModal() {
      const cats = form.type === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
      if (!cats.some(c => c.id === form.categoryId)) form.categoryId = cats[0].id;

      openModal(`
        <div class="modal-header">
          <span class="modal-title">${form.id ? 'Edit Transaksi' : (form.type === 'income' ? 'Catat Pemasukan' : 'Catat Pengeluaran')}</span>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <button type="button" class="hero-btn" style="background:${form.type==='income'?'var(--green)':'#E2E8F0'};color:${form.type==='income'?'#fff':'var(--text)'}" onclick="form.type='income';renderTxModal();">📥 Pemasukan</button>
          <button type="button" class="hero-btn" style="background:${form.type==='expense'?'var(--danger)':'#E2E8F0'};color:${form.type==='expense'?'#fff':'var(--text)'}" onclick="form.type='expense';renderTxModal();">📤 Pengeluaran</button>
        </div>

        <label class="form-label">Nominal (Rp)</label>
        <input type="text" inputmode="numeric" class="form-control" style="font-size:20px;font-weight:800;" placeholder="0" value="${formatThousands(form.amount)}" oninput="form.amount=this.value.replace(/\\D/g,'');this.value=formatThousands(form.amount);" />

        <label class="form-label">Catatan</label>
        <input class="form-control" placeholder="Cth: Makan siang, Gaji, Bensin..." value="${escapeHtml(form.note)}" oninput="form.note=this.value" />

        <label class="form-label">Kategori</label>
        <div class="cat-grid">
          ${cats.map(c => `
            <button type="button" class="cat-btn ${form.categoryId === c.id ? 'selected' : ''}" onclick="form.categoryId='${c.id}';renderTxModal();">
              <span style="font-size:18px;">${c.icon}</span>
              <span>${c.name}</span>
            </button>
          `).join('')}
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div>
            <label class="form-label">Dompet</label>
            <select class="form-control" onchange="form.walletId=this.value">
              ${state.wallets.map(w => `<option value="${w.id}" ${form.walletId===w.id?'selected':''}>${escapeHtml(w.name)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="form-label">Tanggal</label>
            <input type="date" class="form-control" value="${form.date}" onchange="form.date=this.value" />
          </div>
        </div>

        <button class="btn-submit" onclick="saveTx()">Simpan Transaksi</button>
        ${form.id ? `<button class="btn-submit" style="background:var(--danger);margin-top:8px;" onclick="deleteTx('${form.id}')">Hapus Transaksi</button>` : ''}
      `);
    }

    function saveTx() {
      const amt = parseInt(form.amount, 10) || 0;
      if (amt <= 0) return alert('Masukkan nominal yang valid.');
      const cat = getCategory(form.categoryId);
      const payload = {
        id: form.id || uid(),
        type: form.type,
        amount: amt,
        note: form.note.trim() || cat.name,
        categoryId: form.categoryId,
        walletId: form.walletId,
        date: form.date,
      };
      if (form.id) state.transactions = state.transactions.map(t => t.id === form.id ? payload : t);
      else state.transactions.unshift(payload);
      closeModal();
      saveState();
    }

    function deleteTx(id) {
      if (!confirm('Hapus transaksi ini?')) return;
      state.transactions = state.transactions.filter(t => t.id !== id);
      closeModal();
      saveState();
    }

    function openSavingDepositModal() {
      if (!state.savings.length) return openSavingModal();
      form = {
        savingId: state.savings[0].id,
        walletId: state.wallets[0] ? state.wallets[0].id : '',
        mode: 'deposit',
        amount: '',
      };
      renderSavingDepositModal();
    }

    function renderSavingDepositModal() {
      openModal(`
        <div class="modal-header">
          <span class="modal-title">Setor / Tarik Tabungan 🐷</span>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <button type="button" class="hero-btn" style="background:${form.mode==='deposit'?'var(--green)':'#E2E8F0'};color:${form.mode==='deposit'?'#fff':'var(--text)'}" onclick="form.mode='deposit';renderSavingDepositModal();">＋ Setor Nabung</button>
          <button type="button" class="hero-btn" style="background:${form.mode==='withdraw'?'var(--warning)':'#E2E8F0'};color:${form.mode==='withdraw'?'#fff':'var(--text)'}" onclick="form.mode='withdraw';renderSavingDepositModal();">－ Tarik Tabungan</button>
        </div>
        <label class="form-label">Celengan Tabungan</label>
        <select class="form-control" onchange="form.savingId=this.value">
          ${state.savings.map(s => `<option value="${s.id}" ${form.savingId===s.id?'selected':''}>${s.icon} ${escapeHtml(s.name)} (${formatRupiah(s.current)})</option>`).join('')}
        </select>
        <label class="form-label">${form.mode === 'deposit' ? 'Ambil dari Dompet' : 'Masukkan ke Dompet'}</label>
        <select class="form-control" onchange="form.walletId=this.value">
          ${state.wallets.map(w => `<option value="${w.id}" ${form.walletId===w.id?'selected':''}>${escapeHtml(w.name)}</option>`).join('')}
        </select>
        <label class="form-label">Nominal (Rp)</label>
        <input type="text" inputmode="numeric" class="form-control" style="font-size:20px;font-weight:800;" placeholder="0" value="${formatThousands(form.amount)}" oninput="form.amount=this.value.replace(/\\D/g,'');this.value=formatThousands(form.amount);" />
        <button class="btn-submit" onclick="saveSavingDeposit()">Simpan</button>
      `);
    }

    function saveSavingDeposit() {
      const amt = parseInt(form.amount, 10) || 0;
      if (amt <= 0) return alert('Masukkan nominal yang valid.');
      const target = state.savings.find(s => s.id === form.savingId);
      if (!target) return;
      if (form.mode === 'deposit') {
        target.current = (Number(target.current) || 0) + amt;
        state.transactions.unshift({
          id: uid(), type: 'expense', amount: amt, categoryId: 'other_exp',
          walletId: form.walletId, note: `Nabung ke ${target.name}`, date: new Date().toISOString().slice(0, 10)
        });
      } else {
        target.current = Math.max(0, (Number(target.current) || 0) - amt);
        state.transactions.unshift({
          id: uid(), type: 'income', amount: amt, categoryId: 'other_inc',
          walletId: form.walletId, note: `Tarik dari ${target.name}`, date: new Date().toISOString().slice(0, 10)
        });
      }
      closeModal();
      saveState();
    }

    function openSavingModal(savingId = null) {
      const s = savingId ? state.savings.find(x => x.id === savingId) : null;
      form = {
        id: s ? s.id : null,
        name: s ? s.name : '',
        icon: s ? s.icon : '🐷',
        current: s ? String(s.current || '') : '',
        target: s ? String(s.target || '') : '',
      };
      openModal(`
        <div class="modal-header">
          <span class="modal-title">${s ? 'Edit Celengan' : 'Buat Target Tabungan'}</span>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <label class="form-label">Nama Target Tabungan</label>
        <input class="form-control" placeholder="Cth: Dana Darurat, Beli Motor, Liburan..." value="${escapeHtml(form.name)}" oninput="form.name=this.value" />
        <label class="form-label">Terkumpul Saat Ini (Rp)</label>
        <input type="text" inputmode="numeric" class="form-control" placeholder="0" value="${formatThousands(form.current)}" oninput="form.current=this.value.replace(/\\D/g,'');this.value=formatThousands(form.current);" />
        <label class="form-label">Target Tabungan (Rp)</label>
        <input type="text" inputmode="numeric" class="form-control" placeholder="0" value="${formatThousands(form.target)}" oninput="form.target=this.value.replace(/\\D/g,'');this.value=formatThousands(form.target);" />
        <button class="btn-submit" onclick="saveSavingGoal()">Simpan Tabungan</button>
        ${s ? `<button class="btn-submit" style="background:var(--danger);margin-top:8px;" onclick="deleteSavingGoal('${s.id}')">Hapus Celengan</button>` : ''}
      `);
    }

    function saveSavingGoal() {
      if (!form.name.trim()) return alert('Nama tabungan wajib diisi.');
      const payload = {
        id: form.id || uid(),
        name: form.name.trim(),
        icon: form.icon || '🐷',
        current: parseInt(form.current, 10) || 0,
        target: parseInt(form.target, 10) || 1000000,
      };
      if (form.id) state.savings = state.savings.map(s => s.id === form.id ? payload : s);
      else state.savings.push(payload);
      closeModal();
      saveState();
    }

    function deleteSavingGoal(id) {
      if (!confirm('Hapus celengan ini?')) return;
      state.savings = state.savings.filter(s => s.id !== id);
      closeModal();
      saveState();
    }

    function openWalletModal(walletId = null) {
      const w = walletId ? state.wallets.find(x => x.id === walletId) : null;
      form = {
        id: w ? w.id : null,
        name: w ? w.name : '',
        type: w ? w.type : 'bank',
        initialBalance: w ? String(w.initialBalance || '') : '',
      };
      openModal(`
        <div class="modal-header">
          <span class="modal-title">${w ? 'Edit Dompet' : 'Tambah Dompet'}</span>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <label class="form-label">Jenis Dompet</label>
        <select class="form-control" onchange="form.type=this.value">
          ${WALLET_TYPES.map(t => `<option value="${t.id}" ${form.type===t.id?'selected':''}>${t.icon} ${t.name}</option>`).join('')}
        </select>
        <label class="form-label">Nama Dompet</label>
        <input class="form-control" placeholder="Cth: BCA, GoPay, Tunai" value="${escapeHtml(form.name)}" oninput="form.name=this.value" />
        <label class="form-label">Saldo Awal (Rp)</label>
        <input type="text" inputmode="numeric" class="form-control" placeholder="0" value="${formatThousands(form.initialBalance)}" oninput="form.initialBalance=this.value.replace(/\\D/g,'');this.value=formatThousands(form.initialBalance);" />
        <button class="btn-submit" onclick="saveWallet()">Simpan Dompet</button>
        ${w && state.wallets.length > 1 ? `<button class="btn-submit" style="background:var(--danger);margin-top:8px;" onclick="deleteWallet('${w.id}')">Hapus Dompet</button>` : ''}
      `);
    }

    function saveWallet() {
      if (!form.name.trim()) return alert('Nama dompet wajib diisi.');
      const payload = {
        id: form.id || uid(),
        name: form.name.trim(),
        type: form.type,
        initialBalance: parseInt(form.initialBalance, 10) || 0,
      };
      if (form.id) state.wallets = state.wallets.map(w => w.id === form.id ? payload : w);
      else state.wallets.push(payload);
      closeModal();
      saveState();
    }

    function deleteWallet(id) {
      if (!confirm('Hapus dompet ini?')) return;
      state.wallets = state.wallets.filter(w => w.id !== id);
      closeModal();
      saveState();
    }

    function openSettingsModal() {
      openModal(`
        <div class="modal-header">
          <span class="modal-title">Pengaturan Data</span>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">
          Semua data tersimpan otomatis di HP/browser kamu.
        </p>
        <button class="btn-submit" style="background:var(--blue);margin-top:0;" onclick="state=getDefaultData();closeModal();saveState();">🔄 Isi Data Contoh</button>
        <button class="btn-submit" style="background:var(--danger);margin-top:10px;" onclick="if(confirm('Kosongkan semua saldo ke Rp 0?')){state.transactions=[];state.savings=[];state.wallets.forEach(w=>w.initialBalance=0);closeModal();saveState();}">🗑️ Mulai dari Nol (Rp 0)</button>
      `);
    }

    function editUserName() {
      const name = prompt('Nama kamu:', state.userName || 'Alfian Dimas');
      if (name && name.trim()) {
        state.userName = name.trim();
        saveState();
      }
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then((reg) => reg.update()).catch(() => {});
    }

    saveState();
  </script>
</body>
</html>
